# Append after the production overlays; keep the data plane on its existing networks.
services:
  helix:
    networks:
      app-federation:
        aliases:
          - helix-workspace
  caddy:
    networks:
      app-federation:
        aliases:
          - ${HELIX_DOMAIN:?set the public Workspace hostname for signed storage URLs}

networks:
  app-federation:
    external: true
    name: ${HELIX_FEDERATION_NETWORK:-helix-federation}

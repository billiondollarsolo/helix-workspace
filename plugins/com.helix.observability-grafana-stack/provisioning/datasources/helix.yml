apiVersion: 1

datasources:
  - name: Helix Prometheus
    uid: helix-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Helix Tempo
    uid: helix-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: helix-loki
      serviceMap:
        datasourceUid: helix-prometheus
  - name: Helix Loki
    uid: helix-loki
    type: loki
    access: proxy
    url: http://loki:3100

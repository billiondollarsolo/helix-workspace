[auth.anonymous]
enabled = false

[users]
allow_sign_up = false

[security]
cookie_secure = true
cookie_samesite = strict
disable_gravatar = true

[server]
protocol = https
cert_file = /var/run/grafana-server/tls.crt
cert_key = /var/run/grafana-server/tls.key
router_logging = true

[dataproxy]
timeout = 60
keep_alive_seconds = 30

[log]
mode = console
level = info
format = json

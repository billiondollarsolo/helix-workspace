# Rspamd's Redis-backed limits complement Postfix's connection/recipient limits.
rates {
  inbound_ip = {
    selector = "ip";
    bucket = [
      { burst = 50; rate = "100 / 1min"; },
      { burst = 500; rate = "1000 / 1h"; }
    ];
  }
  duplicate_digest = {
    selector = "digest";
    bucket = { burst = 2; rate = "1 / 10min"; };
  }
}

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-default-deny
  namespace: helix-observability
spec:
  podSelector:
    matchLabels:
      helix.io/stack: observability
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector
  namespace: helix-observability
spec:
  podSelector:
    matchLabels:
      helix.io/component: otel-collector
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: helix
          podSelector:
            matchLabels:
              helix.io/telemetry-client: "true"
      ports:
        - { protocol: TCP, port: 4318 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              helix.io/component: tempo
      ports:
        - { protocol: TCP, port: 4317 }
    - to:
        - podSelector:
            matchLabels:
              helix.io/component: loki
      ports:
        - { protocol: TCP, port: 3100 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki
  namespace: helix-observability
spec:
  podSelector:
    matchLabels:
      helix.io/component: loki
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              helix.io/component: otel-collector
      ports:
        - { protocol: TCP, port: 3100 }
    - from:
        - podSelector:
            matchLabels:
              helix.io/component: grafana
      ports:
        - { protocol: TCP, port: 3100 }
    - from:
        - podSelector:
            matchLabels:
              helix.io/component: loki
      ports:
        - { protocol: TCP, port: 7946 }
        - { protocol: TCP, port: 9095 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              helix.io/component: loki
      ports:
        - { protocol: TCP, port: 7946 }
        - { protocol: TCP, port: 9095 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-storage
          podSelector:
            matchLabels:
              helix.io/service: object-store
      ports:
        - { protocol: TCP, port: 443 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
  namespace: helix-observability
spec:
  podSelector:
    matchLabels:
      helix.io/component: grafana
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-gateway
      ports:
        - { protocol: TCP, port: 3000 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              helix.io/component: loki
      ports:
        - { protocol: TCP, port: 3100 }
    - to:
        - podSelector:
            matchLabels:
              helix.io/component: tempo
      ports:
        - { protocol: TCP, port: 3200 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: identity
          podSelector:
            matchLabels:
              helix.io/service: oidc-provider
      ports:
        - { protocol: TCP, port: 443 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---

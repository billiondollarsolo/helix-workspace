name: PlatformResourcePolicies
description: Verifies Helix platform derived roles and resource policies.

principals:
  admin:
    id: admin-1
    roles: ["admin"]
    attr:
      org_id: org-1
      type: user

  auditor:
    id: auditor-1
    roles: ["auditor"]
    attr:
      org_id: org-1
      type: user

  owner:
    id: actor-owner
    roles: ["user"]
    attr:
      org_id: org-1
      type: user

  participant:
    id: actor-participant
    roles: ["user"]
    attr:
      org_id: org-1
      type: user

  shared:
    id: actor-shared
    roles: ["user"]
    attr:
      org_id: org-1
      type: user

  org_member:
    id: actor-org-member
    roles: ["user"]
    attr:
      org_id: org-1
      type: user

  outsider:
    id: actor-outsider
    roles: ["user"]
    attr:
      org_id: org-2
      type: user

  scoped_agent:
    id: agent-scoped
    roles: ["agent"]
    attr:
      org_id: org-1
      type: agent
      scopes: ["mail.read"]

resources:
  object_private:
    kind: object
    id: object-1
    attr:
      org_id: org-1
      owner_id: actor-owner
      participant_ids: ["actor-participant"]
      shared_actor_ids: ["actor-shared"]
      shared_org_ids: []
      visibility: private

  object_org:
    kind: object
    id: object-2
    attr:
      org_id: org-1
      owner_id: actor-owner
      participant_ids: []
      shared_actor_ids: []
      shared_org_ids: []
      visibility: org

  thread_private:
    kind: thread
    id: thread-1
    attr:
      org_id: org-1
      owner_id: actor-owner
      participant_ids: ["actor-participant"]
      shared_actor_ids: ["actor-shared"]
      shared_org_ids: []
      visibility: private

  calendar_private:
    kind: calendar
    id: calendar-1
    attr:
      org_id: org-1
      owner_id: actor-owner
      participant_ids: ["actor-participant"]
      shared_actor_ids: ["actor-shared"]
      shared_org_ids: []
      visibility: private

  event_private:
    kind: event
    id: event-1
    attr:
      org_id: org-1
      owner_id: actor-owner
      participant_ids: ["actor-participant"]
      shared_actor_ids: ["actor-shared"]
      shared_org_ids: []
      visibility: private

  admin_console:
    kind: admin
    id: admin-console
    attr:
      org_id: org-1
      section: platform

  mail_read_tool:
    kind: tool
    id: mail.search
    attr:
      org_id: org-1
      permission: mail.read
      sideEffects: read

  mail_send_tool:
    kind: tool
    id: mail.send
    attr:
      org_id: org-1
      permission: mail.send
      sideEffects: external_communication

tests:
  - name: Object access is owner participant shared org-visible
    input:
      principals: ["admin", "owner", "participant", "shared", "org_member", "outsider"]
      resources: ["object_private", "object_org"]
      actions: ["create", "read", "comment", "update", "delete", "share"]
    expected:
      - principal: admin
        resources: ["object_private", "object_org"]
        actions:
          create: EFFECT_ALLOW
          read: EFFECT_ALLOW
          comment: EFFECT_ALLOW
          update: EFFECT_ALLOW
          delete: EFFECT_ALLOW
          share: EFFECT_ALLOW
      - principal: owner
        resources: ["object_private", "object_org"]
        actions:
          create: EFFECT_ALLOW
          read: EFFECT_ALLOW
          comment: EFFECT_ALLOW
          update: EFFECT_ALLOW
          delete: EFFECT_ALLOW
          share: EFFECT_ALLOW
      - principal: participant
        resource: object_private
        actions:
          create: EFFECT_ALLOW
          read: EFFECT_ALLOW
          comment: EFFECT_ALLOW
      - principal: participant
        resource: object_org
        actions:
          create: EFFECT_ALLOW
          read: EFFECT_ALLOW
          comment: EFFECT_ALLOW
      - principal: shared
        resource: object_private
        actions:
          create: EFFECT_ALLOW
          read: EFFECT_ALLOW
          comment: EFFECT_ALLOW
      - principal: shared
        resource: object_org
        actions:
          create: EFFECT_ALLOW
          read: EFFECT_ALLOW
          comment: EFFECT_ALLOW
      - principal: org_member
        resource: object_org
        actions:
          create: EFFECT_ALLOW
          read: EFFECT_ALLOW
          comment: EFFECT_ALLOW
      - principal: org_member
        resource: object_private
        actions:
          create: EFFECT_ALLOW

  - name: Thread calendar and event collaborators can use expected actions
    input:
      principals: ["owner", "participant", "shared", "outsider"]
      resources: ["thread_private", "calendar_private", "event_private"]
      actions: ["read", "reply", "create_event", "rsvp", "delete"]
    expected:
      - principal: owner
        resources: ["thread_private", "calendar_private", "event_private"]
        actions:
          read: EFFECT_ALLOW
          reply: EFFECT_ALLOW
          create_event: EFFECT_ALLOW
          rsvp: EFFECT_ALLOW
          delete: EFFECT_ALLOW
      - principal: participant
        resource: thread_private
        actions:
          read: EFFECT_ALLOW
          reply: EFFECT_ALLOW
      - principal: participant
        resource: calendar_private
        actions:
          read: EFFECT_ALLOW
          create_event: EFFECT_ALLOW
      - principal: participant
        resource: event_private
        actions:
          read: EFFECT_ALLOW
          rsvp: EFFECT_ALLOW
      - principal: shared
        resources: ["thread_private", "calendar_private", "event_private"]
        actions:
          read: EFFECT_ALLOW
      - principal: shared
        resource: event_private
        actions:
          rsvp: EFFECT_ALLOW

  - name: Admin resource is restricted to admins and auditors
    input:
      principals: ["admin", "auditor", "owner", "outsider"]
      resources: ["admin_console"]
      actions: ["read", "update", "delete"]
    expected:
      - principal: admin
        resource: admin_console
        actions:
          read: EFFECT_ALLOW
          update: EFFECT_ALLOW
          delete: EFFECT_ALLOW
      - principal: auditor
        resource: admin_console
        actions:
          read: EFFECT_ALLOW

  - name: Tool resources require matching actor scopes
    input:
      principals: ["admin", "scoped_agent", "outsider"]
      resources: ["mail_read_tool", "mail_send_tool"]
      actions: ["mail.read", "mail.send"]
    expected:
      - principal: admin
        resources: ["mail_read_tool", "mail_send_tool"]
        actions:
          "mail.read": EFFECT_ALLOW
          "mail.send": EFFECT_ALLOW
      - principal: scoped_agent
        resource: mail_read_tool
        actions:
          "mail.read": EFFECT_ALLOW
      - principal: scoped_agent
        resource: mail_send_tool
        actions:
          "mail.send": EFFECT_DENY
      - principal: outsider
        resources: ["mail_read_tool", "mail_send_tool"]
        actions:
          "mail.read": EFFECT_DENY
          "mail.send": EFFECT_DENY

{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "helix.fullname" . }}-capability-health
  {{- with .Values.monitoring.prometheusRule.namespace }}
  namespace: {{ . | quote }}
  {{- end }}
  labels:
    {{- include "helix.labels" . | nindent 4 }}
    helix.io/alert-domain: capability-health
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.monitoring.prometheusRule.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
{{- $rules := .Files.Get "files/helix-capability-health.yml" | fromYaml }}
{{- toYaml $rules | nindent 2 }}
{{- end }}

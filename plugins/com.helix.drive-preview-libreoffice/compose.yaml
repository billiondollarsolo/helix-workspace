services:
  drive-preview-libreoffice:
    image: ${HELIX_DRIVE_PREVIEW_IMAGE_REPOSITORY:-ghcr.io/helix/drive-preview-libreoffice}@sha256:${HELIX_DRIVE_PREVIEW_IMAGE_DIGEST:?required}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 3000
      DRIVE_PREVIEW_REQUEST_BYTES: ${DRIVE_PREVIEW_REQUEST_BYTES:-73400320}
      DRIVE_PREVIEW_MAX_BYTES: ${DRIVE_PREVIEW_MAX_BYTES:-52428800}
      DRIVE_PREVIEW_MAX_OUTPUT_BYTES: ${DRIVE_PREVIEW_MAX_OUTPUT_BYTES:-67108864}
      DRIVE_PREVIEW_MAX_TEXT_BYTES: ${DRIVE_PREVIEW_MAX_TEXT_BYTES:-10485760}
      DRIVE_PREVIEW_MAX_ARCHIVE_ENTRIES: ${DRIVE_PREVIEW_MAX_ARCHIVE_ENTRIES:-2048}
      DRIVE_PREVIEW_MAX_ARCHIVE_BYTES: ${DRIVE_PREVIEW_MAX_ARCHIVE_BYTES:-268435456}
      DRIVE_PREVIEW_MAX_ARCHIVE_RATIO: ${DRIVE_PREVIEW_MAX_ARCHIVE_RATIO:-100}
      DRIVE_PREVIEW_MAX_CELLS: ${DRIVE_PREVIEW_MAX_CELLS:-1000000}
      DRIVE_PREVIEW_MAX_PAGES: ${DRIVE_PREVIEW_MAX_PAGES:-200}
      DRIVE_PREVIEW_WORKDIR: ${DRIVE_PREVIEW_WORKDIR:-/tmp/helix-drive-preview}
      DRIVE_PREVIEW_TIMEOUT_MS: ${DRIVE_PREVIEW_TIMEOUT_MS:-30000}
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 64
    mem_limit: 768m
    cpus: 1
    tmpfs:
      - /tmp:size=512m,mode=1777,nosuid,nodev
    networks:
      - content-conversion
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 5s
    restart: unless-stopped

networks:
  content-conversion:
    internal: true

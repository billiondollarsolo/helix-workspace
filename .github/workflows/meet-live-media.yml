name: Meet live media gate

on:
  workflow_dispatch:
    inputs:
      helix_editors_ref:
        description: Optional helix-editors branch, tag, or SHA to test.
        required: false
        type: string
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: meet-live-media
  cancel-in-progress: false

jobs:
  live-media:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: meet-live
    defaults:
      run:
        working-directory: helix-all/helix-workspace
    env:
      HELIX_MEET_LIVE_API_URL: ${{ secrets.HELIX_MEET_LIVE_API_URL }}
      HELIX_MEET_LIVE_HOST_CLIENT_ID: ${{ secrets.HELIX_MEET_LIVE_HOST_CLIENT_ID }}
      HELIX_MEET_LIVE_HOST_CLIENT_SECRET: ${{ secrets.HELIX_MEET_LIVE_HOST_CLIENT_SECRET }}
      HELIX_MEET_LIVE_HOST_ACTOR_ID: ${{ secrets.HELIX_MEET_LIVE_HOST_ACTOR_ID }}
      HELIX_MEET_LIVE_ATTENDEE_CLIENT_ID: ${{ secrets.HELIX_MEET_LIVE_ATTENDEE_CLIENT_ID }}
      HELIX_MEET_LIVE_ATTENDEE_CLIENT_SECRET: ${{ secrets.HELIX_MEET_LIVE_ATTENDEE_CLIENT_SECRET }}
      HELIX_MEET_LIVE_ATTENDEE_ACTOR_ID: ${{ secrets.HELIX_MEET_LIVE_ATTENDEE_ACTOR_ID }}
      HELIX_MEET_LIVE_WEBHOOK_SECRET: ${{ secrets.HELIX_MEET_LIVE_WEBHOOK_SECRET }}
      HELIX_MEET_LIVE_EVIDENCE_PATH: test-results/meet-live/evidence.json
    steps:
      - name: Checkout helix-workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: helix-all/helix-workspace

      - name: Checkout paired helix-editors
        uses: ./helix-all/helix-workspace/.github/actions/checkout-editors
        with:
          requested-ref: ${{ inputs.helix_editors_ref }}
          candidate-ref: ${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: |
            helix-all/helix-workspace/pnpm-lock.yaml
            helix-all/helix-editors/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare paired helix-editors
        uses: ./helix-all/helix-workspace/.github/actions/prepare-editors

      - name: Install Chromium
        run: pnpm --filter @helix/web exec playwright install --with-deps chromium

      - name: Run real two-browser media gate
        run: pnpm quality:meet-live-media

      - name: Upload proof and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meet-live-media-${{ github.run_id }}
          path: |
            helix-all/helix-workspace/apps/web/test-results/meet-live
          if-no-files-found: warn
          retention-days: 30

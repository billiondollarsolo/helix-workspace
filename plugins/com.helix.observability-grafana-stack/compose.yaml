services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "${OTEL_COLLECTOR_GRPC_PORT:-28444}:4317"
      - "${OTEL_COLLECTOR_HTTP_PORT:-28445}:4318"
    volumes:
      - ../../infra/observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROMETHEUS_PORT:-28446}:9090"
    volumes:
      - ../../infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "${TEMPO_HTTP_PORT:-28447}:3200"
    volumes:
      - ../../infra/observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "${LOKI_PORT:-28448}:3100"
    volumes:
      - ../../infra/observability/loki/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT:-28449}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./dashboards:/var/lib/grafana/dashboards/helix:ro

volumes:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:

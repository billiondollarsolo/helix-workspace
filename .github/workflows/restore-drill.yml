name: Restore Drill

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate shell syntax
        run: bash -n infra/scripts/common.sh infra/scripts/backup.sh infra/scripts/restore.sh infra/scripts/restore-drill.sh

      - name: Validate restore drill contracts
        run: infra/scripts/validate-restore-drill.sh

      - name: Record static restore evidence
        run: |
          mkdir -p /tmp/helix-restore-evidence
          node infra/scripts/restore-drill-evidence.mjs \
            --static \
            --output /tmp/helix-restore-evidence/restore-drill-evidence.json

      - name: Dry-run backup workflow
        run: infra/scripts/backup.sh --tier personal --output-dir /tmp/helix-backups --backup-id ci-dry-run

      - name: Dry-run restore workflow
        run: infra/scripts/restore.sh --backup /tmp/helix-backups/ci-dry-run.tar.gz --target-db helix_restore_drill --allow-drop-target --verify

      - name: Dry-run restore drill
        run: infra/scripts/restore-drill.sh --backup /tmp/helix-backups/ci-dry-run.tar.gz

      - name: Start drill Postgres
        run: docker compose up -d postgres

      - name: Execute disposable database smoke (not release evidence)
        run: infra/scripts/restore-drill.sh --create-backup --backup-dir /tmp/helix-backups --execute

      - name: Upload truthful static evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restore-drill-static-evidence
          path: /tmp/helix-restore-evidence/restore-drill-evidence.json

      - name: Stop drill stack
        if: ${{ always() }}
        run: docker compose down

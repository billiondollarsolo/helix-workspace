# Local development only. Production deployments use the hardened Helm profiles.
name: helix-local-dev

services:
  helix:
    # The local stack never resolves a remote application tag. Build/tag this image locally;
    # production pulls the signed digest required by the Helm chart.
    image: helix/helix:local
    pull_policy: never
    environment:
      # Deliberately non-overridable: this stack is never a production deployment path.
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HELIX_AI_ALLOW_PRIVATE_NETWORK: ${HELIX_AI_ALLOW_PRIVATE_NETWORK:-false}
      HELIX_SECURITY_TIER: ${HELIX_SECURITY_TIER:-personal}
      HELIX_PUBLIC_URL: ${HELIX_PUBLIC_URL:-http://localhost:28441}
      HELIX_DEFAULT_ORG_ID: ${HELIX_DEFAULT_ORG_ID:-00000000-0000-0000-0000-000000000000}
      DATABASE_URL: postgres://helix_app:helix_app_local@postgres:5432/${POSTGRES_DB:-helix}
      BETTER_AUTH_ENABLED: ${BETTER_AUTH_ENABLED:-true}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:28441}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-helix_local_better_auth_secret_change_me_32_chars}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:28441,http://localhost:3000,http://localhost:5173,http://localhost:4173}
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-helix_dev_meili_master_key}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-helixrustfs}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-helix_rustfs_dev_secret}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-helix-objects}
      AUDIT_IMMUTABLE_S3_ENABLED: ${AUDIT_IMMUTABLE_S3_ENABLED:-false}
      AUDIT_IMMUTABLE_S3_ENDPOINT: ${AUDIT_IMMUTABLE_S3_ENDPOINT:-http://rustfs:9000}
      AUDIT_IMMUTABLE_S3_BUCKET: ${AUDIT_IMMUTABLE_S3_BUCKET:-helix-audit}
      AUDIT_IMMUTABLE_S3_ACCESS_KEY: ${AUDIT_IMMUTABLE_S3_ACCESS_KEY:-helixrustfs}
      AUDIT_IMMUTABLE_S3_SECRET_KEY: ${AUDIT_IMMUTABLE_S3_SECRET_KEY:-helix_rustfs_dev_secret}
      AUDIT_IMMUTABLE_S3_REGION: ${AUDIT_IMMUTABLE_S3_REGION:-us-east-1}
      AUDIT_IMMUTABLE_S3_FORCE_PATH_STYLE: ${AUDIT_IMMUTABLE_S3_FORCE_PATH_STYLE:-true}
      AUDIT_IMMUTABLE_S3_PREFIX: ${AUDIT_IMMUTABLE_S3_PREFIX:-audit/activity}
      AUDIT_IMMUTABLE_S3_BATCH_SIZE: ${AUDIT_IMMUTABLE_S3_BATCH_SIZE:-500}
      AUDIT_IMMUTABLE_S3_INTERVAL_MS: ${AUDIT_IMMUTABLE_S3_INTERVAL_MS:-60000}
      AUDIT_IMMUTABLE_S3_RETENTION_DAYS: ${AUDIT_IMMUTABLE_S3_RETENTION_DAYS:-365}
      AUDIT_IMMUTABLE_S3_OBJECT_LOCK_MODE: ${AUDIT_IMMUTABLE_S3_OBJECT_LOCK_MODE:-COMPLIANCE}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-mailpit}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-1025}
      MAIL_SMTP_SECURE: ${MAIL_SMTP_SECURE:-false}
      MAIL_SMTP_RECEIVER_ENABLED: ${MAIL_SMTP_RECEIVER_ENABLED:-true}
      MAIL_SMTP_RECEIVER_HOST: ${MAIL_SMTP_RECEIVER_HOST:-0.0.0.0}
      MAIL_SMTP_RECEIVER_PORT: ${MAIL_SMTP_RECEIVER_PORT:-2525}
      MAIL_SPAMD_ENABLED: ${MAIL_SPAMD_ENABLED:-false}
      MAIL_SPAMD_HOST: ${MAIL_SPAMD_HOST:-spamd}
      MAIL_SPAMD_PORT: ${MAIL_SPAMD_PORT:-783}
      MAIL_SPAMD_THRESHOLD: ${MAIL_SPAMD_THRESHOLD:-5.0}
      MAIL_CLAMAV_ENABLED: ${MAIL_CLAMAV_ENABLED:-false}
      MAIL_CLAMAV_HOST: ${MAIL_CLAMAV_HOST:-clamav}
      MAIL_CLAMAV_PORT: ${MAIL_CLAMAV_PORT:-3310}
      CERBOS_HTTP_URL: http://cerbos:3592
      HELIX_OBSERVABILITY_ENABLED: ${HELIX_OBSERVABILITY_ENABLED:-false}
      HELIX_OTEL_TRACES_ENDPOINT: ${HELIX_OTEL_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-helix-app}
      MEET_JITSI_DOMAIN: ${MEET_JITSI_DOMAIN:-meet.localhost}
      MEET_JITSI_PUBLIC_URL: ${MEET_JITSI_PUBLIC_URL:-https://meet.localhost:28452}
      MEET_JITSI_JWT_APP_ID: ${MEET_JITSI_JWT_APP_ID:-helix-meet}
      MEET_JITSI_JWT_ISSUER: ${MEET_JITSI_JWT_ISSUER:-helix}
      MEET_JITSI_JWT_AUDIENCE: ${MEET_JITSI_JWT_AUDIENCE:-jitsi}
      MEET_JITSI_JWT_SECRET: ${MEET_JITSI_JWT_SECRET:-helix_dev_jitsi_jwt_secret_change_me}
      MEET_JITSI_TOKEN_TTL_SECONDS: ${MEET_JITSI_TOKEN_TTL_SECONDS:-300}
      MEET_JITSI_WEBHOOK_SHARED_SECRET: ${MEET_JITSI_WEBHOOK_SHARED_SECRET:-helix_dev_jitsi_webhook_secret_change_me}
      MEET_JIBRI_HEALTH_URL: ${MEET_JIBRI_HEALTH_URL:-http://jitsi-jibri:2222/jibri/api/v1.0/health}
      HELIX_CONFIG_JSON: >-
        {"security":{"tier":"personal"},"observability":{"config":{"otlpEndpoint":"http://otel-collector:4318/v1/traces","sampling":{"traces":1,"toolCalls":1,"permissionChecks":1}}},"plugins":{"com.helix.webhook-out-slack":{"enabled":true},"com.helix.core.meet-jitsi":{"enabled":true,"jitsiDomain":"${MEET_JITSI_DOMAIN:-meet.localhost}","publicUrl":"${MEET_JITSI_PUBLIC_URL:-https://meet.localhost:28452}","jwt":{"appId":"${MEET_JITSI_JWT_APP_ID:-helix-meet}","issuer":"${MEET_JITSI_JWT_ISSUER:-helix}","audience":"${MEET_JITSI_JWT_AUDIENCE:-jitsi}","secretEnv":"MEET_JITSI_JWT_SECRET","ttlSeconds":${MEET_JITSI_TOKEN_TTL_SECONDS:-300}},"webhook":{"sharedSecretEnv":"MEET_JITSI_WEBHOOK_SHARED_SECRET"}}}}
    ports:
      - "127.0.0.1:${HELIX_PORT:-28431}:3000"
      - "127.0.0.1:${HELIX_SMTP_RECEIVE_PORT:-28456}:2525"
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      meilisearch:
        condition: service_started
      rustfs:
        condition: service_started
      cerbos:
        condition: service_started
      mailpit:
        condition: service_started
    healthcheck:
      test: [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:\
          1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    build:
      context: ./infra/postgres
    image: helix/postgres-pgvector:18.4-pgvector0.8.5
    pull_policy: never
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helix}
      POSTGRES_USER: ${POSTGRES_USER:-helix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helix_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-28432}:5432"
    volumes:
      # PostgreSQL 18 stores versioned clusters beneath /var/lib/postgresql.
      # Existing PostgreSQL 17 volumes require the documented dump/restore upgrade.
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.8.1-alpine@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-28433}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nats:
    build:
      context: ./infra/nats
    image: helix/nats-server:2.14.3-patched
    pull_policy: never
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:${NATS_CLIENT_PORT:-28434}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-28435}:8222"
    volumes:
      - nats-data:/data
    restart: unless-stopped

  meilisearch:
    build:
      context: ./infra/meilisearch
    image: helix/meilisearch:1.51.0-patched
    pull_policy: never
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-helix_dev_meili_master_key}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:${MEILI_PORT:-28436}:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: [
          "CMD-SHELL",
          'wget -qO- http://127.0.0.1:7700/health | grep -q
          ''"status":"available"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.12@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    command: ["/data"]
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-helixrustfs}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-helix_rustfs_dev_secret}
      RUSTFS_SSE_S3_MASTER_KEY: ${RUSTFS_SSE_S3_MASTER_KEY:-}
      # Include the host:port forms — path-style requests from the host
      # (helix dev server on the host hits http://localhost:28437) carry
      # `Host: localhost:28437`, and without this RustFS tries to parse
      # the port-suffixed host as a bucket name and returns
      # InvalidBucketName.
      RUSTFS_SERVER_DOMAINS: ${RUSTFS_SERVER_DOMAINS:-localhost,rustfs,localhost:28437,localhost:9000,rustfs:9000}
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-28437}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-28438}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: [
          "CMD-SHELL",
          'curl -fsS http://127.0.0.1:9000/minio/health/live | grep -q
          ''"ready":true''',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  cerbos:
    build:
      context: ./infra/cerbos
    image: helix/cerbos:0.54.0-patched
    pull_policy: never
    command: ["server", "--config=/config/.cerbos.yaml"]
    ports:
      - "127.0.0.1:${CERBOS_HTTP_PORT:-28439}:3592"
      - "127.0.0.1:${CERBOS_GRPC_PORT:-28440}:3593"
    volumes:
      - ./infra/cerbos/.cerbos.yaml:/config/.cerbos.yaml:ro
      - ./infra/cerbos/policies:/policies:ro
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck"]
      interval: 10s
      timeout: 2s
      retries: 5
    restart: unless-stopped

  # Optional local search provider. Enable and connect it in Admin → AI retrieval.
  searxng:
    image: searxng/searxng:2026.9.10-931fd9787@sha256:2fb0fa85096fe6df5c3ab98ecb4d6e0ee2ef66b8fb96ce6fce0f75b51c4bd90a
    profiles: ["web-search"]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-helix_local_searxng_secret_change_me_32_chars}
      # The checked-in settings are mounted read-only; do not chown the source tree.
      FORCE_OWNERSHIP: "false"
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-28461}:8080"
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/var/cache/searxng
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-28457}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-28458}:8025"
    restart: unless-stopped

  # SpamAssassin spamd daemon. Inbound mail ingest scores each received message
  # over the spamd TCP protocol when MAIL_SPAMD_ENABLED=true. Opt-in via the
  # `mail-security` compose profile.
  spamd:
    build:
      context: ./infra/spamassassin
    image: helix/spamassassin:4.0.2-patched
    pull_policy: never
    profiles: ["mail-security"]
    command: ["spamd", "--allowed-ips=0.0.0.0/0", "--listen=0.0.0.0:783", "--max-children=4"]
    ports:
      - "127.0.0.1:${MAIL_SPAMD_PORT_PUBLISHED:-28459}:783"
    volumes:
      - spamd-data:/var/lib/spamassassin
    healthcheck:
      test: ["CMD-SHELL", "netstat -ltn | grep -q ':783'"]
      interval: 10s
      timeout: 2s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # ClamAV clamd daemon. Inbound mail ingest scans each message over the clamd
  # INSTREAM TCP protocol when MAIL_CLAMAV_ENABLED=true. Opt-in via the
  # `mail-security` compose profile.
  clamav:
    image: clamav/clamav:1.5.4@sha256:f0954d679017eb6d48221e2b2be3ac5457bf278a844f39b672376f55a085f591
    platform: linux/amd64
    profiles: ["mail-security"]
    environment:
      CLAMD_CONF_StreamMaxLength: ${HELIX_DRIVE_AV_MAX_FILE_BYTES:-134217728}
      CLAMD_CONF_MaxFileSize: ${HELIX_DRIVE_AV_MAX_FILE_BYTES:-134217728}
      CLAMD_CONF_MaxScanSize: ${HELIX_DRIVE_ARCHIVE_MAX_UNCOMPRESSED_BYTES:-1073741824}
      CLAMD_CONF_MaxFiles: ${HELIX_DRIVE_ARCHIVE_MAX_ENTRIES:-10000}
      CLAMD_CONF_MaxRecursion: ${HELIX_DRIVE_ARCHIVE_MAX_NESTED:-20}
      CLAMD_CONF_MaxScanTime: ${MAIL_CLAMAV_TIMEOUT_MS:-30000}
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_AlertEncrypted: "yes"
    ports:
      - "127.0.0.1:${MAIL_CLAMAV_PORT_PUBLISHED:-28460}:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 120s
    restart: unless-stopped

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    environment:
      HELIX_DOMAIN: ${HELIX_DOMAIN:-localhost}
      HELIX_UPSTREAM: ${HELIX_UPSTREAM:-helix:3000}
      HELIX_JITSI_ORIGIN: ${MEET_JITSI_PUBLIC_URL:-https://meet.localhost:28452}
    ports:
      - "${CADDY_HTTP_PORT:-28441}:80"
      - "${CADDY_HTTPS_PORT:-28442}:443"
      - "${CADDY_HTTPS_PORT:-28442}:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - helix
    restart: unless-stopped

  jitsi-web:
    image: jitsi/web:stable-11031@sha256:2183593bbbe1b5e27c368e3737efc51915ce7742de93f594e5ca7950c864c233
    profiles: ["meet"]
    environment:
      ENABLE_AUTH: "1"
      ENABLE_GUESTS: "0"
      ENABLE_XMPP_WEBSOCKET: "1"
      ENABLE_P2P: "0"
      ENABLE_LOBBY: "1"
      ENABLE_AV_MODERATION: "1"
      AUTH_TYPE: jwt
      # Show the in-call "Start recording" button. Without this jitsi-meet
      # hides the recording menu items even if Jibri is up.
      ENABLE_RECORDING: "1"
      PUBLIC_URL: ${MEET_JITSI_PUBLIC_URL:-https://meet.localhost:28452}
      TZ: ${TZ:-UTC}
      XMPP_SERVER: jitsi-prosody
      XMPP_DOMAIN: ${JITSI_XMPP_DOMAIN:-meet.jitsi}
      XMPP_AUTH_DOMAIN: ${JITSI_XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
      XMPP_MUC_DOMAIN: ${JITSI_XMPP_MUC_DOMAIN:-muc.meet.jitsi}
      XMPP_INTERNAL_MUC_DOMAIN: ${JITSI_XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}
      XMPP_BOSH_URL_BASE: http://jitsi-prosody:5280
      JWT_APP_ID: ${MEET_JITSI_JWT_APP_ID:-helix-meet}
      JWT_APP_SECRET: ${MEET_JITSI_JWT_SECRET:-helix_dev_jitsi_jwt_secret_change_me}
      JWT_ACCEPTED_ISSUERS: ${MEET_JITSI_JWT_ISSUER:-helix}
      JWT_ACCEPTED_AUDIENCES: ${MEET_JITSI_JWT_AUDIENCE:-jitsi}
    ports:
      - "127.0.0.1:${JITSI_WEB_HTTP_PORT:-28451}:80"
      - "127.0.0.1:${JITSI_WEB_HTTPS_PORT:-28452}:443"
    volumes:
      - jitsi-web-config:/config
      - ./infra/meet/custom-config.js:/config/custom-config.js:ro
      - ./infra/meet/config/transcripts:/usr/share/jitsi-meet/transcripts
    networks: [meet-control]
    depends_on:
      - jitsi-prosody
      - jitsi-jicofo
      - jitsi-jvb
    restart: unless-stopped

  jitsi-prosody:
    image: jitsi/prosody:stable-11031@sha256:926c508c0d9198bf9d0b6adb88ce9092461e9a79e2895fb57fe4ef5f44ff3523
    profiles: ["meet"]
    environment:
      AUTH_TYPE: jwt
      ENABLE_AUTH: "1"
      ENABLE_GUESTS: "0"
      ENABLE_XMPP_WEBSOCKET: "1"
      ENABLE_LOBBY: "1"
      ENABLE_AV_MODERATION: "1"
      ENABLE_END_CONFERENCE: "1"
      PROSODY_ENABLE_FILTER_MESSAGES: "1"
      XMPP_MUC_MODULES: token_affiliation
      STUN_HOST: ${JITSI_TURN_HOST:-turn.localhost}
      STUN_PORT: ${JITSI_TURN_PORT:-3478}
      TURN_HOST: ${JITSI_TURN_HOST:-turn.localhost}
      TURN_PORT: ${JITSI_TURN_PORT:-3478}
      TURN_TRANSPORT: udp,tcp
      TURNS_HOST: ${JITSI_TURN_HOST:-turn.localhost}
      TURNS_PORT: ${JITSI_TURNS_PORT:-5349}
      TURN_TTL: "600"
      # Provision the recorder.meet.jitsi virtual host + the jibri/recorder
      # XMPP users that Jibri authenticates as. Required for the recording
      # to begin at all; absent these, jicofo never finds a Jibri instance.
      ENABLE_RECORDING: "1"
      JIBRI_XMPP_USER: ${JIBRI_XMPP_USER:-jibri}
      JIBRI_XMPP_PASSWORD: ${JIBRI_XMPP_PASSWORD:-helix_dev_jibri_xmpp_password_change_me}
      JIBRI_BREWERY_MUC: ${JIBRI_BREWERY_MUC:-jibribrewery}
      JIBRI_RECORDER_USER: ${JIBRI_RECORDER_USER:-recorder}
      JIBRI_RECORDER_PASSWORD: ${JIBRI_RECORDER_PASSWORD:-helix_dev_jibri_recorder_password_change_me}
      XMPP_RECORDER_DOMAIN: ${JITSI_XMPP_RECORDER_DOMAIN:-recorder.meet.jitsi}
      PUBLIC_URL: ${MEET_JITSI_PUBLIC_URL:-https://meet.localhost:28452}
      TZ: ${TZ:-UTC}
      XMPP_DOMAIN: ${JITSI_XMPP_DOMAIN:-meet.jitsi}
      XMPP_AUTH_DOMAIN: ${JITSI_XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
      XMPP_MUC_DOMAIN: ${JITSI_XMPP_MUC_DOMAIN:-muc.meet.jitsi}
      XMPP_INTERNAL_MUC_DOMAIN: ${JITSI_XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}
      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: ${JITSI_JICOFO_AUTH_PASSWORD:-helix_dev_jicofo_auth_password_change_me}
      JICOFO_COMPONENT_SECRET: ${JITSI_JICOFO_COMPONENT_SECRET:-helix_dev_jicofo_component_secret_change_me}
      ENABLE_AUTO_OWNER: "0"
      ENABLE_MODERATOR_CHECKS: "1"
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: ${JITSI_JVB_AUTH_PASSWORD:-helix_dev_jvb_auth_password_change_me}
      JWT_APP_ID: ${MEET_JITSI_JWT_APP_ID:-helix-meet}
      JWT_APP_SECRET: ${MEET_JITSI_JWT_SECRET:-helix_dev_jitsi_jwt_secret_change_me}
      JWT_ACCEPTED_ISSUERS: ${MEET_JITSI_JWT_ISSUER:-helix}
      JWT_ACCEPTED_AUDIENCES: ${MEET_JITSI_JWT_AUDIENCE:-jitsi}
    ports:
      - "127.0.0.1:${JITSI_PROSODY_C2S_PORT:-28454}:5222"
      - "127.0.0.1:${JITSI_PROSODY_HTTP_PORT:-28455}:5280"
    volumes:
      - jitsi-prosody-config:/config
      - ./infra/meet/prosody/05-turn-secret:/etc/cont-init.d/05-turn-secret:ro
    secrets:
      - source: jitsi_turn_shared_secret
        target: jitsi_turn_shared_secret
      - source: jitsi_xmpp_cert
        target: /config/certs/${JITSI_XMPP_DOMAIN:-meet.jitsi}.crt
      - source: jitsi_xmpp_key
        target: /config/certs/${JITSI_XMPP_DOMAIN:-meet.jitsi}.key
      - source: jitsi_xmpp_cert
        target: /config/certs/${JITSI_XMPP_AUTH_DOMAIN:-auth.meet.jitsi}.crt
      - source: jitsi_xmpp_key
        target: /config/certs/${JITSI_XMPP_AUTH_DOMAIN:-auth.meet.jitsi}.key
      - source: jitsi_xmpp_cert
        target: /config/certs/${JITSI_XMPP_MUC_DOMAIN:-muc.meet.jitsi}.crt
      - source: jitsi_xmpp_key
        target: /config/certs/${JITSI_XMPP_MUC_DOMAIN:-muc.meet.jitsi}.key
      - source: jitsi_xmpp_cert
        target: /config/certs/${JITSI_XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}.crt
      - source: jitsi_xmpp_key
        target: /config/certs/${JITSI_XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}.key
    networks: [meet-control]
    restart: unless-stopped

  jitsi-jicofo:
    image: jitsi/jicofo:stable-11031@sha256:1f78fb0c0548ae5efd83a2b488df6aabbae4a70bc6f64c74395b6937b3aceb98
    profiles: ["meet"]
    environment:
      TZ: ${TZ:-UTC}
      XMPP_SERVER: jitsi-prosody
      XMPP_DOMAIN: ${JITSI_XMPP_DOMAIN:-meet.jitsi}
      XMPP_AUTH_DOMAIN: ${JITSI_XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
      XMPP_MUC_DOMAIN: ${JITSI_XMPP_MUC_DOMAIN:-muc.meet.jitsi}
      XMPP_INTERNAL_MUC_DOMAIN: ${JITSI_XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}
      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: ${JITSI_JICOFO_AUTH_PASSWORD:-helix_dev_jicofo_auth_password_change_me}
      JICOFO_COMPONENT_SECRET: ${JITSI_JICOFO_COMPONENT_SECRET:-helix_dev_jicofo_component_secret_change_me}
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/run/secrets/jitsi_xmpp_truststore
        -Djavax.net.ssl.trustStoreType=PKCS12
        -Djavax.net.ssl.trustStorePassword=changeit
      # Tell jicofo to discover Jibri instances via the recording brewery
      # MUC. Jibri joins that MUC on startup; jicofo dispatches recording
      # start/stop IQ messages to whichever Jibri presence is available.
      ENABLE_RECORDING: "1"
      JIBRI_BREWERY_MUC: ${JIBRI_BREWERY_MUC:-jibribrewery}
      JIBRI_PENDING_TIMEOUT: "90"
      XMPP_RECORDER_DOMAIN: ${JITSI_XMPP_RECORDER_DOMAIN:-recorder.meet.jitsi}
    volumes:
      - jitsi-jicofo-config:/config
      - ./infra/meet/jicofo/custom-jicofo.conf:/config/custom-jicofo.conf:ro
    secrets:
      - jitsi_xmpp_truststore
    networks: [meet-control]
    depends_on:
      - jitsi-prosody
    restart: unless-stopped

  jitsi-jvb:
    image: jitsi/jvb:stable-11031@sha256:3460de3541a8f96d007b8f2b4681ea8321cae64c17387338eabf776e73cd0f51
    profiles: ["meet"]
    environment:
      TZ: ${TZ:-UTC}
      XMPP_SERVER: jitsi-prosody
      XMPP_AUTH_DOMAIN: ${JITSI_XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
      XMPP_INTERNAL_MUC_DOMAIN: ${JITSI_XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: ${JITSI_JVB_AUTH_PASSWORD:-helix_dev_jvb_auth_password_change_me}
      JVB_BREWERY_MUC: jvbbrewery
      JVB_PORT: 10000
      JVB_TCP_HARVESTER_DISABLED: "true"
      JVB_ADVERTISE_IPS: ${JITSI_JVB_ADVERTISE_IPS:-}
      JVB_STUN_SERVERS: jitsi-turn:3478
      JVB_REQUIRE_VALID_ADDRESS: "true"
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/run/secrets/jitsi_xmpp_truststore
        -Djavax.net.ssl.trustStoreType=PKCS12
        -Djavax.net.ssl.trustStorePassword=changeit
    ports:
      - "127.0.0.1:${JITSI_JVB_UDP_PORT:-28453}:10000/udp"
    volumes:
      - jitsi-jvb-config:/config
      - ./infra/meet/jvb/custom-jvb.conf:/config/custom-jvb.conf:ro
    secrets:
      - jitsi_xmpp_truststore
    networks: [meet-control, meet-media]
    depends_on:
      - jitsi-prosody
      - jitsi-turn
    restart: unless-stopped

  jitsi-turn:
    image: coturn/coturn:4.7.0-alpine@sha256:2a0c41042b02c6daa33f35ce3781da20fe0d08da6cf2746c8ae62a890802cc36
    profiles: ["meet"]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        umask 077; printf 'static-auth-secret=%s\n' "$$(cat
        /run/secrets/jitsi_turn_shared_secret)" > /tmp/turn-secret.conf; exec
        turnserver -c /tmp/turn-secret.conf --fingerprint --use-auth-secret
        --realm="$${JITSI_TURN_REALM}" --server-name="$${JITSI_TURN_REALM}"
        --external-ip="$${JITSI_TURN_EXTERNAL_IP}" --listening-port=3478
        --tls-listening-port=5349 --min-port=49160 --max-port=49200
        --cert=/run/secrets/jitsi_turn_cert --pkey=/run/secrets/jitsi_turn_key
        --no-dtls --stale-nonce=600 --user-quota=12 --total-quota=1200 --no-cli
        --no-multicast-peers --log-file=stdout
    environment:
      JITSI_TURN_REALM: ${JITSI_TURN_HOST:-turn.localhost}
      JITSI_TURN_EXTERNAL_IP: ${JITSI_TURN_EXTERNAL_IP:-127.0.0.1}
    ports:
      - "${JITSI_TURN_BIND_IP:-127.0.0.1}:${JITSI_TURN_PORT:-3478}:3478/tcp"
      - "${JITSI_TURN_BIND_IP:-127.0.0.1}:${JITSI_TURN_PORT:-3478}:3478/udp"
      - "${JITSI_TURN_BIND_IP:-127.0.0.1}:${JITSI_TURNS_PORT:-5349}:5349/tcp"
      - "${JITSI_TURN_BIND_IP:-127.0.0.1}:49160-49200:49160-49200/udp"
    secrets:
      - jitsi_turn_shared_secret
      - jitsi_turn_cert
      - jitsi_turn_key
    networks: [meet-media]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777,nosuid,nodev,noexec
      - /var/tmp:size=16m,mode=1777,nosuid,nodev,noexec
    restart: unless-stopped

  # ----------------------------------------------------------------------
  # Jibri — meeting recorder. Joins each meeting as a hidden XMPP client,
  # opens the conference URL in headless Chrome, captures audio via ALSA
  # snd-aloop + X11 screen, encodes via ffmpeg, runs finalize.sh on stop.
  #
  # IMPORTANT: snd-aloop is a Linux kernel module that must be loaded on
  # the host. Recording is therefore supported only on a Linux host where
  # `modprobe snd-aloop` succeeds; the service intentionally fails rather
  # than manufacturing placeholder media on unsupported hosts.
  jitsi-jibri:
    image: jitsi/jibri:stable-11031@sha256:40f5fd67517cdb6395ae642143f1a5c002ff80259c1c633a384ede5c7b0569f4
    profiles: ["meet", "recording"]
    environment:
      TZ: ${TZ:-UTC}
      XMPP_SERVER: jitsi-prosody
      XMPP_DOMAIN: ${JITSI_XMPP_DOMAIN:-meet.jitsi}
      XMPP_AUTH_DOMAIN: ${JITSI_XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
      XMPP_INTERNAL_MUC_DOMAIN: ${JITSI_XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}
      XMPP_MUC_DOMAIN: ${JITSI_XMPP_MUC_DOMAIN:-muc.meet.jitsi}
      XMPP_RECORDER_DOMAIN: ${JITSI_XMPP_RECORDER_DOMAIN:-recorder.meet.jitsi}
      JIBRI_XMPP_USER: ${JIBRI_XMPP_USER:-jibri}
      JIBRI_XMPP_PASSWORD: ${JIBRI_XMPP_PASSWORD:-helix_dev_jibri_xmpp_password_change_me}
      JIBRI_BREWERY_MUC: ${JIBRI_BREWERY_MUC:-jibribrewery}
      JIBRI_RECORDER_USER: ${JIBRI_RECORDER_USER:-recorder}
      JIBRI_RECORDER_PASSWORD: ${JIBRI_RECORDER_PASSWORD:-helix_dev_jibri_recorder_password_change_me}
      XMPP_TRUST_ALL_CERTS: "false"
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/run/secrets/jitsi_xmpp_truststore
        -Djavax.net.ssl.trustStoreType=PKCS12
        -Djavax.net.ssl.trustStorePassword=changeit
      JIBRI_RECORDING_DIR: /recordings
      JIBRI_FINALIZE_RECORDING_SCRIPT_PATH: /jibri-finalize/finalize.sh
      # finalize.sh uses Helix's tenant-bound prepare/upload/complete protocol.
      HELIX_INTERNAL_URL: ${HELIX_INTERNAL_URL:-http://helix:3000}
      HELIX_JITSI_WEBHOOK_SECRET: ${MEET_JITSI_WEBHOOK_SHARED_SECRET:-helix_dev_jitsi_webhook_secret_change_me}
      HELIX_JITSI_ORG_ID: ${HELIX_JITSI_ORG_ID:-}
    volumes:
      - jitsi-jibri-config:/config
      - ./infra/meet/finalize:/jibri-finalize:ro
      - jibri-recordings:/recordings
      # Required for Jibri's headless Chrome and X server
      - /dev/shm:/dev/shm
    secrets:
      - jitsi_xmpp_truststore
    networks: [default, meet-control]
    shm_size: "2gb"
    cap_add:
      - SYS_ADMIN
    depends_on:
      - jitsi-prosody
      - jitsi-jicofo
      - rustfs
      - helix
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${OTEL_COLLECTOR_GRPC_PORT:-28444}:4317"
      - "127.0.0.1:${OTEL_COLLECTOR_HTTP_PORT:-28445}:4318"
    volumes:
      - ./infra/observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-28446}:9090"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/rules:/etc/prometheus/rules:ro
      - ./infra/helm/helix/files:/etc/prometheus/product-slos:ro
      - prometheus-data:/prometheus
    depends_on:

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: assistant
  version: default
  importDerivedRoles:
    - helix_platform_roles
  schemas:
    principalSchema:
      ref: cerbos:///platform/principal.json
    resourceSchema:
      ref: cerbos:///platform/resource.json
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      roles: ["admin"]

    - actions: ["ask", "summarize", "read", "list"]
      effect: EFFECT_ALLOW
      derivedRoles: ["org_member"]

    - actions: ["memory:read", "memory:write", "memory:delete", "configure:self"]
      effect: EFFECT_ALLOW
      derivedRoles: ["owner"]

    - actions: ["memory:read", "memory:write", "memory:delete"]
      effect: EFFECT_DENY
      derivedRoles: ["org_member"]
      condition:
        match:
          expr: R.attr.memoryEnabled != true

    - actions: ["admin", "configure:org"]
      effect: EFFECT_ALLOW
      roles: ["admin"]

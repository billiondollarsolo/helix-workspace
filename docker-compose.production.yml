name: helix-production

# Production hardening overlay. Apply after docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml config
#
# Secret files are mounted from HELIX_PRODUCTION_SECRETS_DIR (default
# ./secrets). See docs/deployment-production.md for generation and ownership.
#
# ---------------------------------------------------------------------------
# Full Workspace readiness gates (O-DOCKER / PKG) — DOCUMENTATION ONLY
# ---------------------------------------------------------------------------
# Production remains MVP fail-closed (AGENTS.md). This overlay MUST keep:
#   HELIX_APPS=mail,drive,chat,assistant
#   HELIX_EDITORS_MIGRATIONS_ENABLED=false
#   HELIX_CONFIG_JSON modules docs/calendar/meet/editors enabled:false
#   MEET_JITSI_ENABLED=false (no production Meet credentials)
#   ClamAV + SpamAssassin ON for Mail/Drive Business scanning
#   Immutable digest-only images; data-plane ports unpublished
#
# Do NOT enable Meet, Calendar, Docs, Sheets, Slides, or Editors here until
# PKG.* + domain evidence (CAL/MT/ED) + O-D.7–O-D.10 gates pass.
#
# PKG flip procedure (operators — after evidence, not a silent default):
#   1. Bind release evidence under artifacts/release-readiness/<date>/<sha>/
#   2. Promote web image built with VITE_HELIX_MVP_ONLY=false
#   3. Set HELIX_WORKSPACE_PROFILE=full and the approved Full Workspace
#      HELIX_APPS allowlist (see docs/architecture/v1-packaging-matrix.md)
#   4. Enable only modules that passed gates; Meet requires real Jitsi domain
#      + JWT secret; editors require HELIX_EDITORS_MIGRATIONS_ENABLED=true
#      with helix-editors pin process
#   5. Run helix-migrate, smoke, and RPO/RTO drill (docs/architecture/ha-rpo-rto.md)
#   6. Update AGENTS.md boundary in the same release train (PKG.2)
#
# Compose ↔ Helm parity: docs/architecture/compose-helm-parity.md
# RPO ≤ 24h / RTO ≤ 4h: node infra/scripts/rpo-rto-check.mjs …
# ---------------------------------------------------------------------------

services:
  helix-migrate:
    image: ${HELIX_IMAGE:?immutable HELIX_IMAGE registry reference with digest is required}
    build: !reset null
    pull_policy: always
    entrypoint:
      - /nodejs/bin/node
      - dist/db/migrate.js
    environment:
      NODE_ENV: production
      HELIX_IMAGE: ${HELIX_IMAGE:?immutable HELIX_IMAGE registry reference with digest is required}
      HELIX_WEB_IMAGE: ${HELIX_WEB_IMAGE:?immutable HELIX_WEB_IMAGE registry reference with digest is required}
      HELIX_POSTGRES_IMAGE: ${HELIX_POSTGRES_IMAGE:?immutable HELIX_POSTGRES_IMAGE registry reference with digest is required}
      HELIX_NATS_IMAGE: ${HELIX_NATS_IMAGE:?immutable HELIX_NATS_IMAGE registry reference with digest is required}
      HELIX_MEILISEARCH_IMAGE: ${HELIX_MEILISEARCH_IMAGE:?immutable HELIX_MEILISEARCH_IMAGE registry reference with digest is required}
      HELIX_CERBOS_IMAGE: ${HELIX_CERBOS_IMAGE:?immutable HELIX_CERBOS_IMAGE registry reference with digest is required}
      HELIX_SPAMD_IMAGE: ${HELIX_SPAMD_IMAGE:?immutable HELIX_SPAMD_IMAGE registry reference with digest is required}
      DATABASE_URL: !reset null
      DATABASE_URL_FILE: /run/secrets/migration_database_url
      POSTGRES_TLS_CA_FILE: /run/secrets/postgres_ca
      POSTGRES_POOL_MAX: "1"
      HELIX_EDITORS_MIGRATIONS_ENABLED: "false"
    secrets:
      - migration_database_url
      - postgres_ca
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-plane
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    user: "10001:10001"
    init: true
    ulimits:
      nofile:
        soft: 1024
        hard: 4096
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
          pids: 128
        reservations:
          memory: 128m

  helix:
    image: ${HELIX_IMAGE:?immutable HELIX_IMAGE registry reference with digest is required}
    build: !reset null
    pull_policy: always
    environment:
      NODE_ENV: production
      HELIX_IMAGE: ${HELIX_IMAGE:?immutable HELIX_IMAGE registry reference with digest is required}
      HELIX_WEB_IMAGE: ${HELIX_WEB_IMAGE:?immutable HELIX_WEB_IMAGE registry reference with digest is required}
      HELIX_POSTGRES_IMAGE: ${HELIX_POSTGRES_IMAGE:?immutable HELIX_POSTGRES_IMAGE registry reference with digest is required}
      HELIX_NATS_IMAGE: ${HELIX_NATS_IMAGE:?immutable HELIX_NATS_IMAGE registry reference with digest is required}
      HELIX_MEILISEARCH_IMAGE: ${HELIX_MEILISEARCH_IMAGE:?immutable HELIX_MEILISEARCH_IMAGE registry reference with digest is required}
      HELIX_CERBOS_IMAGE: ${HELIX_CERBOS_IMAGE:?immutable HELIX_CERBOS_IMAGE registry reference with digest is required}
      HELIX_SPAMD_IMAGE: ${HELIX_SPAMD_IMAGE:?immutable HELIX_SPAMD_IMAGE registry reference with digest is required}
      HELIX_SECURITY_TIER: business
      HELIX_PUBLIC_URL: https://${HELIX_DOMAIN:?HELIX_DOMAIN is required}
      PUBLIC_BASE_URL: https://${HELIX_DOMAIN:?HELIX_DOMAIN is required}
      BETTER_AUTH_URL: https://${HELIX_DOMAIN:?HELIX_DOMAIN is required}
      BETTER_AUTH_TRUSTED_ORIGINS: https://${HELIX_DOMAIN:?HELIX_DOMAIN is required}
      HELIX_CONFIG_JSON: >-
        {"security":{"tier":"business"},"modules":{"docs":{"enabled":false},"calendar":{"enabled":false},"meet":{"enabled":false},"editors":{"enabled":false}}}
      HELIX_APPS: mail,drive,chat,assistant
      HELIX_EDITORS_MIGRATIONS_ENABLED: "false"
      HELIX_STARTUP_MIGRATION_CHECK: "true"
      # The application resolves only its explicit *_FILE allowlist.
      DATABASE_URL: !reset null
      DATABASE_URL_FILE: /run/secrets/database_url
      POSTGRES_TLS_CA_FILE: /run/secrets/postgres_ca
      REDIS_URL: !reset null
      REDIS_URL_FILE: /run/secrets/redis_url
      REDIS_TLS_CA_FILE: /run/secrets/redis_ca
      NATS_URL: tls://nats:4222
      NATS_USER: helix_app
      NATS_PASSWORD: !reset null
      NATS_PASSWORD_FILE: /run/secrets/nats_password
      NATS_TLS_CA_FILE: /run/secrets/nats_ca
      NATS_TLS_CERT_FILE: /run/secrets/nats_client_cert
      NATS_TLS_KEY_FILE: /run/secrets/nats_client_key
      BETTER_AUTH_SECRET: !reset null
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      HELIX_MFA_ASSERTION_SECRET: !reset null
      HELIX_MFA_ASSERTION_SECRET_FILE: /run/secrets/mfa_assertion_secret
      HELIX_MFA_ASSERTION_ISSUER: ${HELIX_MFA_ASSERTION_ISSUER:?trusted MFA assertion issuer is required}
      HELIX_MFA_ASSERTION_AUDIENCE: ${HELIX_MFA_ASSERTION_AUDIENCE:?MFA assertion audience is required}
      RUSTFS_ACCESS_KEY: !reset null
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/rustfs_access_key
      RUSTFS_SECRET_KEY: !reset null
      RUSTFS_SECRET_KEY_FILE: /run/secrets/rustfs_secret_key
      MEILI_MASTER_KEY: !reset null
      MEILI_MASTER_KEY_FILE: /run/secrets/meili_master_key

      HELIX_POSTGRES_ENCRYPTION_AT_REST_ATTESTED: ${HELIX_POSTGRES_ENCRYPTION_AT_REST_ATTESTED:?set true only after verifying encrypted Postgres storage}
      HELIX_OBJECT_STORAGE_ENCRYPTION_AT_REST_ATTESTED: ${HELIX_OBJECT_STORAGE_ENCRYPTION_AT_REST_ATTESTED:?set true only after verifying encrypted object storage}
      HELIX_BACKUP_ENCRYPTION_AT_REST_ATTESTED: ${HELIX_BACKUP_ENCRYPTION_AT_REST_ATTESTED:?set true only after verifying encrypted backups}
      RUSTFS_SERVER_SIDE_ENCRYPTION: ${RUSTFS_SERVER_SIDE_ENCRYPTION:-AES256}

      MAIL_OUTBOUND_ENABLED: "true"
      MAIL_PROVIDER: ${MAIL_PROVIDER:?a managed outbound provider is required}
      MAIL_FROM_DOMAIN: ${MAIL_FROM_DOMAIN:?Internet sending domain is required}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:?managed provider SMTP host is required}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_USER: ${MAIL_SMTP_USER:?managed provider SMTP user is required}
      MAIL_SMTP_PASS: !reset null
      MAIL_SMTP_PASS_FILE: /run/secrets/mail_smtp_password
      MAIL_SMTP_SECURE: ${MAIL_SMTP_SECURE:-false}
      MAIL_PROVIDER_WEBHOOK_ENABLED: "true"
      MAIL_PROVIDER_WEBHOOK_SECRET: !reset null
      MAIL_PROVIDER_WEBHOOK_SECRET_FILE: /run/secrets/mail_provider_webhook_secret
      MAIL_SMTP_RECEIVER_ENABLED: "true"
      MAIL_SMTP_RECEIVER_HOST: 0.0.0.0
      MAIL_SMTP_RECEIVER_PORT: 2525
      MAIL_SPAMD_ENABLED: "true"
      MAIL_SPAMD_HOST: spamd
      MAIL_SPAMD_PORT: 783
      MAIL_SPAMD_THRESHOLD: ${MAIL_SPAMD_THRESHOLD:-5}
      MAIL_SPAMD_TIMEOUT_MS: ${MAIL_SPAMD_TIMEOUT_MS:-10000}
      MAIL_CLAMAV_ENABLED: "true"
      MAIL_CLAMAV_HOST: clamav
      MAIL_CLAMAV_PORT: 3310
      MAIL_CLAMAV_TIMEOUT_MS: ${MAIL_CLAMAV_TIMEOUT_MS:-30000}
      DRIVE_CLAMAV_ENABLED: "true"
      DRIVE_CLAMAV_HOST: clamav
      DRIVE_CLAMAV_PORT: 3310
      DRIVE_CLAMAV_TIMEOUT_MS: ${DRIVE_CLAMAV_TIMEOUT_MS:-30000}
      DRIVE_CLAMAV_MAX_BYTES: ${DRIVE_CLAMAV_MAX_BYTES:-1073741824}
      DRIVE_CLAMAV_CHUNK_SIZE_BYTES: ${DRIVE_CLAMAV_CHUNK_SIZE_BYTES:-65536}
      DRIVE_CLAMAV_SCANNER_VERSION: ${DRIVE_CLAMAV_SCANNER_VERSION:-clamd}

      # Meet is outside the core Workspace MVP and its development credentials
      # from the base Compose file must never reach a production process.
      MEET_JITSI_ENABLED: "false"
      MEET_JITSI_JWT_SECRET: !reset null
      MEET_JITSI_WEBHOOK_SHARED_SECRET: !reset null
      AUDIT_IMMUTABLE_S3_ENABLED: "false"
      AUDIT_IMMUTABLE_S3_ACCESS_KEY: !reset null
      AUDIT_IMMUTABLE_S3_SECRET_KEY: !reset null
      AUDIT_WORM_POSTGRES_ENABLED: "true"
    secrets:
      - database_url
      - postgres_ca
      - redis_url
      - redis_ca
      - nats_password
      - nats_ca
      - nats_client_cert
      - nats_client_key
      - better_auth_secret
      - mfa_assertion_secret
      - rustfs_access_key
      - rustfs_secret_key
      - meili_master_key
      - mail_smtp_password
      - mail_provider_webhook_secret
    ports: !override
      - target: 2525
        published: ${HELIX_SMTP_RECEIVE_PORT:-25}
        host_ip: ${HELIX_SMTP_RECEIVE_BIND_IP:-0.0.0.0}
        protocol: tcp
        mode: host
    depends_on: !override
      helix-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      cerbos:
        condition: service_healthy
      spamd:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks: !override
      - edge
      - data-plane
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    user: "10001:10001"
    init: true
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
          pids: 512
        reservations:
          cpus: "0.25"
          memory: 512m

  postgres:
    image: ${HELIX_POSTGRES_IMAGE:?immutable HELIX_POSTGRES_IMAGE registry reference with digest is required}
    build: !reset null
    pull_policy: always
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - postgres_app_password
      - postgres_migration_password
      - postgres_ca
      - postgres_server_cert
      - postgres_server_key
    entrypoint:
      - /bin/sh
      - -euc
      - |
        install -d -m 0700 -o postgres -g postgres /var/run/postgresql/tls
        install -m 0644 -o postgres -g postgres /run/secrets/postgres_ca /var/run/postgresql/tls/ca.pem
        install -m 0644 -o postgres -g postgres /run/secrets/postgres_server_cert /var/run/postgresql/tls/server.pem
        install -m 0600 -o postgres -g postgres /run/secrets/postgres_server_key /var/run/postgresql/tls/server-key.pem
        install -m 0600 -o postgres -g postgres /run/secrets/postgres_app_password /var/run/postgresql/tls/app-password
        install -m 0600 -o postgres -g postgres /run/secrets/postgres_migration_password /var/run/postgresql/tls/migration-password
        {
          echo 'local all all trust'
          echo 'hostssl all all 0.0.0.0/0 scram-sha-256'
          echo 'hostssl all all ::0/0 scram-sha-256'
          echo 'hostnossl all all 0.0.0.0/0 reject'
          echo 'hostnossl all all ::0/0 reject'
        } > /var/run/postgresql/tls/pg_hba.conf
        chown postgres:postgres /var/run/postgresql/tls/pg_hba.conf
        chmod 0600 /var/run/postgresql/tls/pg_hba.conf
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_ca_file=/var/run/postgresql/tls/ca.pem \
          -c ssl_cert_file=/var/run/postgresql/tls/server.pem \
          -c ssl_key_file=/var/run/postgresql/tls/server-key.pem \
          -c hba_file=/var/run/postgresql/tls/pg_hba.conf \
          -c password_encryption=scram-sha-256
    ports: !override []
    networks: !override
      - data-plane
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          memory: 512m

  redis:
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /run/secrets/redis_server_cert
      - --tls-key-file
      - /run/secrets/redis_server_key
      - --tls-ca-cert-file
      - /run/secrets/redis_ca
      - --tls-auth-clients
      - "no"
      - --aclfile
      - /run/secrets/redis_acl
    secrets:
      - redis_acl
      - redis_password
      - redis_ca
      - redis_server_cert
      - redis_server_key
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$(cat /run/secrets/redis_password)"
          redis-cli --tls --cacert /run/secrets/redis_ca ping | grep -qx PONG
      interval: 10s
      timeout: 5s
      retries: 10
    ports: !override []
    networks: !override
      - data-plane
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  nats:
    image: ${HELIX_NATS_IMAGE:?immutable HELIX_NATS_IMAGE registry reference with digest is required}
    build: !reset null
    pull_policy: always
    entrypoint:
      - /bin/sh
      - -euc
      - |
        HELIX_NATS_PASSWORD="$$(tr -d '\r\n' < /run/secrets/nats_password)"
        case "$$HELIX_NATS_PASSWORD" in
          *[!A-Za-z0-9_-]*|'') echo "NATS password must be a non-empty base64url value." >&2; exit 1 ;;
        esac
        export HELIX_NATS_PASSWORD
        exec nats-server --config /etc/nats/nats-server.production.conf
    command: !reset []
    volumes: !override
      - nats-data:/data
      - ./infra/nats/nats-server.production.conf:/etc/nats/nats-server.production.conf:ro
    secrets:
      - nats_password
      - nats_ca
      - nats_server_cert
      - nats_server_key
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8222/healthz | grep -q '"status":"ok"'
      interval: 10s
      timeout: 5s
      retries: 10
    ports: !override []
    networks: !override
      - data-plane
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  meilisearch:
    image: ${HELIX_MEILISEARCH_IMAGE:?immutable HELIX_MEILISEARCH_IMAGE registry reference with digest is required}
    build: !reset null
    pull_policy: always
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: !reset null
    entrypoint:
      - /bin/sh
      - -euc
      - |
        export MEILI_MASTER_KEY="$$(cat /run/secrets/meili_master_key)"
        exec meilisearch
    secrets:
      - meili_master_key
    ports: !override []
    networks: !override
      - data-plane
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  rustfs:
    environment:
      RUSTFS_ACCESS_KEY: !reset null
      RUSTFS_SECRET_KEY: !reset null
      RUSTFS_CONSOLE_ENABLE: "false"
    entrypoint:
      - /bin/sh
      - -euc
      - |
        export RUSTFS_ACCESS_KEY="$$(cat /run/secrets/rustfs_access_key)"
        export RUSTFS_SECRET_KEY="$$(cat /run/secrets/rustfs_secret_key)"
        exec rustfs /data
    secrets:
      - rustfs_access_key
      - rustfs_secret_key
    ports: !override []
    networks: !override
      - data-plane
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  cerbos:
    image: ${HELIX_CERBOS_IMAGE:?immutable HELIX_CERBOS_IMAGE registry reference with digest is required}
    build: !reset null
    pull_policy: always
    ports: !override []
    networks: !override
      - data-plane
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  mailpit:
    profiles: !override
      - development-only
    ports: !override []
    networks: !override
      - data-plane

  spamd:
    image: ${HELIX_SPAMD_IMAGE:?immutable HELIX_SPAMD_IMAGE registry reference with digest is required}
    build: !reset null
    pull_policy: always
    profiles: !override []
    command: !reset []
    environment:
      DNS_CHECKS: "1"
    ports: !override []
    networks: !override
      - data-plane
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  clamav:
    profiles: !override []
    ports: !override []
    networks: !override
      - data-plane
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  drive-preview-libreoffice:
    ports: !override []
    networks: !override
      - data-plane
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    image: ${HELIX_WEB_IMAGE:?immutable HELIX_WEB_IMAGE registry reference with digest is required}
    build: !reset null
    pull_policy: always
    environment:
      HELIX_DOMAIN: ${HELIX_DOMAIN:?HELIX_DOMAIN is required}
      HELIX_UPSTREAM: helix:3000
    ports: !override
      - target: 80
        published: ${CADDY_HTTP_PORT:-80}
        host_ip: ${CADDY_BIND_IP:-0.0.0.0}
        protocol: tcp
        mode: host
      - target: 443
        published: ${CADDY_HTTPS_PORT:-443}
        host_ip: ${CADDY_BIND_IP:-0.0.0.0}
        protocol: tcp
        mode: host
      - target: 443
        published: ${CADDY_HTTPS_PORT:-443}
        host_ip: ${CADDY_BIND_IP:-0.0.0.0}
        protocol: udp
        mode: host
    volumes: !override
      - caddy-data:/data
      - caddy-config:/config
    depends_on: !override
      helix:
        condition: service_healthy
    networks: !override
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    user: "10001:10001"
    ulimits:
      nofile:
        soft: 1024
        hard: 4096
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m
          pids: 128

  # Optional profiles remain private even when an operator explicitly enables
  # them. Use a VPN, SSH tunnel, or separately authenticated admin ingress.
  jitsi-web:
    ports: !override []
    networks: !override
      - data-plane
  jitsi-prosody:
    ports: !override []
    networks: !override
      - data-plane
  jitsi-jicofo:
    networks: !override
      - data-plane
  jitsi-jvb:
    ports: !override []
    networks: !override
      - data-plane
  jitsi-jibri:
    networks: !override
      - data-plane
  otel-collector:
    ports: !override []
    networks: !override
      - data-plane
  prometheus:
    ports: !override []
    networks: !override
      - data-plane
  alertmanager:
    ports: !override []
    networks: !override
      - data-plane
  tempo:
    ports: !override []
    networks: !override
      - data-plane
  loki:
    ports: !override []
    networks: !override
      - data-plane
  grafana:
    ports: !override []
    networks: !override
      - data-plane

networks:
  edge:
    name: ${HELIX_COMPOSE_PROJECT_NAME:-helix-production}-edge
  data-plane:
    name: ${HELIX_COMPOSE_PROJECT_NAME:-helix-production}-data-plane
    internal: true

secrets:
  database_url:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/database_url
  migration_database_url:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/migration_database_url
  postgres_password:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/postgres_password
  postgres_app_password:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/postgres_app_password
  postgres_migration_password:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/postgres_migration_password
  postgres_ca:

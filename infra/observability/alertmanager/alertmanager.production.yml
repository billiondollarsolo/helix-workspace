global:
  resolve_timeout: 5m

route:
  receiver: helix-null
  group_by:
    [
      "alertname",
      "severity",
      "priority",
      "owner",
      "service",
      "product",
      "slo",
      "tier",
      "plan_id",
      "region",
    ]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: helix-product-slo-paging
      matchers:
        - slo=~"product_availability|availability|freshness|healthy_media"

receivers:
  - name: helix-null
  - name: helix-product-slo-paging
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/product-slo-paging-webhook-url
        send_resolved: true

{{- if .Values.backupWorker.enabled }}
{{- if or (not (regexMatch "^[^ ]+@sha256:[a-f0-9]{64}$" .Values.backupWorker.image)) (hasSuffix (repeat 64 "0") .Values.backupWorker.image) }}
{{- fail "backupWorker.image must be pinned by digest" }}
{{- end }}
{{- if or (not .Values.backupWorker.existingSecret) (not .Values.backupWorker.ingress) (not .Values.backupWorker.egress) }}
{{- fail "backupWorker requires an existing private Secret and explicit ingress/egress rules" }}
{{- end }}
{{- if and .Values.backupWorker.ownsSchedule .Values.cloudnativepg.enabled .Values.cloudnativepg.scheduledBackup.enabled (not .Values.cloudnativepg.scheduledBackup.suspend) }}
{{- fail "Suspend the existing CNPG ScheduledBackup before handing scheduling to the recovery worker" }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "helix.fullname" . }}-backup-worker
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOncePod]
  {{- with .Values.backupWorker.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.backupWorker.persistence.size | quote }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helix.fullname" . }}-backup-worker
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: helix-backup-worker, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: helix-backup-worker, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: backup-worker
          image: {{ .Values.backupWorker.image | quote }}
          command: [node, /app/dist/platform/backup/family-worker.js, serve, /etc/helix-backup-worker/worker.json]
          ports: [{name: recovery, containerPort: 3081}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /healthz, port: recovery}, initialDelaySeconds: 3, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: recovery}, initialDelaySeconds: 15, periodSeconds: 20}
          resources:
            {{- toYaml .Values.backupWorker.resources | nindent 12 }}
          volumeMounts:
            - {name: state, mountPath: /var/lib/helix-backup-worker}
            - {name: temporary, mountPath: /tmp}
            - {name: private, mountPath: /etc/helix-backup-worker/worker.json, subPath: {{ .Values.backupWorker.configKey | quote }}, readOnly: true}
            - {name: private, mountPath: /etc/helix-backup-worker/management.key, subPath: {{ .Values.backupWorker.managementKey | quote }}, readOnly: true}
            {{- if .Values.backupWorker.restoreKey }}
            - {name: private, mountPath: /etc/helix-backup-worker/restore.key, subPath: {{ .Values.backupWorker.restoreKey | quote }}, readOnly: true}
            {{- end }}
            {{- range .Values.backupWorker.extraSecretKeys }}
            - {name: private, mountPath: {{ printf "/etc/helix-backup-worker/%s" . | quote }}, subPath: {{ . | quote }}, readOnly: true}
            {{- end }}
            {{- with .Values.backupWorker.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- with .Values.backupWorker.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - {name: state, persistentVolumeClaim: {claimName: {{ include "helix.fullname" . }}-backup-worker}}
        - {name: temporary, emptyDir: {medium: Memory, sizeLimit: 256Mi}}
        - name: private
          secret: {secretName: {{ .Values.backupWorker.existingSecret | quote }}, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata: {name: {{ include "helix.fullname" . }}-backup-worker}
spec:
  selector: {app.kubernetes.io/name: helix-backup-worker, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: recovery, port: 3081, targetPort: recovery}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "helix.fullname" . }}-backup-worker}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: helix-backup-worker, app.kubernetes.io/instance: {{ .Release.Name }}}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- toYaml .Values.backupWorker.ingress | nindent 4 }}
  egress:
    {{- toYaml .Values.backupWorker.egress | nindent 4 }}
{{- end }}

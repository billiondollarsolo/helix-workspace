apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: object
  version: default
  importDerivedRoles:
    - helix_platform_roles
  schemas:
    principalSchema:
      ref: cerbos:///platform/principal.json
    resourceSchema:
      ref: cerbos:///platform/resource.json
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      roles: ["admin"]
      condition:
        match:
          expr: P.attr.org_id == R.attr.org_id

    - actions: ["create", "list", "search"]
      effect: EFFECT_ALLOW
      derivedRoles: ["org_member"]

    - actions: ["read", "download", "preview", "comment"]
      effect: EFFECT_ALLOW
      derivedRoles: ["org_member"]
      condition:
        match:
          expr: R.attr.visibility == "org"

    - actions: ["read", "download", "preview", "comment"]
      effect: EFFECT_ALLOW
      derivedRoles: ["shared", "participant"]

    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["owner"]

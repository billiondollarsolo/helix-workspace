packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "esbuild": true
  "protobufjs": true

blockExoticSubdeps: true
engineStrict: true
injectWorkspacePackages: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@fastify/swagger-ui@6.1.1"
  - "@tanstack/react-virtual@3.14.9"
  - "@tanstack/virtual-core@3.17.7"
  - "jsdom@30.0.1"
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
nodeVersion: 24.18.0

overrides:
  "@xmldom/xmldom@0.8": "0.8.15"
  "nanoid@3": "3.3.18"
  "@esbuild-kit/core-utils>esbuild": "0.28.1"
  "@grpc/grpc-js": "1.14.4"
  "brace-expansion": "5.0.9"
  "fast-uri@3": "3.1.6"
  "fast-uri@4": "4.1.3"
  "find-my-way": "9.7.0"
  "linkify-it": "5.0.2"
  "next": "16.2.11"
  "nodemailer": "9.1.0"
  "postcss": "8.5.24"
  "protobufjs": "7.6.5"
  "tmp": "0.2.7"
  "undici": "7.29.0"
  "ws": "8.21.1"

peerDependencyRules:
  allowedVersions:
    "@napi-rs/wasm-runtime@1.2.0>@emnapi/core": "1.11.1"
    "@napi-rs/wasm-runtime@1.2.0>@emnapi/runtime": "1.11.1"

strictDepBuilds: true
trustLockfile: false

packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "esbuild": true
  "protobufjs": true

blockExoticSubdeps: true
engineStrict: true
injectWorkspacePackages: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@fastify/swagger-ui@6.1.1"
  - "@tanstack/react-virtual@3.14.9"
  - "@tanstack/virtual-core@3.17.7"
  - "jsdom@30.0.1"
  - "pdfjs-dist@6.2.108"
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
nodeVersion: 24.18.0

overrides:
  "@esbuild-kit/core-utils>esbuild": "0.28.1"
  "@grpc/grpc-js": "1.14.4"
  "brace-expansion": "5.0.8"
  "exceljs>uuid": "14.0.1"
  "fast-uri@3.1.2": "3.1.4"
  "fast-uri@4.1.0": "4.1.1"
  "find-my-way": "9.7.0"
  "linkify-it": "5.0.2"
  "next": "16.2.11"
  "nodemailer": "9.0.3"
  "postcss": "8.5.24"
  "protobufjs": "7.6.5"
  "sharp": "0.35.3"
  "tmp": "0.2.7"
  "undici": "7.29.0"
  "ws": "8.21.1"

patchedDependencies:
  "minimatch@3.1.5": "patches/minimatch@3.1.5.patch"
  "minimatch@5.1.9": "patches/minimatch@5.1.9.patch"

peerDependencyRules:
  allowedVersions:
    "@napi-rs/wasm-runtime@1.2.0>@emnapi/core": "1.11.1"
    "@napi-rs/wasm-runtime@1.2.0>@emnapi/runtime": "1.11.1"

strictDepBuilds: true
trustLockfile: false

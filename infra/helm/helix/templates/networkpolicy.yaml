{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "helix.fullname" . }}
  labels:
    {{- include "helix.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "helix.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingress.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.ingress.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 3000
  {{- if .Values.networkPolicy.egress.allowAll }}
  egress:
    - {}
  {{- else if or .Values.networkPolicy.egress.allowDns .Values.networkPolicy.egress.cidrs }}
  egress:
    {{- if .Values.networkPolicy.egress.allowDns }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- range .Values.networkPolicy.egress.cidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        {{- toYaml $.Values.networkPolicy.egress.ports | nindent 8 }}
    {{- end }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}

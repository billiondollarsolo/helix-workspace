name: PlatformResourcePolicies
description: Verifies Helix platform derived roles and resource policies.

principals:
  admin:
    id: admin-1
    roles: ["admin"]
    attr:
      org_id: org-1
      type: user

  admin_other_org:
    id: admin-2
    roles: ["admin"]
    attr:
      org_id: org-2
      type: user

  auditor:
    id: auditor-1
    roles: ["auditor"]
    attr:
      org_id: org-1
      type: user

  auditor_other_org:
    id: auditor-2
    roles: ["auditor"]
    attr:
      org_id: org-2
      type: user

  owner:
    id: actor-owner
    roles: ["user"]
    attr:
      org_id: org-1
      type: user

  owner_other_org:
    id: actor-owner
    roles: ["user"]
    attr:
      org_id: org-2
      type: user

  participant:
    id: actor-participant
    roles: ["user"]
    attr:
      org_id: org-1
      type: user

  participant_other_org:
    id: actor-participant
    roles: ["user"]
    attr:
      org_id: org-2
      type: user

  shared:
    id: actor-shared
    roles: ["user"]
    attr:
      org_id: org-1
      type: user

  shared_other_org:
    id: actor-shared
    roles: ["user"]
    attr:
      org_id: org-2
      type: user

  org_member:
    id: actor-org-member
    roles: ["user"]
    attr:
      org_id: org-1
      type: user

  outsider:
    id: actor-outsider
    roles: ["user"]
    attr:
      org_id: org-2
      type: user

  scoped_agent:
    id: agent-scoped
    roles: ["agent"]
    attr:
      org_id: org-1
      type: agent
      scopes: ["mail.read"]

  scoped_agent_other_org:
    id: agent-scoped-other
    roles: ["agent"]
    attr:
      org_id: org-2
      type: agent
      scopes: ["mail.read"]

resources:
  object_private:
    kind: object
    id: object-1
    attr:
      org_id: org-1
      owner_id: actor-owner
      participant_ids: ["actor-participant"]
      shared_actor_ids: ["actor-shared"]
      shared_org_ids: []
      visibility: private

  object_org:
    kind: object
    id: object-2
    attr:
      org_id: org-1
      owner_id: actor-owner
      participant_ids: []
      shared_actor_ids: []
      shared_org_ids: []
      visibility: org

  thread_private:
    kind: thread
    id: thread-1
    attr:
      org_id: org-1
      owner_id: actor-owner
      participant_ids: ["actor-participant"]
      shared_actor_ids: ["actor-shared"]
      shared_org_ids: []
      visibility: private

  calendar_private:
    kind: calendar
    id: calendar-1
    attr:
      org_id: org-1
      owner_id: actor-owner
      participant_ids: ["actor-participant"]
      shared_actor_ids: ["actor-shared"]
      shared_org_ids: []
      visibility: private

  event_private:
    kind: event
    id: event-1
    attr:
      org_id: org-1
      owner_id: actor-owner
      participant_ids: ["actor-participant"]
      shared_actor_ids: ["actor-shared"]
      shared_org_ids: []
      visibility: private

  admin_console:
    kind: admin
    id: admin-console
    attr:
      org_id: org-1
      section: platform

  mail_read_tool:
    kind: tool
    id: mail.search
    attr:
      org_id: org-1
      permission: mail.read
      sideEffects: read

  mail_send_tool:
    kind: tool
    id: mail.send
    attr:
      org_id: org-1
      permission: mail.send
      sideEffects: external_communication

tests:
  - name: Object access is owner participant shared org-visible
    input:
      principals:
        [
          "admin",
          "admin_other_org",
          "owner",
          "owner_other_org",
          "participant",
          "participant_other_org",
          "shared",
          "shared_other_org",
          "org_member",
          "outsider",
        ]
      resources: ["object_private", "object_org"]
      actions: ["create", "read", "comment", "update", "delete", "share"]
    expected:
      - principal: admin
        resources: ["object_private", "object_org"]
        actions:
          create: EFFECT_ALLOW
          read: EFFECT_ALLOW
          comment: EFFECT_ALLOW
          update: EFFECT_ALLOW
          delete: EFFECT_ALLOW
          share: EFFECT_ALLOW
      - principal: admin_other_org
        resources: ["object_private", "object_org"]
        actions:
          create: EFFECT_DENY
          read: EFFECT_DENY
          comment: EFFECT_DENY
          update: EFFECT_DENY
          delete: EFFECT_DENY
          share: EFFECT_DENY
      - principal: owner
        resources: ["object_private", "object_org"]
        actions:
          create: EFFECT_ALLOW
          read: EFFECT_ALLOW
          comment: EFFECT_ALLOW
          update: EFFECT_ALLOW
          delete: EFFECT_ALLOW
          share: EFFECT_ALLOW
      - principal: owner_other_org
        resources: ["object_private", "object_org"]
        actions:
          create: EFFECT_DENY
          read: EFFECT_DENY
          comment: EFFECT_DENY
          update: EFFECT_DENY
          delete: EFFECT_DENY
          share: EFFECT_DENY
      - principal: participant
        resource: object_private
        actions:
          create: EFFECT_ALLOW
          read: EFFECT_ALLOW
          comment: EFFECT_ALLOW
      - principal: participant
        resource: object_org
        actions:
          create: EFFECT_ALLOW
          read: EFFECT_ALLOW
          comment: EFFECT_ALLOW
      - principal: participant_other_org
        resources: ["object_private", "object_org"]
        actions:
          create: EFFECT_DENY
          read: EFFECT_DENY
          comment: EFFECT_DENY
      - principal: shared
        resource: object_private
        actions:
          create: EFFECT_ALLOW
          read: EFFECT_ALLOW
          comment: EFFECT_ALLOW
      - principal: shared
        resource: object_org
        actions:
          create: EFFECT_ALLOW
          read: EFFECT_ALLOW
          comment: EFFECT_ALLOW
      - principal: shared_other_org
        resources: ["object_private", "object_org"]
        actions:
          create: EFFECT_DENY
          read: EFFECT_DENY
          comment: EFFECT_DENY
      - principal: org_member
        resource: object_org
        actions:
          create: EFFECT_ALLOW
          read: EFFECT_ALLOW
          comment: EFFECT_ALLOW
      - principal: org_member
        resource: object_private
        actions:
          create: EFFECT_ALLOW

  - name: Thread calendar and event collaborators can use expected actions
    input:
      principals:
        [
          "owner",
          "owner_other_org",
          "participant",
          "participant_other_org",
          "shared",
          "shared_other_org",
          "outsider",
        ]
      resources: ["thread_private", "calendar_private", "event_private"]
      actions: ["read", "reply", "create_event", "rsvp", "delete"]
    expected:
      - principal: owner
        resources: ["thread_private", "calendar_private", "event_private"]
        actions:
          read: EFFECT_ALLOW
          reply: EFFECT_ALLOW
          create_event: EFFECT_ALLOW
          rsvp: EFFECT_ALLOW
          delete: EFFECT_ALLOW
      - principal: owner_other_org
        resources: ["thread_private", "calendar_private", "event_private"]
        actions:
          read: EFFECT_DENY
          reply: EFFECT_DENY
          create_event: EFFECT_DENY
          rsvp: EFFECT_DENY
          delete: EFFECT_DENY
      - principal: participant
        resource: thread_private
        actions:
          read: EFFECT_ALLOW
          reply: EFFECT_ALLOW
      - principal: participant
        resource: calendar_private
        actions:
          read: EFFECT_ALLOW
          create_event: EFFECT_ALLOW
      - principal: participant
        resource: event_private
        actions:
          read: EFFECT_ALLOW
          rsvp: EFFECT_ALLOW
      - principal: participant_other_org
        resources: ["thread_private", "calendar_private", "event_private"]
        actions:
          read: EFFECT_DENY
          reply: EFFECT_DENY
          create_event: EFFECT_DENY
          rsvp: EFFECT_DENY
      - principal: shared
        resources: ["thread_private", "calendar_private", "event_private"]
        actions:
          read: EFFECT_ALLOW
      - principal: shared
        resource: event_private
        actions:
          rsvp: EFFECT_ALLOW
      - principal: shared_other_org
        resources: ["thread_private", "calendar_private", "event_private"]
        actions:
          read: EFFECT_DENY
          rsvp: EFFECT_DENY

  - name: Admin resource is restricted to admins and auditors
    input:
      principals: ["admin", "admin_other_org", "auditor", "auditor_other_org", "owner", "outsider"]
      resources: ["admin_console"]
      actions: ["read", "update", "delete"]
    expected:
      - principal: admin
        resource: admin_console
        actions:
          read: EFFECT_ALLOW
          update: EFFECT_ALLOW
          delete: EFFECT_ALLOW
      - principal: admin_other_org
        resource: admin_console
        actions:
          read: EFFECT_DENY
          update: EFFECT_DENY
          delete: EFFECT_DENY
      - principal: auditor
        resource: admin_console
        actions:
          read: EFFECT_ALLOW
      - principal: auditor_other_org
        resource: admin_console
        actions:
          read: EFFECT_DENY
          update: EFFECT_DENY
          delete: EFFECT_DENY

  - name: Tool resources require matching actor scopes
    input:
      principals: ["admin", "admin_other_org", "scoped_agent", "scoped_agent_other_org", "outsider"]
      resources: ["mail_read_tool", "mail_send_tool"]
      actions: ["mail.read", "mail.send"]
    expected:
      - principal: admin
        resources: ["mail_read_tool", "mail_send_tool"]
        actions:
          "mail.read": EFFECT_ALLOW
          "mail.send": EFFECT_ALLOW
      - principal: admin_other_org
        resources: ["mail_read_tool", "mail_send_tool"]
        actions:
          "mail.read": EFFECT_DENY
          "mail.send": EFFECT_DENY
      - principal: scoped_agent
        resource: mail_read_tool
        actions:
          "mail.read": EFFECT_ALLOW
      - principal: scoped_agent
        resource: mail_send_tool
        actions:
          "mail.send": EFFECT_DENY
      - principal: scoped_agent_other_org
        resources: ["mail_read_tool", "mail_send_tool"]
        actions:
          "mail.read": EFFECT_DENY
          "mail.send": EFFECT_DENY
      - principal: outsider
        resources: ["mail_read_tool", "mail_send_tool"]
        actions:
          "mail.read": EFFECT_DENY
          "mail.send": EFFECT_DENY

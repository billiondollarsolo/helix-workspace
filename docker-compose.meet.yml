# Optional install: Meet (video meetings on a bundled LiveKit server) and Calendar.
#
#   docker compose --env-file .env.production \
#     -f docker-compose.yml -f docker-compose.production.yml \
#     -f docker-compose.meet.yml up -d
#
# Without this file nothing here is deployed: the production stack stays on the
# Mail, Drive, Chat, Assistant packaging and runs no media services. Adding it
# switches Helix to the Full Workspace profile (Calendar and Meet) and starts
# LiveKit. Browsers signal through Caddy at /rtc on the Workspace address, so
# Meet needs no hostname of its own.
#
# Before the first start:
#   1. Point HELIX_MEET_TURN_DOMAIN (for example turn.example.com) at this host,
#      DNS only (not proxied).
#   2. Set HELIX_MEET_PUBLIC_IP to the address browsers reach this host on.
#   3. Open TCP 7881 and UDP 7882 (media), UDP 3478 (TURN) and TCP 5349
#      (TURN over TLS) in the host firewall.
#   4. Create the Meet secret files:
#        node infra/scripts/generate-production-secrets.mjs --add-meet \
#          --dir "$HELIX_PRODUCTION_SECRETS_DIR" --turn-host "$HELIX_MEET_TURN_DOMAIN"
#
# Recording (LiveKit Egress) is not part of this install yet. See
# docs/deployment-production.md.

# Bounded container logs: without a cap one noisy service can fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  helix:
    logging: *default-logging
    environment:
      # The Full Workspace profile: Calendar and Meet on top of the core apps.
      # Helix keeps Meet unavailable without the LiveKit key and secrets below.
      HELIX_WORKSPACE_PROFILE: full
      HELIX_APPS: mail,drive,chat,assistant,calendar,meet
      HELIX_CONFIG_JSON: >-
        {"security":{"tier":"business"},"modules":{"docs":{"enabled":false},"editors":{"enabled":false}}}
      # Browsers connect to wss://<HELIX_DOMAIN>, which Caddy routes to
      # LiveKit at /rtc. Set LIVEKIT_PUBLIC_URL only to use another address.
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-helix}
      LIVEKIT_API_SECRET_FILE: /run/secrets/livekit_api_secret
      # LiveKit runs on the host network (see below); reach its API through the
      # Docker host gateway. Firewalls must let the edge network reach 7880.
      LIVEKIT_INTERNAL_URL: http://${HELIX_LIVEKIT_HOST:-host.docker.internal}:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
      MEET_CAPTURE_SECRET_FILE: /run/secrets/meet_capture_secret
      # Media stays in the deployment's region.
      MEET_MEDIA_REGION: ${HELIX_REGION:?deployment region label is required}
      # The admin DNS checklist checks this TURN record.
      HELIX_MEET_TURN_DOMAIN: ${HELIX_MEET_TURN_DOMAIN:?HELIX_MEET_TURN_DOMAIN is required for the Meet install}
    secrets:
      - livekit_api_secret
      - meet_capture_secret
    extra_hosts:
      - host.docker.internal:host-gateway
    # LiveKit's webhooks arrive here from the host network, on loopback only.
    ports:
      - target: 3000
        published: ${HELIX_LIVEKIT_WEBHOOK_PORT:-33000}
        host_ip: 127.0.0.1
        protocol: tcp

  caddy:
    logging: *default-logging
    environment:
      # Adds the /rtc route to the Workspace site.
      HELIX_MEET_SITE: -on
      HELIX_LIVEKIT_UPSTREAM: ${HELIX_LIVEKIT_HOST:-host.docker.internal}:7880
    extra_hosts:
      - host.docker.internal:host-gateway

  livekit:
    logging: *default-logging
    profiles: !override []
    # The image's shell turns the secret file into the key list; the secret
    # never appears in the Compose file or environment.
    entrypoint: !override
      - /bin/sh
      - -ec
      - |
        LIVEKIT_KEYS="$${LIVEKIT_API_KEY}: $$(cat /run/secrets/livekit_api_secret)"
        export LIVEKIT_KEYS
        exec /livekit-server
    environment:
      LIVEKIT_KEYS: !reset null
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-helix}
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: ${HELIX_MEET_RTC_TCP_PORT:-7881}
          udp_port: ${HELIX_MEET_RTC_UDP_PORT:-7882}
          node_ip: ${HELIX_MEET_PUBLIC_IP:?HELIX_MEET_PUBLIC_IP is required for the Meet install}
          use_external_ip: false
        turn:
          enabled: true
          domain: ${HELIX_MEET_TURN_DOMAIN:?HELIX_MEET_TURN_DOMAIN is required for the Meet install}
          udp_port: ${HELIX_MEET_TURN_PORT:-3478}
          tls_port: ${HELIX_MEET_TURNS_PORT:-5349}
          cert_file: /run/secrets/turn_cert
          key_file: /run/secrets/turn_key
        webhook:
          api_key: ${LIVEKIT_API_KEY:-helix}
          urls:
            - http://127.0.0.1:${HELIX_LIVEKIT_WEBHOOK_PORT:-33000}/webhook/livekit
    secrets: !override
      - livekit_api_secret
      - turn_cert
      - turn_key
    # A single LiveKit node needs no Redis.
    depends_on: !reset {}
    # Host networking: WebRTC media through Docker's port forwarding loses
    # packets (UDP NAT conntrack clashes) and breaks TURN relaying to the SFU.
    # LiveKit therefore listens on the host: 7881/tcp, 7882/udp, 3478/udp and
    # 5349/tcp must be open to the internet; 7880 only to the Docker edge
    # network (Caddy's /rtc route and Workspace).
    network_mode: host
    ports: !reset []
    networks: !reset []
    # Read-only root, no capabilities, non-root user and no-new-privileges
    # come from docker-compose.yml.
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2g
          pids: 1024

secrets:
  livekit_api_secret:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/livekit_api_secret
  meet_capture_secret:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/meet_capture_secret
  # TURN over TLS. Browsers verify it: use a publicly trusted certificate for
  # HELIX_MEET_TURN_DOMAIN (see docs/deployment-production.md).
  turn_cert:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/turn_cert
  turn_key:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/turn_key

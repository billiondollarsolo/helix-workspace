name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  source-and-helm-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: helix-all/helix-workspace
    steps:
      - name: Checkout helix-workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: helix-all/helix-workspace
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: |
            helix-all/helix-workspace/pnpm-lock.yaml

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          archive="$RUNNER_TEMP/kubeconform-linux-amd64.tar.gz"
          bin_dir="$RUNNER_TEMP/kubeconform-bin"
          curl --fail --silent --show-error --location \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output "$archive"
          echo "${KUBECONFORM_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" kubeconform
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source formatting
        run: pnpm format:check

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Lint workspace
        run: pnpm lint

      - name: Validate environment and helper contracts
        run: pnpm quality:environment && pnpm quality:duplicates

      - name: Ratchet source file sizes
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$QUALITY_BASE_SHA" && "$QUALITY_BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            pnpm quality:file-size --base "$QUALITY_BASE_SHA"
          else
            pnpm quality:file-size
          fi

      - name: Build workspace
        run: pnpm build

      - name: Verify generated routes are current
        run: git diff --exit-code -- apps/web/src/routeTree.gen.ts

      - name: Validate Helm chart
        run: pnpm infra:helm:validate

      - name: Prove production-readiness contracts fail closed
        run: pnpm quality:production-readiness-contract:test

      - name: Prove quality gates fail closed
        run: pnpm quality:gates-contract:test && node --test infra/scripts/check-test-skips.test.mjs

      - name: Prove final-release evidence gates fail closed
        run: pnpm quality:release-evidence-contract:test

      - name: Prove V5 DAST evidence contract fails closed
        run: pnpm quality:dast-contract:test

      - name: Test launch documentation contract
        run: pnpm quality:launch-docs:test

      - name: Verify launch documentation claims
        run: pnpm quality:launch-docs

  platform-mode-matrix:
    name: test:${{ matrix.helix_mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: helix_tests_${{ matrix.helix_mode }}_${{ github.run_id }}
      POSTGRES_DB: helix_ci
      DATABASE_URL: postgres://helix:helix_dev_password@127.0.0.1:28432/helix_ci
      HELIX_MIGRATION_DATABASE_URL: postgres://helix:helix_dev_password@127.0.0.1:28432/helix_ci
      HELIX_RLS_APP_DATABASE_URL: postgres://helix_app:helix_app_local@127.0.0.1:28432/helix_ci
      HELIX_RLS_WORKER_DATABASE_URL: postgres://helix_worker:helix_worker_local@127.0.0.1:28432/helix_ci
      HELIX_RLS_READONLY_DATABASE_URL: postgres://helix_readonly:helix_readonly_local@127.0.0.1:28432/helix_ci
      HELIX_REQUIRE_LIVE_SUITES: "1"
      HELIX_TEST_DATABASE_TEMPLATE: postgres://helix:helix_dev_password@127.0.0.1:28432/helix_ci
      S3_CONTRACT_ENDPOINT: http://127.0.0.1:28437
      S3_CONTRACT_ACCESS_KEY: helixrustfs
      S3_CONTRACT_SECRET_KEY: helix_rustfs_dev_secret
      S3_CONTRACT_BUCKET: helix-objects
      RUSTFS_SERVER_DOMAINS: localhost,rustfs,127.0.0.1,127.0.0.1:28437
    defaults:
      run:
        working-directory: helix-all/helix-workspace
    strategy:
      fail-fast: false
      matrix:
        helix_mode:
          - single-tenant
          - multi-tenant-saas
    steps:
      - name: Checkout helix-workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: helix-all/helix-workspace

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: |
            helix-all/helix-workspace/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL and RustFS using reviewed image pins
        run: docker compose up -d --build --wait postgres rustfs

      - name: Apply all database migrations
        run: pnpm --filter @helix/app db:migrate

      - name: Prepare S3 contract bucket
        run: >-
          pnpm --filter @helix/app exec tsx --eval
          'import { createS3CompatibleStorage } from "./src/platform/storage/index.ts";
          void createS3CompatibleStorage({ endpoint: process.env.S3_CONTRACT_ENDPOINT,
          region: "us-east-1", bucket: process.env.S3_CONTRACT_BUCKET,
          credentials: { accessKeyId: process.env.S3_CONTRACT_ACCESS_KEY,
          secretAccessKey: process.env.S3_CONTRACT_SECRET_KEY }, fetch }).ensureBucket();'

      - name: Run platform mode test suite
        run: >-
          pnpm test:${{ matrix.helix_mode }} --
          --no-file-parallelism --coverage --reporter=default --reporter=json
          --outputFile.json=vitest-results.json

      - name: Reject unexpected skipped tests
        if: always()
        run: node infra/scripts/check-test-skips.mjs

      - name: Upload complete test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-tests-${{ matrix.helix_mode }}
          path: helix-all/helix-workspace/**/vitest-results.json
          if-no-files-found: error

      - name: Upload measured coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.helix_mode }}
          path: |
            helix-all/helix-workspace/**/coverage/lcov.info
            helix-all/helix-workspace/**/coverage/coverage-summary.json
          if-no-files-found: error

      - name: Stop isolated test services
        if: always()
        run: docker compose down -v --remove-orphans

  repo-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: helix-all/helix-workspace
    steps:
      - name: Checkout helix-workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: helix-all/helix-workspace

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: |
            helix-all/helix-workspace/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Verify supply-chain policy
        run: pnpm quality:supply-chain

      - name: Verify Compose remains local-only
        run: pnpm infra:compose:validate

      - name: Verify browser and edge security headers
        run: pnpm infra:caddy:validate

      - name: Verify bounded Internet mail edge
        run: pnpm infra:mail-edge:validate

      - name: Verify workspace boundaries
        run: pnpm quality:boundaries

      - name: Enforce expiring unsafe-cast budgets
        run: pnpm quality:contracts

  backend-live-demo-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: helix-all/helix-workspace
    steps:
      - name: Checkout helix-workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: helix-all/helix-workspace

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: |
            helix-all/helix-workspace/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Docker daemon
        run: docker info

      - name: Run live demo data smoke
        run: pnpm quality:live-demo-data -- --execute --compose-project helix_demo_smoke_ci_${{ github.run_id }} --volume-mail-count 25 --batch-size 10

      - name: Run database migrations
        env:
          DATABASE_URL: postgres://helix:helix_dev_password@127.0.0.1:39532/helix_demo_smoke
        run: pnpm --filter @helix/app db:migrate

      - name: Prove forced tenant RLS with constrained database roles
        env:
          HELIX_MIGRATION_DATABASE_URL: postgres://helix:helix_dev_password@127.0.0.1:39532/helix_demo_smoke
          HELIX_RLS_APP_DATABASE_URL: postgres://helix_app:helix_app_ci@127.0.0.1:39532/helix_demo_smoke
          HELIX_RLS_WORKER_DATABASE_URL: postgres://helix_worker:helix_worker_ci@127.0.0.1:39532/helix_demo_smoke
          HELIX_RLS_READONLY_DATABASE_URL: postgres://helix_readonly:helix_readonly_ci@127.0.0.1:39532/helix_demo_smoke
        run: |
          docker compose -p helix_demo_smoke_ci_${{ github.run_id }} exec -T postgres \
            psql -U helix -d helix_demo_smoke -v ON_ERROR_STOP=1 \
            -c "alter role helix_app password 'helix_app_ci'; alter role helix_worker password 'helix_worker_ci'; alter role helix_readonly password 'helix_readonly_ci';"
          pnpm --filter @helix/app test -- src/platform/tenancy/rls-hardening.integration.test.ts
      # Both properties, not one: the suite also proves permission rows do not
      # cross tenants, and a -t filter here silently left that unproven.
      - name: Prove live PostgreSQL tenant isolation
        env:
          DATABASE_URL: postgres://helix:helix_dev_password@127.0.0.1:39532/helix_demo_smoke
          # This job has a database, so a skip here means the database failed to
          # come up — not that the suite was inapplicable. Fail instead of
          # reporting green on a proof that never ran.
          HELIX_REQUIRE_LIVE_SUITES: "1"
        run: >-
          pnpm --filter @helix/app exec vitest run
          src/platform/tenancy/cross-tenant-isolation.test.ts

      - name: Disable tenant API rate limit for synthetic load
        run: |
          docker compose -p helix_demo_smoke_ci_${{ github.run_id }} exec -T postgres \
            psql -U helix -d helix_demo_smoke -v ON_ERROR_STOP=1 \
            -c "update orgs set quotas = jsonb_set(quotas, '{api_rps_limit}', 'null'::jsonb, true) where id = '00000000-0000-0000-0000-000000000000';"

      - name: Start Helix API
        env:
          HOST: 0.0.0.0
          PORT: "39531"
          LOG_LEVEL: error
          DATABASE_URL: postgres://helix_app:helix_app_ci@127.0.0.1:39532/helix_demo_smoke
          BETTER_AUTH_ENABLED: "true"
          BETTER_AUTH_URL: http://127.0.0.1:39531
          BETTER_AUTH_TRUSTED_ORIGINS: http://127.0.0.1:39531
          HELIX_PUBLIC_URL: http://127.0.0.1:39531
          HELIX_DEFAULT_ORG_ID: 00000000-0000-0000-0000-000000000000
          MEILI_HOST: http://127.0.0.1:39533
          MEILI_MASTER_KEY: helix_dev_meili_master_key
          RUSTFS_ENDPOINT: http://127.0.0.1:39534
          RUSTFS_ACCESS_KEY: helixrustfs
          RUSTFS_SECRET_KEY: helix_rustfs_dev_secret
          RUSTFS_BUCKET: helix-objects
          MAIL_SMTP_RECEIVER_ENABLED: "false"
        run: |
          pnpm --filter @helix/app exec tsx src/index.ts > /tmp/helix-api.log 2>&1 &
          echo "$!" > /tmp/helix-api.pid
          for attempt in $(seq 1 45); do
            curl -fsS http://127.0.0.1:39531/readyz >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/helix-api.log
          exit 1

      - name: Run authenticated k6 target smoke
        env:
          HELIX_BASE_URL: http://127.0.0.1:39531
          HELIX_SMOKE_CLIENT_ID: helix-local-oauth-client
          HELIX_SMOKE_CLIENT_SECRET: helix-local-dev-secret
          HELIX_SMOKE_K6_API_BASE_URL: http://127.0.0.1:39531
          HELIX_SMOKE_K6_WEB_BASE_URL: http://127.0.0.1:39531
          HELIX_SMOKE_K6_SCENARIO_GROUPS: api_smoke,mail_api,search,chat,mcp,otel_health
          HELIX_SMOKE_K6_DURATION: 2s
          HELIX_K6_RUNNER: docker
          HELIX_K6_DOCKER_API_BASE_URL: http://host.docker.internal:39531
          HELIX_K6_DOCKER_WEB_BASE_URL: http://host.docker.internal:39531
          API_TARGETS: /healthz,/readyz,/metrics
          # The full MCP catalog is roughly 1.7 MB; budget serialization and
          # transfer separately from the low-latency API health probes.
          MCP_CATALOG_P95_MS: "1500"
          MAIL_API_BODY: '{"query":"Renovate","limit":10}'
          MAIL_API_EXPECT: Renovate
          SEARCH_TOOL_IDS: search.query
          SEARCH_BODY: '{"query":"Mail density","types":["chat"],"limit":10}'
          SEARCH_EXPECT: Mail density
          CHAT_BODY: '{"query":"Mail density","limit":10}'
          CHAT_EXPECT: Mail density
          MCP_EXPECT: mail.search
        run: pnpm quality:live-auth-smoke -- --k6-target-smoke

      - name: Stop Helix API
        if: always()
        run: |
          if [ -f /tmp/helix-api.pid ]; then
            kill "$(cat /tmp/helix-api.pid)" || true
          fi

      - name: Stop live demo services
        if: always()
        run: docker compose -p helix_demo_smoke_ci_${{ github.run_id }} down -v --remove-orphans

  accessibility-and-load:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helix-all/helix-workspace
    steps:
      - name: Checkout helix-workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: helix-all/helix-workspace

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: |
            helix-all/helix-workspace/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @helix/web build

      - name: Install Playwright Chromium
        run: pnpm --filter @helix/web exec playwright install --with-deps chromium

      - name: Start web preview
        run: |
          pnpm --filter @helix/web preview > /tmp/helix-web-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/helix-web-preview.log
          exit 1

      - name: Run strict accessibility audit
        env:
          HELIX_A11Y_REPORT_DIR: /tmp/helix-a11y
        run: pnpm quality:a11y

      - name: Upload accessibility report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-report
          path: /tmp/helix-a11y
          retention-days: 7

      - name: Validate k6 quality gate
        run: pnpm quality:k6

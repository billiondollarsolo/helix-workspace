groups:
  - name: helix.tenant_export
    rules:
      - alert: HelixTenantExportStalled
        expr: helix_tenant_export_stalled_jobs > 0
        for: 10m
        labels:
          severity: warning
          priority: P2
          service: tenancy
          operation: tenant_export
        annotations:
          summary: Tenant export job stalled
          runbook_url: docs/specs/05-operations/runbooks/tenant-export-too-large.md
          description: Tenant export materialization jobs have been stalled for at least 10 minutes after crossing the stalled threshold.
      - alert: HelixTenantExportFailed
        expr: sum by (status, object_bytes) (increase(helix_tenant_export_jobs_total{status="failed"}[15m])) > 0
        for: 0m
        labels:
          severity: warning
          priority: P2
          service: tenancy
          operation: tenant_export
        annotations:
          summary: Tenant export job failed
          runbook_url: docs/specs/05-operations/runbooks/tenant-export-too-large.md
          description: Tenant export materialization jobs with object byte mode {{ $labels.object_bytes }} failed in the last 15 minutes.

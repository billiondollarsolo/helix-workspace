{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "helix.serviceAccountName" . }}
  labels:
    {{- include "helix.labels" . | nindent 4 }}
    helix.io/service-account: {{ include "helix.serviceAccountName" . | quote }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.external.vault.enabled }}
    vault.hashicorp.com/role: {{ .Values.external.vault.role | quote }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}

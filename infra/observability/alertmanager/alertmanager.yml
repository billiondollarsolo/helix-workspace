global:
  resolve_timeout: 5m

route:
  receiver: helix-null
  group_by: ["alertname", "severity", "priority", "service", "slo", "tier", "plan_id", "region"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: helix-signup-slo-webhook
      matchers:
        - service="signup"
        - slo="signup_activation"

receivers:
  - name: helix-null
  - name: helix-signup-slo-webhook
    webhook_configs:
      - url: http://host.docker.internal:28462/alertmanager/signup
        send_resolved: true

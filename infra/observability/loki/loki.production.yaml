auth_enabled: true

server:
  http_listen_address: ${POD_IP}
  http_listen_port: 3100
  grpc_listen_address: ${POD_IP}
  grpc_listen_port: 9095
  http_tls_config:
    cert_file: /var/run/loki-server/tls.crt
    key_file: /var/run/loki-server/tls.key
    client_auth_type: RequireAndVerifyClientCert
    client_ca_file: /var/run/loki-client-ca/ca.crt
  log_request_headers: true
  log_request_at_info_level_enabled: true
  log_request_exclude_headers_list: Authorization,Cookie,X-Access-Token,X-Csrf-Token

memberlist:
  join_members: [loki-memberlist.helix-observability.svc.cluster.local:7946]
  bind_addr: ["${POD_IP}"]
  tls_enabled: true
  tls_cert_path: /var/run/loki-memberlist/tls.crt
  tls_key_path: /var/run/loki-memberlist/tls.key
  tls_ca_path: /var/run/loki-memberlist/ca.crt

common:
  path_prefix: /var/lib/loki
  replication_factor: 3
  ring:
    instance_addr: ${POD_IP}
    kvstore:
      store: memberlist
  storage:
    s3:
      endpoint: ${OBSERVABILITY_S3_ENDPOINT}
      bucketnames: ${LOKI_S3_BUCKET}
      region: ${OBSERVABILITY_S3_REGION}
      s3forcepathstyle: false
      insecure: false

ingester:
  wal:
    enabled: true
    dir: /var/lib/loki/wal
    flush_on_shutdown: true

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /var/lib/loki/compactor
  retention_enabled: true
  delete_request_store: s3

frontend:
  log_queries_longer_than: 0s

limits_config:
  allow_structured_metadata: true
  retention_period: 720h
  ingestion_rate_strategy: global
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 15MB
  max_global_streams_per_user: 10000
  max_label_names_per_series: 15
  max_label_name_length: 128
  max_label_value_length: 1024
  max_line_size: 256KB
  max_line_size_truncate: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_lookback: 720h
  max_query_length: 721h
  max_query_parallelism: 16
  max_query_series: 10000
  max_entries_limit_per_query: 5000
  query_timeout: 2m

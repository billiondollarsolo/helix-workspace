{{- if .Values.cloudnativepg.enabled }}
{{- $cnpg := .Values.cloudnativepg }}
{{- $clusterAnnotations := dict "helm.sh/resource-policy" "keep" }}
{{- if $cnpg.tde.enabled }}
{{- $_ := set $clusterAnnotations "helix.io/postgres-tde" "required" }}
{{- with $cnpg.tde.provider }}
{{- $_ := set $clusterAnnotations "helix.io/postgres-tde-provider" . }}
{{- end }}
{{- with $cnpg.tde.kmsKeyId }}
{{- $_ := set $clusterAnnotations "helix.io/postgres-kms-key-id" . }}
{{- end }}
{{- end }}
{{- $clusterAnnotations = mergeOverwrite $clusterAnnotations $cnpg.annotations $cnpg.tde.annotations }}
{{- /*
  CloudNativePG pvcTemplate is a bare PersistentVolumeClaimSpec with no
  metadata, so PVC (storage, WAL, TDE) annotations travel through
  inheritedMetadata, which the operator applies to every object it creates.
*/}}
{{- $storageAnnotations := mergeOverwrite (deepCopy $cnpg.storage.annotations) $cnpg.tde.storageAnnotations }}
{{- if $cnpg.walStorage.enabled }}
{{- $storageAnnotations = mergeOverwrite $storageAnnotations (deepCopy $cnpg.walStorage.annotations) }}
{{- end }}
{{- $inheritedAnnotations := mergeOverwrite (deepCopy $cnpg.inheritedAnnotations) $storageAnnotations $cnpg.tde.inheritedAnnotations }}
{{- $postgresqlParameters := mergeOverwrite (deepCopy $cnpg.postgresql.parameters) $cnpg.tde.postgresqlParameters }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $cnpg.clusterName }}
  labels:
    {{- include "helix.labels" . | nindent 4 }}
  {{- with $clusterAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  imageName: {{ include "helix.cloudnativepgImage" . | quote }}
  instances: {{ $cnpg.instances }}
  resources:
    {{- toYaml $cnpg.resources | nindent 4 }}
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: {{ $cnpg.podAntiAffinityType | quote }}
    topologyKey: kubernetes.io/hostname
    nodeSelector:
      topology.kubernetes.io/region: {{ .Values.external.s3.region | quote }}
  inheritedMetadata:
    labels:
      helix.io/service-account: {{ $cnpg.clusterName | quote }}
    {{- with $inheritedAnnotations }}
    annotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- if or $postgresqlParameters $cnpg.postgresql.synchronous }}
  postgresql:
    {{- with $postgresqlParameters }}
    parameters:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $cnpg.postgresql.synchronous }}
    synchronous:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  storage:
    size: {{ $cnpg.storage.size | quote }}
    {{- with $cnpg.storage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
    {{- if $cnpg.storage.pvcTemplate.enabled }}
    pvcTemplate:
      accessModes:
        {{- toYaml $cnpg.storage.pvcTemplate.accessModes | nindent 8 }}
      resources:
        requests:
          storage: {{ $cnpg.storage.size | quote }}
      {{- with $cnpg.storage.storageClass }}
      storageClassName: {{ . | quote }}
      {{- end }}
      volumeMode: {{ $cnpg.storage.pvcTemplate.volumeMode | quote }}
    {{- end }}
  {{- if $cnpg.walStorage.enabled }}
  walStorage:
    size: {{ $cnpg.walStorage.size | quote }}
    {{- with $cnpg.walStorage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
    {{- if $cnpg.walStorage.pvcTemplate.enabled }}
    pvcTemplate:
      accessModes:
        {{- toYaml $cnpg.walStorage.pvcTemplate.accessModes | nindent 8 }}
      resources:
        requests:
          storage: {{ $cnpg.walStorage.size | quote }}
      {{- with $cnpg.walStorage.storageClass }}
      storageClassName: {{ . | quote }}
      {{- end }}
      volumeMode: {{ $cnpg.walStorage.pvcTemplate.volumeMode | quote }}
    {{- end }}
  {{- end }}
  bootstrap:
    {{- if $cnpg.bootstrap.recovery.enabled }}
    recovery:
      source: {{ required "cloudnativepg.bootstrap.recovery.source is required when recovery is enabled" $cnpg.bootstrap.recovery.source | quote }}
      {{- with $cnpg.bootstrap.recovery.database }}
      database: {{ . | quote }}
      {{- end }}
      {{- with $cnpg.bootstrap.recovery.owner }}
      owner: {{ . | quote }}
      {{- end }}
      {{- with $cnpg.bootstrap.recovery.secret.name }}
      secret:
        name: {{ . | quote }}
      {{- end }}
      {{- with $cnpg.bootstrap.recovery.recoveryTarget }}
      recoveryTarget:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- else }}
    initdb:
      database: {{ $cnpg.bootstrap.database | quote }}
      owner: {{ $cnpg.bootstrap.owner | quote }}
      {{- with $cnpg.bootstrap.secret.name }}
      secret:
        name: {{ . | quote }}
      {{- end }}
      # Runs once as the superuser inside the application database, before
      # the migration Job: extensions the migrations need (pgvector is not a
      # trusted extension) and the Helix role model, so migrations run as the
      # non-superuser owner.
      postInitApplicationSQL:
        {{- include "helix.cloudnativepgBootstrapSQL" . | nindent 8 }}
        {{- range $statement := $cnpg.bootstrap.extraPostInitApplicationSQL }}
        - {{ $statement | quote }}
        {{- end }}
    {{- end }}
  managed:
    roles:
      - name: helix_migration_owner
        ensure: present
        comment: Helix schema owner (NOLOGIN; assumed by the migration login)
        login: false
        superuser: false
        bypassrls: true
        inherit: false
        createdb: false
        createrole: false
        replication: false
      {{- range $role := list "app" "worker" "readonly" }}
      - name: {{ printf "helix_%s" $role }}
        ensure: present
        comment: {{ printf "Helix %s runtime role" $role | quote }}
        login: true
        superuser: false
        bypassrls: false
        inherit: false
        createdb: false
        createrole: false
        replication: false
        passwordSecret:
          name: {{ required (printf "cloudnativepg.roles.%s.passwordSecret is required" $role) (index $cnpg.roles $role).passwordSecret | quote }}
      {{- end }}
  {{- if $cnpg.backup.enabled }}
  plugins:
    - name: {{ $cnpg.backup.pluginName | quote }}
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ include "helix.cloudnativepgObjectStoreName" . | quote }}
        {{- with $cnpg.backup.barmanObjectStore.serverName }}
        serverName: {{ . | quote }}
        {{- end }}
  {{- end }}
  {{- with $cnpg.recovery.externalClusters }}
  externalClusters:
    {{- range $source := . }}
    - name: {{ required "cloudnativepg.recovery.externalClusters[].name is required" $source.name | quote }}
      plugin:
        name: {{ $cnpg.backup.pluginName | quote }}
        parameters:
          barmanObjectName: {{ required "cloudnativepg.recovery.externalClusters[].barmanObjectName is required" $source.barmanObjectName | quote }}
          serverName: {{ required "cloudnativepg.recovery.externalClusters[].serverName is required" $source.serverName | quote }}
    {{- end }}
  {{- end }}
  monitoring:
    enablePodMonitor: {{ $cnpg.monitoring.enablePodMonitor }}
{{- end }}

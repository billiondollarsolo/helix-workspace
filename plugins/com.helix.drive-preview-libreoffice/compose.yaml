services:
  drive-preview-libreoffice:
    image: ghcr.io/helix/drive-preview-libreoffice:latest
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 3000
      DRIVE_PREVIEW_MAX_BYTES: ${DRIVE_PREVIEW_MAX_BYTES:-52428800}
      DRIVE_PREVIEW_WORKDIR: ${DRIVE_PREVIEW_WORKDIR:-/tmp/helix-drive-preview}
      DRIVE_PREVIEW_TIMEOUT_MS: ${DRIVE_PREVIEW_TIMEOUT_MS:-30000}
    ports:
      - "${DRIVE_PREVIEW_LIBREOFFICE_PORT:-28450}:3000"
    volumes:
      - drive-preview-libreoffice-tmp:/tmp/helix-drive-preview
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  drive-preview-libreoffice-tmp:

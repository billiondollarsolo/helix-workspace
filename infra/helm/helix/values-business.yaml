security:
  tier: business
  overrides:
    internalTransit: caddy-mtls
    secrets: sops
    auditHashChain: true
    auditDestinations:
      - postgres
      - immutable-s3
    networkEgress: recommended-allowlist

autoscaling:
  minReplicas: 2
  maxReplicas: 12

podDisruptionBudget:
  minAvailable: 1

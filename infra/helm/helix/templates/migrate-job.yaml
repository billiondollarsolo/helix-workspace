{{- if .Values.migrations.enabled }}
{{- /* First installs create the Job alongside its dependencies; upgrades migrate before rolling code. */}}
{{- $cnpg := .Values.cloudnativepg }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "helix.fullname" . }}-migrate{{ if .Release.IsInstall }}-install{{ end }}
  labels:
    {{- include "helix.labels" . | nindent 4 }}
    helix.io/role: migrate
  {{- if .Release.IsUpgrade }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  {{- with .Values.migrations.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "helix.selectorLabels" . | nindent 8 }}
        helix.io/role: migrate
        helix.io/service-account: {{ include "helix.serviceAccountName" . | quote }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      serviceAccountName: {{ include "helix.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- $nodeSelector := .Values.nodeSelector }}
      {{- if .Values.fips.enabled }}
      {{- $nodeSelector = mergeOverwrite (deepCopy .Values.nodeSelector) .Values.fips.nodeSelector }}
      {{- end }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ include "helix.image" . }}"
          imagePullPolicy: {{ ternary .Values.airgap.pullPolicy .Values.image.pullPolicy .Values.airgap.enabled }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/nodejs/bin/node", "dist/db/migrate.js"]
          # The migration process needs no auth, mailbox, storage or provider secrets.
          env:
            - name: NODE_ENV
              value: production
            - name: HELIX_DEPLOYMENT_KIND
              value: helm
            - name: HELIX_IMAGE
              value: {{ include "helix.image" . | quote }}
            - name: HELIX_REGION
              value: {{ .Values.external.s3.region | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.postgres.urlSecret.name | quote }}
                  key: {{ .Values.external.postgres.urlSecret.key | quote }}
            - name: POSTGRES_TLS_CA_FILE
              value: /var/run/helix/postgres-tls/ca.crt
            # Owner-capable credential for this Job only; application pods
            # never receive it.
            {{- $migrationSecret := .Values.external.postgres.migrationUrlSecret }}
            {{- if $migrationSecret.name }}
            - name: HELIX_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $migrationSecret.name | quote }}
                  key: {{ $migrationSecret.key | quote }}
            {{- else if $cnpg.enabled }}
            - name: HELIX_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-app" $cnpg.clusterName | quote }}
                  key: uri
            {{- end }}
            - name: HELIX_MIGRATION_DATABASE_WAIT_SECONDS
              value: {{ .Values.migrations.databaseWaitSeconds | toString | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with (include "helix.postgresTlsVolumeMount" .) }}{{- . | nindent 12 }}{{- end }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with (include "helix.postgresTlsVolume" .) }}{{- . | nindent 8 }}{{- end }}
{{- end }}

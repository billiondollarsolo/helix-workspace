# Optional install: Meet (video meetings on a bundled LiveKit server) and Calendar.
#
#   docker compose --env-file .env.production \
#     -f docker-compose.yml -f docker-compose.production.yml \
#     -f docker-compose.meet.yml up -d
#
# Without this file nothing here is deployed: the production stack stays on the
# Mail, Drive, Chat, Assistant packaging and runs no media services. Adding it
# switches Helix to the Full Workspace profile (Calendar and Meet) and starts
# LiveKit. Browsers signal through Caddy at /rtc on the Workspace address, so
# Meet needs no hostname of its own.
#
# Before the first start:
#   1. Point HELIX_MEET_TURN_DOMAIN (for example turn.example.com) at this host,
#      DNS only (not proxied).
#   2. Set HELIX_MEET_PUBLIC_IP to the address browsers reach this host on.
#   3. Open TCP 7881 and UDP 7882 (media), UDP 3478 (TURN) and TCP 5349
#      (TURN over TLS) in the host firewall. Keep everything else LiveKit,
#      Egress and their Redis listen on closed (see docs/deployment-production.md).
#   4. Create the Meet secret files (on an existing Meet install this adds only
#      the ones that are missing):
#        node infra/scripts/generate-production-secrets.mjs --add-meet \
#          --dir "$HELIX_PRODUCTION_SECRETS_DIR" --turn-host "$HELIX_MEET_TURN_DOMAIN"
#
# Recording runs on LiveKit Egress, which needs a Redis it shares with LiveKit.
# Egress writes each recording to the meet-recordings volume; Helix reads it
# from the same path, scans it, stores it in the organization's storage and
# deletes the local file.

# Bounded container logs: without a cap one noisy service can fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  helix:
    logging: *default-logging
    environment:
      # The Full Workspace profile: Calendar and Meet on top of the core apps.
      # Helix keeps Meet unavailable without the LiveKit key and secrets below.
      HELIX_WORKSPACE_PROFILE: full
      HELIX_APPS: mail,drive,chat,assistant,calendar,meet
      HELIX_CONFIG_JSON: >-
        {"security":{"tier":"business"},"modules":{"docs":{"enabled":false},"editors":{"enabled":false}}}
      # Browsers connect to wss://<HELIX_DOMAIN>, which Caddy routes to
      # LiveKit at /rtc. Set LIVEKIT_PUBLIC_URL only to use another address.
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-helix}
      LIVEKIT_API_SECRET_FILE: /run/secrets/livekit_api_secret
      # LiveKit runs on the host network (see below); reach its API through the
      # Docker host gateway. Firewalls must let the edge network reach 7880.
      LIVEKIT_INTERNAL_URL: http://${HELIX_LIVEKIT_HOST:-host.docker.internal}:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
      MEET_CAPTURE_SECRET_FILE: /run/secrets/meet_capture_secret
      # Media stays in the deployment's region.
      MEET_MEDIA_REGION: ${HELIX_REGION:?deployment region label is required}
      # The admin DNS checklist checks this TURN record.
      HELIX_MEET_TURN_DOMAIN: ${HELIX_MEET_TURN_DOMAIN:?HELIX_MEET_TURN_DOMAIN is required for the Meet install}
      # Egress writes finished recordings here; Helix reads them from the same
      # path, scans them, copies them to the organization's storage and
      # deletes them.
      MEET_RECORDING_DIR: /recordings
    secrets:
      - livekit_api_secret
      - meet_capture_secret
    volumes:
      - meet-recordings:/recordings
    depends_on:
      meet-recordings-init:
        condition: service_completed_successfully
    extra_hosts:
      - host.docker.internal:host-gateway
    # LiveKit's webhooks arrive here from the host network, on loopback only.
    ports:
      - target: 3000
        published: ${HELIX_LIVEKIT_WEBHOOK_PORT:-33000}
        host_ip: 127.0.0.1
        protocol: tcp

  caddy:
    logging: *default-logging
    environment:
      # Adds the /rtc route to the Workspace site.
      HELIX_MEET_SITE: -on
      HELIX_LIVEKIT_UPSTREAM: ${HELIX_LIVEKIT_HOST:-host.docker.internal}:7880
    extra_hosts:
      - host.docker.internal:host-gateway

  livekit:
    logging: *default-logging
    profiles: !override []
    # The image's shell turns the secret file into the key list and reads the
    # Redis password (LiveKit's REDIS_PASSWORD) it shares with Egress; neither
    # appears in the Compose file or the rendered environment.
    entrypoint: !override
      - /bin/sh
      - -ec
      - |
        LIVEKIT_KEYS="$${LIVEKIT_API_KEY}: $$(cat /run/secrets/livekit_api_secret)"
        REDIS_PASSWORD="$$(cat /run/secrets/livekit_redis_password)"
        export LIVEKIT_KEYS REDIS_PASSWORD
        exec /livekit-server
    environment:
      LIVEKIT_KEYS: !reset null
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-helix}
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: ${HELIX_MEET_RTC_TCP_PORT:-7881}
          udp_port: ${HELIX_MEET_RTC_UDP_PORT:-7882}
          node_ip: ${HELIX_MEET_PUBLIC_IP:?HELIX_MEET_PUBLIC_IP is required for the Meet install}
          use_external_ip: false
        turn:
          enabled: true
          domain: ${HELIX_MEET_TURN_DOMAIN:?HELIX_MEET_TURN_DOMAIN is required for the Meet install}
          udp_port: ${HELIX_MEET_TURN_PORT:-3478}
          tls_port: ${HELIX_MEET_TURNS_PORT:-5349}
          cert_file: /run/secrets/turn_cert
          key_file: /run/secrets/turn_key
        redis:
          address: 127.0.0.1:${HELIX_LIVEKIT_REDIS_PORT:-6390}
        webhook:
          api_key: ${LIVEKIT_API_KEY:-helix}
          urls:
            - http://127.0.0.1:${HELIX_LIVEKIT_WEBHOOK_PORT:-33000}/v1/webhook/livekit
    secrets: !override
      - livekit_api_secret
      - livekit_redis_password
      - turn_cert
      - turn_key
    # Its own Redis, not the stack's: it sits on the host network with LiveKit
    # and Egress, which use it as their message bus.
    depends_on: !override
      livekit-redis:
        condition: service_healthy
    # Host networking: WebRTC media through Docker's port forwarding loses
    # packets (UDP NAT conntrack clashes) and breaks TURN relaying to the SFU.
    # LiveKit therefore listens on the host: 7881/tcp, 7882/udp, 3478/udp and
    # 5349/tcp must be open to the internet; 7880 only to the Docker edge
    # network (Caddy's /rtc route and Workspace).
    network_mode: host
    ports: !reset []
    networks: !reset []
    # Read-only root, no capabilities, non-root user and no-new-privileges
    # come from docker-compose.yml.
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2g
          pids: 1024

  # LiveKit and Egress find each other through this Redis. It holds only
  # transient bus traffic, so nothing is persisted. Host network, like LiveKit,
  # but bound to loopback and protected by a password read from the secret
  # file at start (the heredoc keeps it out of the process arguments and the
  # rendered Compose file).
  livekit-redis:
    logging: *default-logging
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    user: "999:1000"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        exec redis-server - <<EOF
        bind 127.0.0.1
        port ${HELIX_LIVEKIT_REDIS_PORT:-6390}
        protected-mode yes
        save ""
        appendonly no
        maxmemory 192mb
        maxmemory-policy noeviction
        requirepass $$(cat /run/secrets/livekit_redis_password)
        EOF
    secrets:
      - livekit_redis_password
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$(cat /run/secrets/livekit_redis_password)" redis-cli
          -h 127.0.0.1 -p ${HELIX_LIVEKIT_REDIS_PORT:-6390} ping | grep -qx PONG
      interval: 10s
      timeout: 5s
      retries: 10
    network_mode: host
    working_dir: /tmp
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
          pids: 64

  # One-shot: prepares the volume Egress writes recordings to and Helix reads
  # and deletes them from, and Egress's work directory. Defined in
  # docker-compose.yml.
  meet-recordings-init:
    logging: *default-logging
    profiles: !override []

  # Recording: LiveKit Egress renders a room in headless Chrome and writes an
  # MP4 to /recordings, the path Helix reads it from. It takes requests from
  # LiveKit over the shared Redis and joins rooms like a participant, so it
  # sits on the host network with LiveKit. The layout page is served by Egress
  # itself on 127.0.0.1:7980; nothing is fetched from the Internet. It writes
  # only to local files: no cloud storage credentials. The pinned image, the
  # volumes, the read-only root and Chrome's sandbox come from
  # docker-compose.yml.
  egress:
    logging: *default-logging
    profiles: !override []
    # tini (the image's init) reaps Chrome's processes. The API secret and
    # the Redis password are read from the secret files at start, so neither
    # is in the Compose file or the rendered environment.
    entrypoint: !override
      - /tini
      - --
      - /bin/sh
      - -ec
      - |
        LIVEKIT_API_SECRET="$$(cat /run/secrets/livekit_api_secret)"
        EGRESS_CONFIG_BODY="$${EGRESS_CONFIG_BODY}
          password: '$$(cat /run/secrets/livekit_redis_password)'"
        export LIVEKIT_API_SECRET EGRESS_CONFIG_BODY
        mkdir -p /home/egress/.cache/xdgr
        exec /entrypoint.sh
    environment:
      # The redis block stays last: the entrypoint appends its password.
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-helix}
        ws_url: ws://127.0.0.1:7880
        logging:
          level: info
        health_port: ${HELIX_EGRESS_HEALTH_PORT:-7982}
        template_port: 7980
        enable_chrome_sandbox: true
        session_limits:
          file_output_max_duration: ${HELIX_MEET_RECORDING_MAX_DURATION:-4h}
        redis:
          address: 127.0.0.1:${HELIX_LIVEKIT_REDIS_PORT:-6390}
    secrets:
      - livekit_api_secret
      - livekit_redis_password
    depends_on: !override
      livekit-redis:
        condition: service_healthy
      livekit:
        condition: service_started
      meet-recordings-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:${HELIX_EGRESS_HEALTH_PORT:-7982}/ >/dev/null
    network_mode: host
    # Lets a recording in progress finish before the container stops.
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g
          pids: 2048
        reservations:
          cpus: "1.0"
          memory: 1g

secrets:
  livekit_api_secret:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/livekit_api_secret
  meet_capture_secret:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/meet_capture_secret
  livekit_redis_password:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/livekit_redis_password
  # TURN over TLS. Browsers verify it: use a publicly trusted certificate for
  # HELIX_MEET_TURN_DOMAIN (see docs/deployment-production.md).
  turn_cert:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/turn_cert
  turn_key:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/turn_key

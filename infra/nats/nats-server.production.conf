# Production application-role policy. The password is supplied to nats-server
# from a mounted secret by docker-compose.production.yml.
port: 4222
http: 8222
pid_file: "/tmp/nats.pid"

jetstream {
  store_dir: "/data/jetstream"
}

tls {
  cert_file: "/run/secrets/nats_server_cert"
  key_file: "/run/secrets/nats_server_key"
  ca_file: "/run/secrets/nats_ca"
  verify: true
  timeout: 5
}

authorization {
  users: [
    {
      user: "helix_app"
      password: $HELIX_NATS_PASSWORD
      permissions: {
        publish: ["helix.>"]
        subscribe: ["helix.>"]
      }
    }
  ]
}

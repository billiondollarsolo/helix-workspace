{{- if .Values.siem.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ default (printf "%s-siem" (include "helix.fullname" .)) .Values.siem.configMapName }}
  labels:
    {{- include "helix.labels" . | nindent 4 }}
data:
  schema-version: {{ .Values.siem.schemaVersion | quote }}
  endpoint: {{ .Values.external.siem.endpoint | quote }}
  format: {{ .Values.external.siem.format | quote }}
  required-fields: "event_time,tenant_id,actor_id,action,resource,decision,trace_id,hash_prev,hash_current"
{{- end }}

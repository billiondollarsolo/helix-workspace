name: Production Image Security

on:
  pull_request:
    paths:
      - "apps/helix/**"
      - "apps/web/**"
      - "packages/**"
      - ".github/actions/checkout-editors/**"
      - ".github/workflows/production-image-security.yml"
      - "infra/docker/Dockerfile"
      - "infra/caddy/Caddyfile.production"
      - "infra/scripts/validate-production-images.mjs"
      - ".dockerignore"
      - "docker-compose.production.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
    paths:
      - "apps/helix/**"
      - "apps/web/**"
      - "packages/**"
      - ".github/actions/checkout-editors/**"
      - ".github/workflows/production-image-security.yml"
      - "infra/docker/Dockerfile"
      - "infra/caddy/Caddyfile.production"
      - "infra/scripts/validate-production-images.mjs"
      - ".dockerignore"
      - "docker-compose.production.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:
    inputs:
      helix_editors_ref:
        description: Optional paired helix-editors branch, tag, or SHA.
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-sbom-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: helix-all/helix-workspace
    steps:
      - name: Checkout helix-workspace
        uses: actions/checkout@11d2dfd7550a76b50e8157d1e0e3c1b38a4f4d4d # v4
        with:
          path: helix-all/helix-workspace

      - name: Checkout paired helix-editors
        uses: ./helix-all/helix-workspace/.github/actions/checkout-editors
        with:
          requested-ref: ${{ inputs.helix_editors_ref }}
          candidate-ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build reviewed production image
        run: >-
          docker buildx build
          --load
          --build-context helix_editors=../helix-editors
          --file infra/docker/Dockerfile
          --target runtime
          --tag helix/workspace:ci
          .

      - name: Build reviewed production web image
        run: >-
          docker buildx build
          --load
          --build-context helix_editors=../helix-editors
          --file infra/docker/Dockerfile
          --target web-runtime
          --tag helix/workspace-web:ci
          .

      - name: Validate production runtime contracts
        run: >-
          node infra/scripts/validate-production-images.mjs
          --application-image helix/workspace:ci
          --web-image helix/workspace-web:ci

      - name: Generate application SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: helix/workspace:ci
          format: spdx-json
          output-file: helix-all/helix-workspace/helix-workspace.spdx.json

      - name: Generate web SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: helix/workspace-web:ci
          format: spdx-json
          output-file: helix-all/helix-workspace/helix-workspace-web.spdx.json

      - name: Scan application image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: helix/workspace:ci
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: HIGH,CRITICAL

      - name: Scan web image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: helix/workspace-web:ci
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: HIGH,CRITICAL

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push immutable reviewed images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push-images
        shell: bash
        run: |
          set -Eeuo pipefail
          app_image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/helix-workspace:${GITHUB_SHA}"
          web_image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/helix-workspace-web:${GITHUB_SHA}"
          docker tag helix/workspace:ci "$app_image"
          docker tag helix/workspace-web:ci "$web_image"
          docker push "$app_image"
          docker push "$web_image"
          app_digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$app_image" | sed -n "s|^ghcr.io/${GITHUB_REPOSITORY_OWNER}/helix-workspace@||p" | head -n 1)"
          web_digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$web_image" | sed -n "s|^ghcr.io/${GITHUB_REPOSITORY_OWNER}/helix-workspace-web@||p" | head -n 1)"
          [[ "$app_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$web_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "app_digest=$app_digest" >> "$GITHUB_OUTPUT"
          echo "web_digest=$web_digest" >> "$GITHUB_OUTPUT"

      - name: Sign application image build provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: app-provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/helix-workspace
          subject-digest: ${{ steps.push-images.outputs.app_digest }}
          push-to-registry: true

      - name: Sign web image build provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: web-provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/helix-workspace-web
          subject-digest: ${{ steps.push-images.outputs.web_digest }}
          push-to-registry: true

      - name: Sign application image SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: app-sbom-attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/helix-workspace
          subject-digest: ${{ steps.push-images.outputs.app_digest }}
          sbom-path: helix-all/helix-workspace/helix-workspace.spdx.json
          push-to-registry: true

      - name: Sign web image SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: web-sbom-attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/helix-workspace-web
          subject-digest: ${{ steps.push-images.outputs.web_digest }}
          sbom-path: helix-all/helix-workspace/helix-workspace-web.spdx.json
          push-to-registry: true

      - name: Upload image supply-chain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helix-workspace-supply-chain-evidence-${{ github.sha }}
          path: |
            helix-all/helix-workspace/helix-workspace.spdx.json
            helix-all/helix-workspace/helix-workspace-web.spdx.json
            ${{ steps.app-provenance.outputs.bundle-path }}
            ${{ steps.web-provenance.outputs.bundle-path }}
            ${{ steps.app-sbom-attestation.outputs.bundle-path }}
            ${{ steps.web-sbom-attestation.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90

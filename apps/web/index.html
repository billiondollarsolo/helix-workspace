<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c3aed'/%3E%3Cpath d='M10 9h12v4h-8v2h7v4h-7v4h-4V9Z' fill='white'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the Helix appearance settings (theme / density / accent) before
      // first paint to avoid a flash of the wrong theme. Mirrors
      // src/components/settings-store.ts; that store re-applies on hydration.
      (() => {
        const ACCENT_HUE = {
          "#7c3aed": 290,
          "#2563eb": 250,
          "#0891b2": 220,
          "#059669": 150,
          "#dc2626": 25,
          "#ea580c": 50,
          "#db2777": 350,
          "#475569": 260,
        };
        let theme = "light";
        let density = "compact";
        let accent = "#7c3aed";
        try {
          const raw = localStorage.getItem("helix-appearance");
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.theme === "dark") theme = "dark";
            if (parsed.density === "comfortable") density = "comfortable";
            if (typeof parsed.accent === "string" && parsed.accent in ACCENT_HUE) {
              accent = parsed.accent;
            }
          }
        } catch (_) {
          /* localStorage unavailable — fall back to defaults */
        }
        const root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.setAttribute("data-density", density);
        root.style.setProperty("--accent-h", String(ACCENT_HUE[accent]));
      })();
    </script>
    <title>Helix Workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

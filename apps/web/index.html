<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- DNA double-helix mark on the violet tile. Same path data as
         src/components/shell/helix-logo.tsx and Icons.Helix — keep in sync. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c3aed'/%3E%3Cg transform='translate(6 6) scale(0.8333)' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m10 16 1.5 1.5'/%3E%3Cpath d='m14 8-1.5-1.5'/%3E%3Cpath d='M15 2c-1.798 1.998-2.518 3.995-2.807 5.993'/%3E%3Cpath d='m16.5 10.5 1 1'/%3E%3Cpath d='m17 6-2.891-2.891'/%3E%3Cpath d='M2 15c6.667-6 13.333 0 20-6'/%3E%3Cpath d='m20 9 .891.891'/%3E%3Cpath d='M3.109 14.109 4 15'/%3E%3Cpath d='m6.5 12.5 1 1'/%3E%3Cpath d='m7 18 2.891 2.891'/%3E%3Cpath d='M9 22c1.798-1.998 2.518-3.995 2.807-5.993'/%3E%3C/g%3E%3C/svg%3E"
    />
    <script>
      // Apply the Helix appearance settings (theme / density / accent) before
      // first paint to avoid a flash of the wrong theme. Mirrors
      // src/components/settings-store.ts; that store re-applies on hydration.
      (() => {
        const ACCENT_HUE = {
          "#7c3aed": 290,
          "#2563eb": 250,
          "#0891b2": 220,
          "#059669": 150,
          "#dc2626": 25,
          "#ea580c": 50,
          "#db2777": 350,
          "#475569": 260,
        };
        let theme = "light";
        let density = "compact";
        let accent = "#7c3aed";
        try {
          const raw = localStorage.getItem("helix-appearance");
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.theme === "dark") theme = "dark";
            if (parsed.density === "comfortable") density = "comfortable";
            if (typeof parsed.accent === "string" && parsed.accent in ACCENT_HUE) {
              accent = parsed.accent;
            }
          }
        } catch (_) {
          /* localStorage unavailable — fall back to defaults */
        }
        const root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.setAttribute("data-density", density);
        root.style.setProperty("--accent-h", String(ACCENT_HUE[accent]));
      })();
    </script>
    <title>Helix Workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Local development only. Production deployments use the hardened Helm profiles.
name: helix-local-dev

# Bounded container logs: without a cap one noisy service can fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  helix:
    logging: *default-logging
    # The local stack never resolves a remote application tag. Build/tag this image locally;
    # production pulls the signed digest required by the Helm chart.
    image: helix/helix:local
    pull_policy: never
    environment:
      # Deliberately non-overridable: this stack is never a production deployment path.
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HELIX_AI_ALLOW_PRIVATE_NETWORK: ${HELIX_AI_ALLOW_PRIVATE_NETWORK:-false}
      HELIX_SECURITY_TIER: ${HELIX_SECURITY_TIER:-personal}
      HELIX_PUBLIC_URL: ${HELIX_PUBLIC_URL:-http://localhost:28441}
      HELIX_DEFAULT_ORG_ID: ${HELIX_DEFAULT_ORG_ID:-00000000-0000-0000-0000-000000000000}
      DATABASE_URL: postgres://helix_app:helix_app_local@postgres:5432/${POSTGRES_DB:-helix}
      HELIX_FEDERATION_IDENTITY_ENABLED: ${HELIX_FEDERATION_IDENTITY_ENABLED:-false}
      HELIX_FEDERATION_ALLOW_PRIVATE_NETWORK: ${HELIX_FEDERATION_ALLOW_PRIVATE_NETWORK:-false}
      BETTER_AUTH_ENABLED: ${BETTER_AUTH_ENABLED:-true}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:28441}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-helix_local_better_auth_secret_change_me_32_chars}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:28441,http://localhost:3000,http://localhost:5173,http://localhost:4173}
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-helix_dev_meili_master_key}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-helixrustfs}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-helix_rustfs_dev_secret}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-helix-objects}
      AUDIT_IMMUTABLE_S3_ENABLED: ${AUDIT_IMMUTABLE_S3_ENABLED:-false}
      AUDIT_IMMUTABLE_S3_ENDPOINT: ${AUDIT_IMMUTABLE_S3_ENDPOINT:-http://rustfs:9000}
      AUDIT_IMMUTABLE_S3_BUCKET: ${AUDIT_IMMUTABLE_S3_BUCKET:-helix-audit}
      AUDIT_IMMUTABLE_S3_ACCESS_KEY: ${AUDIT_IMMUTABLE_S3_ACCESS_KEY:-helixrustfs}
      AUDIT_IMMUTABLE_S3_SECRET_KEY: ${AUDIT_IMMUTABLE_S3_SECRET_KEY:-helix_rustfs_dev_secret}
      AUDIT_IMMUTABLE_S3_REGION: ${AUDIT_IMMUTABLE_S3_REGION:-us-east-1}
      AUDIT_IMMUTABLE_S3_FORCE_PATH_STYLE: ${AUDIT_IMMUTABLE_S3_FORCE_PATH_STYLE:-true}
      AUDIT_IMMUTABLE_S3_PREFIX: ${AUDIT_IMMUTABLE_S3_PREFIX:-audit/activity}
      AUDIT_IMMUTABLE_S3_BATCH_SIZE: ${AUDIT_IMMUTABLE_S3_BATCH_SIZE:-500}
      AUDIT_IMMUTABLE_S3_INTERVAL_MS: ${AUDIT_IMMUTABLE_S3_INTERVAL_MS:-60000}
      AUDIT_IMMUTABLE_S3_RETENTION_DAYS: ${AUDIT_IMMUTABLE_S3_RETENTION_DAYS:-365}
      AUDIT_IMMUTABLE_S3_OBJECT_LOCK_MODE: ${AUDIT_IMMUTABLE_S3_OBJECT_LOCK_MODE:-COMPLIANCE}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-mailpit}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-1025}
      MAIL_SMTP_SECURE: ${MAIL_SMTP_SECURE:-false}
      MAIL_SMTP_RECEIVER_ENABLED: ${MAIL_SMTP_RECEIVER_ENABLED:-true}
      MAIL_SMTP_RECEIVER_HOST: ${MAIL_SMTP_RECEIVER_HOST:-0.0.0.0}
      MAIL_SMTP_RECEIVER_PORT: ${MAIL_SMTP_RECEIVER_PORT:-2525}
      MAIL_SPAMD_ENABLED: ${MAIL_SPAMD_ENABLED:-false}
      MAIL_SPAMD_HOST: ${MAIL_SPAMD_HOST:-spamd}
      MAIL_SPAMD_PORT: ${MAIL_SPAMD_PORT:-783}
      MAIL_SPAMD_THRESHOLD: ${MAIL_SPAMD_THRESHOLD:-5.0}
      MAIL_CLAMAV_ENABLED: ${MAIL_CLAMAV_ENABLED:-false}
      MAIL_CLAMAV_HOST: ${MAIL_CLAMAV_HOST:-clamav}
      MAIL_CLAMAV_PORT: ${MAIL_CLAMAV_PORT:-3310}
      CERBOS_HTTP_URL: http://cerbos:3592
      HELIX_OBSERVABILITY_ENABLED: ${HELIX_OBSERVABILITY_ENABLED:-false}
      HELIX_OTEL_TRACES_ENDPOINT: ${HELIX_OTEL_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-helix-app}
      # Meet media (LiveKit, `--profile meet`). Development values only.
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-helix}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-helix_dev_livekit_api_secret_change_me}
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      # Browsers reach the development LiveKit directly; production routes
      # /rtc on the Workspace address through Caddy instead.
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:28451}
      MEET_CAPTURE_SECRET: ${MEET_CAPTURE_SECRET:-helix_dev_meet_capture_secret_change_me}
      HELIX_CONFIG_JSON: >-
        {"security":{"tier":"personal"},"observability":{"config":{"otlpEndpoint":"http://otel-collector:4318/v1/traces","sampling":{"traces":1,"toolCalls":1,"permissionChecks":1}}},"plugins":{"com.helix.webhook-out-slack":{"enabled":true}}}
    ports:
      - "127.0.0.1:${HELIX_PORT:-28431}:3000"
      - "127.0.0.1:${HELIX_SMTP_RECEIVE_PORT:-28456}:2525"
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      meilisearch:
        condition: service_started
      rustfs:
        condition: service_started
      cerbos:
        condition: service_started
      mailpit:
        condition: service_started
    healthcheck:
      test: [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:\
          1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    logging: *default-logging
    build:
      context: ./infra/postgres
    image: helix/postgres-pgvector:18.6-pgvector0.8.5
    pull_policy: never
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helix}
      POSTGRES_USER: ${POSTGRES_USER:-helix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helix_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-28432}:5432"
    volumes:
      # PostgreSQL 18 stores versioned clusters beneath /var/lib/postgresql.
      # Existing PostgreSQL 17 volumes require the documented dump/restore upgrade.
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    logging: *default-logging
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-28433}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nats:
    logging: *default-logging
    build:
      context: ./infra/nats
    image: helix/nats-server:2.14.3-patched
    pull_policy: never
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:${NATS_CLIENT_PORT:-28434}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-28435}:8222"
    volumes:
      - nats-data:/data
    restart: unless-stopped

  meilisearch:
    logging: *default-logging
    build:
      context: ./infra/meilisearch
    image: helix/meilisearch:1.51.0-patched
    pull_policy: never
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-helix_dev_meili_master_key}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:${MEILI_PORT:-28436}:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: [
          "CMD-SHELL",
          'wget -qO- http://127.0.0.1:7700/health | grep -q
          ''"status":"available"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rustfs:
    logging: *default-logging
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    command: ["/data"]
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-helixrustfs}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-helix_rustfs_dev_secret}
      RUSTFS_SSE_S3_MASTER_KEY: ${RUSTFS_SSE_S3_MASTER_KEY:-}
      # Include the host:port forms — path-style requests from the host
      # (helix dev server on the host hits http://localhost:28437) carry
      # `Host: localhost:28437`, and without this RustFS tries to parse
      # the port-suffixed host as a bucket name and returns
      # InvalidBucketName.
      RUSTFS_SERVER_DOMAINS: ${RUSTFS_SERVER_DOMAINS:-localhost,rustfs,localhost:28437,localhost:9000,rustfs:9000}
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-28437}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-28438}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: [
          "CMD-SHELL",
          'curl -fsS http://127.0.0.1:9000/health/ready | grep -q
          ''"ready":true''',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  cerbos:
    logging: *default-logging
    build:
      context: ./infra/cerbos
    image: helix/cerbos:0.54.0-patched
    pull_policy: never
    command: ["server", "--config=/config/.cerbos.yaml"]
    ports:
      - "127.0.0.1:${CERBOS_HTTP_PORT:-28439}:3592"
      - "127.0.0.1:${CERBOS_GRPC_PORT:-28440}:3593"
    volumes:
      - ./infra/cerbos/.cerbos.yaml:/config/.cerbos.yaml:ro
      - ./infra/cerbos/policies:/policies:ro
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck"]
      interval: 10s
      timeout: 2s
      retries: 5
    restart: unless-stopped

  # Optional local search provider. Enable and connect it in Admin → AI retrieval.
  searxng:
    logging: *default-logging
    image: searxng/searxng:2026.9.10-931fd9787@sha256:2fb0fa85096fe6df5c3ab98ecb4d6e0ee2ef66b8fb96ce6fce0f75b51c4bd90a
    profiles: ["web-search"]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-helix_local_searxng_secret_change_me_32_chars}
      # The checked-in settings are mounted read-only; do not chown the source tree.
      FORCE_OWNERSHIP: "false"
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-28461}:8080"
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/var/cache/searxng
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Optional password manager (Vaultwarden, Bitwarden-compatible). People get
  # the Passwords app once an admin turns it on in Admin → Apps → Passwords and
  # HELIX_PASSWORDS_URL points at this service.
  vaultwarden:
    logging: *default-logging
    image: vaultwarden/server:1.37.4-alpine@sha256:19ea2b669945d842dadc3d500f2d6a795866a003330f59a47b9634658bae98bb
    profiles: ["passwords"]
    environment:
      DOMAIN: ${HELIX_PASSWORDS_URL:-http://127.0.0.1:28462}
      ROCKET_PORT: 8080
      SIGNUPS_ALLOWED: "true"
      SIGNUPS_VERIFY: "true"
      SHOW_PASSWORD_HINT: "false"
      # No outbound requests to addresses that vault entries name.
      DISABLE_ICON_DOWNLOAD: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURITY: "off"
      SMTP_FROM: passwords@helix.local
    ports:
      - "127.0.0.1:${VAULTWARDEN_PORT:-28462}:8080"
    volumes:
      - vaultwarden-data:/data
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  mailpit:
    logging: *default-logging
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-28457}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-28458}:8025"
    restart: unless-stopped

  # SpamAssassin spamd daemon. Inbound mail ingest scores each received message
  # over the spamd TCP protocol when MAIL_SPAMD_ENABLED=true. Opt-in via the
  # `mail-security` compose profile.
  spamd:
    logging: *default-logging
    build:
      context: ./infra/spamassassin
    image: helix/spamassassin:4.0.2-patched
    pull_policy: never
    profiles: ["mail-security"]
    command: ["spamd", "--allowed-ips=0.0.0.0/0", "--listen=0.0.0.0:783", "--max-children=4"]
    ports:
      - "127.0.0.1:${MAIL_SPAMD_PORT_PUBLISHED:-28459}:783"
    volumes:
      - spamd-data:/var/lib/spamassassin
    healthcheck:
      test: ["CMD-SHELL", "netstat -ltn | grep -q ':783'"]
      interval: 10s
      timeout: 2s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # ClamAV clamd daemon. Inbound mail ingest scans each message over the clamd
  # INSTREAM TCP protocol when MAIL_CLAMAV_ENABLED=true. Opt-in via the
  # `mail-security` compose profile.
  clamav:
    logging: *default-logging
    build:
      context: ./infra/clamav
    image: helix/clamav:1.5.4-patched
    pull_policy: never
    platform: linux/amd64
    profiles: ["mail-security"]
    environment:
      CLAMD_CONF_StreamMaxLength: ${HELIX_DRIVE_AV_MAX_FILE_BYTES:-134217728}
      CLAMD_CONF_MaxFileSize: ${HELIX_DRIVE_AV_MAX_FILE_BYTES:-134217728}
      CLAMD_CONF_MaxScanSize: ${HELIX_DRIVE_ARCHIVE_MAX_UNCOMPRESSED_BYTES:-1073741824}
      CLAMD_CONF_MaxFiles: ${HELIX_DRIVE_ARCHIVE_MAX_ENTRIES:-10000}
      CLAMD_CONF_MaxRecursion: ${HELIX_DRIVE_ARCHIVE_MAX_NESTED:-20}
      CLAMD_CONF_MaxScanTime: ${MAIL_CLAMAV_TIMEOUT_MS:-30000}
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_AlertEncrypted: "yes"
    ports:
      - "127.0.0.1:${MAIL_CLAMAV_PORT_PUBLISHED:-28460}:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 120s
    restart: unless-stopped

  caddy:
    logging: *default-logging
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    environment:
      HELIX_DOMAIN: ${HELIX_DOMAIN:-localhost}
      HELIX_UPSTREAM: ${HELIX_UPSTREAM:-helix:3000}
    ports:
      - "${CADDY_HTTP_PORT:-28441}:80"
      - "${CADDY_HTTPS_PORT:-28442}:443"
      - "${CADDY_HTTPS_PORT:-28442}:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/caddy/optional:/etc/caddy/optional:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - helix
    restart: unless-stopped

  # Meet media (LiveKit). Browsers signal through Caddy at /rtc on the
  # Workspace address; media goes straight to the ports below. Start it with
  # `docker compose --profile meet up -d`.
  livekit:
    logging: *default-logging
    image: livekit/livekit-server:v1.13.10@sha256:89ca9ce0791e18d6e03bf6e2c49ceb27e1c754eae8bd50c989386c1a5963791a
    profiles: ["meet"]
    user: "65532:65532"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-helix}: ${LIVEKIT_API_SECRET:-helix_dev_livekit_api_secret_change_me}"
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          node_ip: ${HELIX_MEET_PUBLIC_IP:-127.0.0.1}
          use_external_ip: false
        redis:
          address: redis:6379
        turn:
          enabled: true
          domain: ${HELIX_MEET_TURN_DOMAIN:-turn.localhost}
          udp_port: 3478
        webhook:
          api_key: ${LIVEKIT_API_KEY:-helix}
          urls:
            - http://helix:3000/webhook/livekit
    ports:
      - "127.0.0.1:${LIVEKIT_HTTP_PORT:-28451}:7880"
      - "${HELIX_MEET_BIND_IP:-127.0.0.1}:7881:7881/tcp"
      - "${HELIX_MEET_BIND_IP:-127.0.0.1}:7882:7882/udp"
      - "${HELIX_MEET_BIND_IP:-127.0.0.1}:3478:3478/udp"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7880/"]
      interval: 10s
      timeout: 5s
      retries: 6
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777,nosuid,nodev,noexec
    restart: unless-stopped

  otel-collector:
    logging: *default-logging
    image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${OTEL_COLLECTOR_GRPC_PORT:-28444}:4317"
      - "127.0.0.1:${OTEL_COLLECTOR_HTTP_PORT:-28445}:4318"
    volumes:
      - ./infra/observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo
    restart: unless-stopped

  prometheus:
    logging: *default-logging
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-28446}:9090"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/rules:/etc/prometheus/rules:ro
      - ./infra/helm/helix/files:/etc/prometheus/product-slos:ro
      - prometheus-data:/prometheus
    depends_on:
      - alertmanager
    restart: unless-stopped

  alertmanager:
    logging: *default-logging
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=0.0.0.0:9093"
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-28461}:9093"
    volumes:
      - ./infra/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

  tempo:
    logging: *default-logging
    image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    command: ["-config.file=/etc/tempo.yaml"]
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${TEMPO_HTTP_PORT:-28447}:3200"
    volumes:
      - ./infra/observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  loki:
    logging: *default-logging
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    command: ["-config.file=/etc/loki/local-config.yaml"]
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${LOKI_PORT:-28448}:3100"
    volumes:
      - ./infra/observability/loki/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  grafana:
    logging: *default-logging
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    profiles: ["observability"]
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_AUTH_ANONYMOUS_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-28449}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro

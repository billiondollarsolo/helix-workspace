apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: tool
  version: default
  importDerivedRoles:
    - helix_platform_roles
  schemas:
    principalSchema:
      ref: cerbos:///platform/principal.json
    resourceSchema:
      ref: cerbos:///platform/tool_resource.json
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      roles: ["system"]

    - actions: ["*"]
      effect: EFFECT_ALLOW
      roles: ["admin"]
      condition:
        match:
          expr: P.attr.org_id == R.attr.org_id

    - actions: ["platform.read"]
      effect: EFFECT_ALLOW
      roles: ["user", "agent", "service_account"]
      condition:
        match:
          expr: P.attr.org_id == R.attr.org_id && R.attr.permission == "platform.read" && P.attr.scopes.exists(scope, scope == "platform.read")

    - actions: ["tools:read"]
      effect: EFFECT_ALLOW
      roles: ["user", "agent", "service_account"]
      condition:
        match:
          expr: P.attr.org_id == R.attr.org_id && R.attr.permission == "tools:read" && P.attr.scopes.exists(scope, scope == "tools:read")

    - actions: ["tools:write"]
      effect: EFFECT_ALLOW
      roles: ["user", "agent", "service_account"]
      condition:
        match:
          expr: P.attr.org_id == R.attr.org_id && R.attr.permission == "tools:write" && P.attr.scopes.exists(scope, scope == "tools:write")

    - actions: ["profile.read"]
      effect: EFFECT_ALLOW
      roles: ["user", "agent", "service_account"]
      condition:
        match:
          expr: P.attr.org_id == R.attr.org_id && R.attr.permission == "profile.read" && P.attr.scopes.exists(scope, scope == "profile.read")

    - actions: ["profile.write"]
      effect: EFFECT_ALLOW
      roles: ["user", "agent", "service_account"]
      condition:
        match:
          expr: P.attr.org_id == R.attr.org_id && R.attr.permission == "profile.write" && P.attr.scopes.exists(scope, scope == "profile.write")

    - actions: ["mail.read"]
      effect: EFFECT_ALLOW
      roles: ["user", "agent", "service_account"]
      condition:
        match:
          expr: P.attr.org_id == R.attr.org_id && R.attr.permission == "mail.read" && P.attr.scopes.exists(scope, scope == "mail.read")

    - actions: ["mail.read:shared"]
      effect: EFFECT_ALLOW
      roles: ["user", "agent", "service_account"]
      condition:
        match:
          expr: P.attr.org_id == R.attr.org_id && R.attr.permission == "mail.read:shared" && P.attr.scopes.exists(scope, scope == "mail.read:shared")

    - actions: ["mail.send"]
      effect: EFFECT_ALLOW
      roles: ["user", "agent", "service_account"]
      condition:

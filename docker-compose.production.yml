name: helix-production

# Production hardening overlay. Apply after docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml config
#
# Secret files are mounted from HELIX_PRODUCTION_SECRETS_DIR (default
# ./secrets). See docs/deployment-production.md for generation and ownership.
#
# ---------------------------------------------------------------------------
# Full Workspace readiness gates (O-DOCKER / PKG) — DOCUMENTATION ONLY
# ---------------------------------------------------------------------------
# Production remains MVP fail-closed (AGENTS.md). This overlay MUST keep:
#   HELIX_APPS=mail,drive,chat,assistant
#   HELIX_CONFIG_JSON modules calendar/meet enabled:false
#   No LiveKit/Meet credentials (Meet stays unavailable)
#   ClamAV + SpamAssassin ON for Mail/Drive Business scanning
#   Immutable digest-only images; data-plane ports unpublished
#
# Do NOT enable Meet, Calendar, Docs, Sheets, Slides, or Editors here until
# PKG.* + domain evidence (CAL/MT/ED) + O-D.7–O-D.10 gates pass.
#
# An operator who chooses to run Meet and Calendar on a single host adds
# docker-compose.meet.yml after this file. That is an explicit opt-in outside
# the 1.0 release scope; this file on its own never deploys them.
#
# PKG flip procedure (operators — after evidence, not a silent default):
#   1. Bind release evidence under artifacts/release-readiness/<date>/<sha>/
#   2. Promote web image built with VITE_HELIX_MVP_ONLY=false
#   3. Set HELIX_WORKSPACE_PROFILE=full and the approved Full Workspace
#      HELIX_APPS allowlist (see docs/architecture/v1-packaging-matrix.md)
#   4. Enable only modules that passed gates; Meet requires LiveKit secrets
#   5. Run helix-migrate, smoke, and RPO/RTO drill (docs/architecture/ha-rpo-rto.md)
#   6. Update AGENTS.md boundary in the same release train (PKG.2)
#
# Compose ↔ Helm parity: docs/architecture/compose-helm-parity.md
# RPO ≤ 24h / RTO ≤ 4h: node infra/scripts/rpo-rto-check.mjs …
# ---------------------------------------------------------------------------

# Bounded container logs: without a cap one noisy service can fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  helix-migrate:
    logging: *default-logging
    image: ${HELIX_IMAGE:?immutable HELIX_IMAGE registry reference with digest is
      required}
    build: !reset "null"
    pull_policy: always
    entrypoint:
      - /nodejs/bin/node
      - dist/db/migrate.js
    environment:
      NODE_ENV: production
      HELIX_DEPLOYMENT_KIND: compose
      HELIX_IMAGE: ${HELIX_IMAGE:?immutable HELIX_IMAGE registry reference with digest
        is required}
      HELIX_WEB_IMAGE: ${HELIX_WEB_IMAGE:?immutable HELIX_WEB_IMAGE registry reference
        with digest is required}
      HELIX_POSTGRES_IMAGE: ${HELIX_POSTGRES_IMAGE:?immutable HELIX_POSTGRES_IMAGE
        registry reference with digest is required}
      HELIX_NATS_IMAGE: ${HELIX_NATS_IMAGE:?immutable HELIX_NATS_IMAGE registry
        reference with digest is required}
      HELIX_MEILISEARCH_IMAGE: ${HELIX_MEILISEARCH_IMAGE:?immutable
        HELIX_MEILISEARCH_IMAGE registry reference with digest is required}
      HELIX_CERBOS_IMAGE: ${HELIX_CERBOS_IMAGE:?immutable HELIX_CERBOS_IMAGE registry
        reference with digest is required}
      HELIX_SPAMD_IMAGE: ${HELIX_SPAMD_IMAGE:?immutable HELIX_SPAMD_IMAGE registry
        reference with digest is required}
      HELIX_CLAMAV_IMAGE: ${HELIX_CLAMAV_IMAGE:?immutable HELIX_CLAMAV_IMAGE registry
        reference with digest is required}
      # The first migration records the default organization's region, and the
      # application refuses organizations stored under another region.
      HELIX_REGION: ${HELIX_REGION:?deployment region label is required, for example eu-central}
      DATABASE_URL: !reset "null"
      DATABASE_URL_FILE: /run/secrets/migration_database_url
      POSTGRES_TLS_CA_FILE: /run/secrets/postgres_ca
      POSTGRES_POOL_MAX: "1"
    secrets:
      - migration_database_url
      - postgres_ca
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-plane
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    user: "10001:10001"
    init: true
    ulimits:
      nofile:
        soft: 1024
        hard: 4096
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
          pids: 128
        reservations:
          memory: 128m

  helix:
    logging: *default-logging
    image: ${HELIX_IMAGE:?immutable HELIX_IMAGE registry reference with digest is
      required}
    build: !reset "null"
    pull_policy: always
    environment:
      NODE_ENV: production
      HELIX_DEPLOYMENT_KIND: compose
      HELIX_IMAGE: ${HELIX_IMAGE:?immutable HELIX_IMAGE registry reference with digest
        is required}
      HELIX_WEB_IMAGE: ${HELIX_WEB_IMAGE:?immutable HELIX_WEB_IMAGE registry reference
        with digest is required}
      HELIX_POSTGRES_IMAGE: ${HELIX_POSTGRES_IMAGE:?immutable HELIX_POSTGRES_IMAGE
        registry reference with digest is required}
      HELIX_NATS_IMAGE: ${HELIX_NATS_IMAGE:?immutable HELIX_NATS_IMAGE registry
        reference with digest is required}
      HELIX_MEILISEARCH_IMAGE: ${HELIX_MEILISEARCH_IMAGE:?immutable
        HELIX_MEILISEARCH_IMAGE registry reference with digest is required}
      HELIX_CERBOS_IMAGE: ${HELIX_CERBOS_IMAGE:?immutable HELIX_CERBOS_IMAGE registry
        reference with digest is required}
      HELIX_SPAMD_IMAGE: ${HELIX_SPAMD_IMAGE:?immutable HELIX_SPAMD_IMAGE registry
        reference with digest is required}
      HELIX_CLAMAV_IMAGE: ${HELIX_CLAMAV_IMAGE:?immutable HELIX_CLAMAV_IMAGE registry
        reference with digest is required}
      HELIX_SECURITY_TIER: business
      HELIX_REGION: ${HELIX_REGION:?deployment region label is required, for example eu-central}
      # Shown in invitations and on the sign-in page.
      HELIX_DEFAULT_ORG_NAME: ${HELIX_DEFAULT_ORG_NAME:?workspace name is required}
      HELIX_PUBLIC_URL: https://${HELIX_DOMAIN:?HELIX_DOMAIN is required}
      PUBLIC_BASE_URL: https://${HELIX_DOMAIN:?HELIX_DOMAIN is required}
      BETTER_AUTH_URL: https://${HELIX_DOMAIN:?HELIX_DOMAIN is required}
      BETTER_AUTH_TRUSTED_ORIGINS: https://${HELIX_DOMAIN:?HELIX_DOMAIN is required}
      HELIX_CONFIG_JSON: >-
        {"security":{"tier":"business"},"modules":{"docs":{"enabled":false},"calendar":{"enabled":false},"meet":{"enabled":false},"editors":{"enabled":false}}}
      HELIX_APPS: mail,drive,chat,assistant
      HELIX_STARTUP_MIGRATION_CHECK: "true"
      # The application resolves only its explicit *_FILE allowlist.
      DATABASE_URL: !reset "null"
      DATABASE_URL_FILE: /run/secrets/database_url
      POSTGRES_TLS_CA_FILE: /run/secrets/postgres_ca
      REDIS_URL: !reset "null"
      REDIS_URL_FILE: /run/secrets/redis_url
      REDIS_TLS_CA_FILE: /run/secrets/redis_ca
      NATS_URL: tls://nats:4222
      NATS_USER: helix_app
      NATS_PASSWORD: !reset "null"
      NATS_PASSWORD_FILE: /run/secrets/nats_password
      NATS_TLS_CA_FILE: /run/secrets/nats_ca
      NATS_TLS_CERT_FILE: /run/secrets/nats_client_cert
      NATS_TLS_KEY_FILE: /run/secrets/nats_client_key
      BETTER_AUTH_SECRET: !reset "null"
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      HELIX_MFA_ASSERTION_SECRET: !reset "null"
      HELIX_MFA_ASSERTION_SECRET_FILE: /run/secrets/mfa_assertion_secret
      # Administrators satisfy the Business-tier MFA gate by signing in with an
      # authenticator app or passkey. An upstream authenticator that signs MFA
      # assertions is optional; these default to this deployment.
      HELIX_MFA_ASSERTION_ISSUER: ${HELIX_MFA_ASSERTION_ISSUER:-https://${HELIX_DOMAIN}}
      HELIX_MFA_ASSERTION_AUDIENCE: ${HELIX_MFA_ASSERTION_AUDIENCE:-helix-workspace}
      RUSTFS_ACCESS_KEY: !reset "null"
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/rustfs_access_key
      RUSTFS_SECRET_KEY: !reset "null"
      RUSTFS_SECRET_KEY_FILE: /run/secrets/rustfs_secret_key
      MEILI_MASTER_KEY: !reset "null"
      MEILI_MASTER_KEY_FILE: /run/secrets/meili_master_key

      HELIX_POSTGRES_ENCRYPTION_AT_REST_ATTESTED: ${HELIX_POSTGRES_ENCRYPTION_AT_REST_ATTESTED:?set
        true only after verifying encrypted Postgres storage}
      HELIX_OBJECT_STORAGE_ENCRYPTION_AT_REST_ATTESTED:
        ${HELIX_OBJECT_STORAGE_ENCRYPTION_AT_REST_ATTESTED:?set
        true only after verifying encrypted object storage}
      HELIX_BACKUP_ENCRYPTION_AT_REST_ATTESTED: ${HELIX_BACKUP_ENCRYPTION_AT_REST_ATTESTED:?set
        true only after verifying encrypted backups}
      # Bundled RustFS: TLS from the deployment PKI and its local KMS. For an
      # external S3 service set RUSTFS_ENDPOINT, RUSTFS_SSE_KMS_KEY_ID and the
      # object-lock values to match that bucket.
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT:-https://rustfs:9000}
      # Browsers upload and download through presigned URLs. The bundled store is
      # private, so those URLs use this deployment's address and Caddy forwards
      # the bucket path. Leave empty for an external store browsers can reach.
      RUSTFS_PUBLIC_ENDPOINT: ${RUSTFS_PUBLIC_ENDPOINT-https://${HELIX_DOMAIN}}
      # Residency: object storage must live in the deployment region.
      RUSTFS_REGION: ${RUSTFS_REGION:-${HELIX_REGION}}
      RUSTFS_SERVER_SIDE_ENCRYPTION: aws:kms
      RUSTFS_SSE_KMS_KEY_ID: ${RUSTFS_SSE_KMS_KEY_ID:-helix-default}
      RUSTFS_OBJECT_LOCK_MODE: ${RUSTFS_OBJECT_LOCK_MODE:-GOVERNANCE}
      RUSTFS_OBJECT_LOCK_RETENTION_DAYS: ${RUSTFS_OBJECT_LOCK_RETENTION_DAYS:-30}
      # Trust the deployment CA that signs the bundled RustFS certificate.
      NODE_EXTRA_CA_CERTS: /run/secrets/rustfs_ca

      MAIL_OUTBOUND_ENABLED: "true"
      MAIL_PROVIDER: ${MAIL_PROVIDER:?a managed outbound provider is required}
      MAIL_FROM_DOMAIN: ${MAIL_FROM_DOMAIN:?Internet sending domain is required}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:?managed provider SMTP host is required}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_USER: ${MAIL_SMTP_USER:?managed provider SMTP user is required}
      MAIL_SMTP_PASS: !reset "null"
      MAIL_SMTP_PASS_FILE: /run/secrets/mail_smtp_password
      MAIL_SMTP_SECURE: ${MAIL_SMTP_SECURE:-false}
      MAIL_PROVIDER_WEBHOOK_ENABLED: "true"
      MAIL_PROVIDER_WEBHOOK_SECRET: !reset "null"
      MAIL_PROVIDER_WEBHOOK_SECRET_FILE: /run/secrets/mail_provider_webhook_secret
      MAIL_SMTP_RECEIVER_ENABLED: "true"
      MAIL_SMTP_RECEIVER_HOST: 0.0.0.0
      MAIL_SMTP_RECEIVER_PORT: 2525
      # Admin → Domains → HTTPS certificate: Helix writes an uploaded certificate
      # to the folder the edge loads and asks it, over its admin socket, to load
      # the folder again.
      HELIX_EDGE_TLS_SOURCE: ${HELIX_CADDY_TLS:-automatic}
      HELIX_EDGE_CERT_DIR: /run/helix-edge-certs
      HELIX_EDGE_ADMIN_SOCKET: /run/caddy-admin/admin.sock
      HELIX_EDGE_PROBE_ADDRESS: caddy:443
      # Inbound SMTP offers STARTTLS with the mail hostname's certificate.
      MAIL_SMTP_RECEIVER_TRANSPORT_SECURITY: starttls
      MAIL_SMTP_RECEIVER_TLS_CERT: !reset "null"
      MAIL_SMTP_RECEIVER_TLS_CERT_FILE: /run/secrets/smtp_tls_cert
      MAIL_SMTP_RECEIVER_TLS_KEY: !reset "null"
      MAIL_SMTP_RECEIVER_TLS_KEY_FILE: /run/secrets/smtp_tls_key
      MAIL_SPAMD_ENABLED: "true"
      MAIL_SPAMD_HOST: spamd
      MAIL_SPAMD_PORT: 783
      MAIL_SPAMD_THRESHOLD: ${MAIL_SPAMD_THRESHOLD:-5}
      MAIL_SPAMD_TIMEOUT_MS: ${MAIL_SPAMD_TIMEOUT_MS:-10000}
      MAIL_CLAMAV_ENABLED: "true"
      MAIL_CLAMAV_HOST: clamav
      MAIL_CLAMAV_PORT: 3310
      MAIL_CLAMAV_TIMEOUT_MS: ${MAIL_CLAMAV_TIMEOUT_MS:-30000}
      DRIVE_CLAMAV_ENABLED: "true"
      DRIVE_CLAMAV_HOST: clamav
      DRIVE_CLAMAV_PORT: 3310
      DRIVE_CLAMAV_TIMEOUT_MS: ${DRIVE_CLAMAV_TIMEOUT_MS:-30000}
      DRIVE_CLAMAV_MAX_BYTES: ${DRIVE_CLAMAV_MAX_BYTES:-1073741824}
      DRIVE_CLAMAV_CHUNK_SIZE_BYTES: ${DRIVE_CLAMAV_CHUNK_SIZE_BYTES:-65536}
      DRIVE_CLAMAV_SCANNER_VERSION: ${DRIVE_CLAMAV_SCANNER_VERSION:-clamd}

      # Meet is outside the core Workspace MVP and its development credentials
      # from the base Compose file must never reach a production process.
      LIVEKIT_API_KEY: !reset "null"
      LIVEKIT_API_SECRET: !reset "null"
      LIVEKIT_INTERNAL_URL: !reset "null"
      LIVEKIT_PUBLIC_URL: !reset "null"
      MEET_CAPTURE_SECRET: !reset "null"
      MEET_RECORDING_DIR: !reset "null"
      # Where people open the optional password manager. Empty unless the
      # deployment sets HELIX_PASSWORDS_DOMAIN (and starts --profile passwords).
      HELIX_PASSWORDS_URL: ${HELIX_PASSWORDS_DOMAIN:+https://${HELIX_PASSWORDS_DOMAIN}}
      # The Business tier requires an immutable copy of the audit log. It goes
      # to an object-locked bucket on the same store, signed with the anchor
      # secret, using the same store credentials.
      AUDIT_IMMUTABLE_S3_ENABLED: "true"
      AUDIT_IMMUTABLE_S3_ENDPOINT: ${RUSTFS_ENDPOINT:-https://rustfs:9000}
      AUDIT_IMMUTABLE_S3_REGION: ${RUSTFS_REGION:-${HELIX_REGION}}
      AUDIT_IMMUTABLE_S3_BUCKET: ${AUDIT_IMMUTABLE_S3_BUCKET:-helix-audit}
      AUDIT_IMMUTABLE_S3_ACCESS_KEY: !reset "null"
      AUDIT_IMMUTABLE_S3_ACCESS_KEY_FILE: /run/secrets/rustfs_access_key
      AUDIT_IMMUTABLE_S3_SECRET_KEY: !reset "null"
      AUDIT_IMMUTABLE_S3_SECRET_KEY_FILE: /run/secrets/rustfs_secret_key
      AUDIT_IMMUTABLE_S3_ANCHOR_KEY_ID: ${AUDIT_IMMUTABLE_S3_ANCHOR_KEY_ID:-helix-audit-anchor-1}
      AUDIT_IMMUTABLE_S3_ANCHOR_SECRET_FILE: /run/secrets/audit_anchor_secret
      AUDIT_IMMUTABLE_S3_OBJECT_LOCK_MODE: ${AUDIT_IMMUTABLE_S3_OBJECT_LOCK_MODE:-COMPLIANCE}
      AUDIT_IMMUTABLE_S3_RETENTION_DAYS: ${AUDIT_IMMUTABLE_S3_RETENTION_DAYS:-365}
      AUDIT_WORM_POSTGRES_ENABLED: "true"
    secrets:
      - database_url
      - postgres_ca
      - redis_url
      - redis_ca
      - nats_password
      - nats_ca
      - nats_client_cert
      - nats_client_key
      - better_auth_secret
      - mfa_assertion_secret
      - rustfs_access_key
      - rustfs_secret_key
      - meili_master_key
      - mail_smtp_password
      - mail_provider_webhook_secret
      - rustfs_ca
      - smtp_tls_cert
      - smtp_tls_key
      - audit_anchor_secret
    ports: !override
      - target: 2525
        published: ${HELIX_SMTP_RECEIVE_PORT:-25}
        host_ip: ${HELIX_SMTP_RECEIVE_BIND_IP:-0.0.0.0}
        protocol: tcp
        mode: host
    depends_on: !override
      helix-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      helix-storage-init:
        condition: service_completed_successfully
      edge-volumes-init:
        condition: service_completed_successfully
      cerbos:
        condition: service_healthy
      spamd:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks: !override
      - edge
      - data-plane
    # Not the development recordings volume: docker-compose.meet.yml adds it.
    volumes: !override
      - edge-certs:/run/helix-edge-certs
      - caddy-admin:/run/caddy-admin
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    user: "10001:10001"
    init: true
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    healthcheck:
      # First boot waits for ClamAV to download and load current signatures.
      start_period: 600s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
          pids: 512
        reservations:
          cpus: "0.25"
          memory: 512m

  postgres:
    logging: *default-logging
    image: ${HELIX_POSTGRES_IMAGE:?immutable HELIX_POSTGRES_IMAGE registry reference
      with digest is required}
    build: !reset "null"
    pull_policy: always
    environment:
      POSTGRES_PASSWORD: !reset "null"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - postgres_app_password
      - postgres_migration_password
      - postgres_ca
      - postgres_server_cert
      - postgres_server_key
    # The image runs as postgres (UID 70). This TLS bootstrap alone starts as
    # root to copy the operator-owned 0600 secret files into a postgres-owned
    # directory; docker-entrypoint.sh then drops to postgres through gosu, so
    # the server never runs as root.
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -euc
      - |
        install -d -m 0700 -o postgres -g postgres /var/run/postgresql/tls
        install -m 0644 -o postgres -g postgres /run/secrets/postgres_ca /var/run/postgresql/tls/ca.pem
        install -m 0644 -o postgres -g postgres /run/secrets/postgres_server_cert /var/run/postgresql/tls/server.pem
        install -m 0600 -o postgres -g postgres /run/secrets/postgres_server_key /var/run/postgresql/tls/server-key.pem
        install -m 0600 -o postgres -g postgres /run/secrets/postgres_app_password /var/run/postgresql/tls/app-password
        install -m 0600 -o postgres -g postgres /run/secrets/postgres_migration_password /var/run/postgresql/tls/migration-password
        {
          echo 'local all all trust'
          echo 'hostssl all all 0.0.0.0/0 scram-sha-256'
          echo 'hostssl all all ::0/0 scram-sha-256'
          echo 'hostnossl all all 0.0.0.0/0 reject'
          echo 'hostnossl all all ::0/0 reject'
        } > /var/run/postgresql/tls/pg_hba.conf
        chown postgres:postgres /var/run/postgresql/tls/pg_hba.conf
        chmod 0600 /var/run/postgresql/tls/pg_hba.conf
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_ca_file=/var/run/postgresql/tls/ca.pem \
          -c ssl_cert_file=/var/run/postgresql/tls/server.pem \
          -c ssl_key_file=/var/run/postgresql/tls/server-key.pem \
          -c hba_file=/var/run/postgresql/tls/pg_hba.conf \
          -c password_encryption=scram-sha-256
    ports: !override []
    networks: !override
      - data-plane
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          memory: 512m

  redis:
    logging: *default-logging
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /run/secrets/redis_server_cert
      - --tls-key-file
      - /run/secrets/redis_server_key
      - --tls-ca-cert-file
      - /run/secrets/redis_ca
      - --tls-auth-clients
      - "no"
      - --aclfile
      - /run/secrets/redis_acl
    secrets:
      - redis_acl
      - redis_password
      - redis_ca
      - redis_server_cert
      - redis_server_key
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli --tls
          --cacert /run/secrets/redis_ca ping | grep -qx PONG
      interval: 10s
      timeout: 5s
      retries: 10
    ports: !override []
    networks: !override
      - data-plane
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  nats:
    logging: *default-logging
    image: ${HELIX_NATS_IMAGE:?immutable HELIX_NATS_IMAGE registry reference with
      digest is required}
    build: !reset "null"
    pull_policy: always
    entrypoint:
      - /bin/sh
      - -euc
      - |
        HELIX_NATS_PASSWORD="$$(tr -d '\r\n' < /run/secrets/nats_password)"
        case "$$HELIX_NATS_PASSWORD" in
          *[!A-Za-z0-9_-]*|'') echo "NATS password must be a non-empty base64url value." >&2; exit 1 ;;
        esac
        export HELIX_NATS_PASSWORD
        exec nats-server --config /etc/nats/nats-server.production.conf
    command: !reset []
    volumes: !override
      - nats-data:/data
      - ./infra/nats/nats-server.production.conf:/etc/nats/nats-server.production.conf:ro
    secrets:
      - nats_password
      - nats_ca
      - nats_server_cert
      - nats_server_key
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8222/healthz | grep -q '"status":"ok"'
      interval: 10s
      timeout: 5s
      retries: 10
    ports: !override []
    networks: !override
      - data-plane
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  meilisearch:
    logging: *default-logging
    image: ${HELIX_MEILISEARCH_IMAGE:?immutable HELIX_MEILISEARCH_IMAGE registry
      reference with digest is required}
    build: !reset "null"
    pull_policy: always
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: !reset "null"
    entrypoint:
      - /bin/sh
      - -euc
      - |
        export MEILI_MASTER_KEY="$$(cat /run/secrets/meili_master_key)"
        exec meilisearch
    secrets:
      - meili_master_key
    ports: !override []
    networks: !override
      - data-plane
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  # One-shot: the two volumes Helix and the edge share start out root-owned,
  # and both services run as the same unprivileged user.
  edge-volumes-init:
    logging: *default-logging
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -euc
      - install -d -m 0700 -o 10001 -g 10001 /certs /admin
    volumes:
      - edge-certs:/certs
      - caddy-admin:/admin
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # One-shot: the RustFS local KMS refuses a key directory it does not own with
  # mode 0700, and a new named volume is root-owned.
  rustfs-kms-init:
    logging: *default-logging
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -euc
      - install -d -m 0700 -o 10001 -g 10001 /kms
    volumes:
      - rustfs-kms:/kms
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: "no"

  rustfs:
    logging: *default-logging
    environment:
      RUSTFS_ACCESS_KEY: !reset "null"
      RUSTFS_SECRET_KEY: !reset "null"
      RUSTFS_SSE_S3_MASTER_KEY: !reset "null"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_SERVER_DOMAINS: rustfs,rustfs:9000,${HELIX_DOMAIN}
      RUSTFS_REGION: ${RUSTFS_REGION:-${HELIX_REGION}}
      # Serve the S3 API over TLS and encrypt objects with the local KMS.
      RUSTFS_TLS_PATH: /tmp/tls
      RUSTFS_KMS_ENABLE: "true"
      RUSTFS_KMS_BACKEND: local
      RUSTFS_KMS_KEY_DIR: /kms
      RUSTFS_KMS_DEFAULT_KEY_ID: ${RUSTFS_SSE_KMS_KEY_ID:-helix-default}
    entrypoint:
      - /bin/sh
      - -euc
      - |
        export RUSTFS_ACCESS_KEY="$$(cat /run/secrets/rustfs_access_key)"
        export RUSTFS_SECRET_KEY="$$(cat /run/secrets/rustfs_secret_key)"
        export RUSTFS_KMS_LOCAL_MASTER_KEY="$$(cat /run/secrets/rustfs_kms_master_key)"
        install -d -m 0700 /tmp/tls
        install -m 0644 /run/secrets/rustfs_server_cert /tmp/tls/rustfs_cert.pem
        install -m 0600 /run/secrets/rustfs_server_key /tmp/tls/rustfs_key.pem
        exec rustfs /data
    volumes:
      - rustfs-data:/data
      - rustfs-kms:/kms
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001,mode=0700
    secrets:
      - rustfs_access_key
      - rustfs_secret_key
      - rustfs_kms_master_key
      - rustfs_ca
      - rustfs_server_cert
      - rustfs_server_key
    depends_on:
      rustfs-kms-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS --cacert /run/secrets/rustfs_ca https://rustfs:9000/health/ready | grep -q '"ready":true'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports: !override []
    # `edge` lets Caddy forward presigned object requests; no port is published.
    networks: !override
      - data-plane
      - edge
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  # One-shot: create the named KMS key Helix encrypts with. RustFS answers 200
  # the first time and 409 once the key exists.
  rustfs-kms-key:
    logging: *default-logging
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    entrypoint:
      - /bin/sh
      - -euc
      - |
        # The credentials reach curl on standard input, never on its command line.
        status="$$(printf 'user = "%s:%s"\n' \
          "$$(cat /run/secrets/rustfs_access_key)" "$$(cat /run/secrets/rustfs_secret_key)" |
          curl -sS -K - -o /tmp/kms-key.out -w '%{http_code}' \
            --cacert /run/secrets/rustfs_ca \
            --aws-sigv4 "aws:amz:$${RUSTFS_REGION}:s3" \
            -X POST "https://rustfs:9000/rustfs/admin/v3/kms/key/create?key-id=$${KMS_KEY_ID}")"
        case "$$status" in
          200) echo "Created KMS key $${KMS_KEY_ID}." ;;
          409) echo "KMS key $${KMS_KEY_ID} already exists." ;;
          *) echo "Creating KMS key $${KMS_KEY_ID} failed with HTTP $$status." >&2; exit 1 ;;
        esac
    environment:
      KMS_KEY_ID: ${RUSTFS_SSE_KMS_KEY_ID:-helix-default}
      RUSTFS_REGION: ${RUSTFS_REGION:-${HELIX_REGION}}
    secrets:
      - rustfs_access_key
      - rustfs_secret_key
      - rustfs_ca
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - data-plane
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # One-shot: the application refuses to start unless its bucket enforces
  # versioning, the SSE-KMS key, and object-lock retention.
  helix-storage-init:
    logging: *default-logging
    image: ${HELIX_IMAGE:?immutable HELIX_IMAGE registry reference with digest is
      required}
    pull_policy: always
    entrypoint:
      - /nodejs/bin/node
      - dist/db/provision-object-store.js
    environment:
      NODE_ENV: production
      NODE_EXTRA_CA_CERTS: /run/secrets/rustfs_ca
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT:-https://rustfs:9000}
      RUSTFS_REGION: ${RUSTFS_REGION:-${HELIX_REGION}}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-helix-objects}
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/rustfs_access_key
      RUSTFS_SECRET_KEY_FILE: /run/secrets/rustfs_secret_key
      RUSTFS_SSE_KMS_KEY_ID: ${RUSTFS_SSE_KMS_KEY_ID:-helix-default}
      RUSTFS_OBJECT_LOCK_MODE: ${RUSTFS_OBJECT_LOCK_MODE:-GOVERNANCE}
      RUSTFS_OBJECT_LOCK_RETENTION_DAYS: ${RUSTFS_OBJECT_LOCK_RETENTION_DAYS:-30}
      AUDIT_IMMUTABLE_S3_BUCKET: ${AUDIT_IMMUTABLE_S3_BUCKET:-helix-audit}
    secrets:
      - rustfs_access_key
      - rustfs_secret_key
      - rustfs_ca
    depends_on:
      rustfs-kms-key:
        condition: service_completed_successfully
    networks:
      - data-plane
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  cerbos:
    logging: *default-logging
    image: ${HELIX_CERBOS_IMAGE:?immutable HELIX_CERBOS_IMAGE registry reference
      with digest is required}
    build: !reset "null"
    pull_policy: always
    ports: !override []
    networks: !override
      - data-plane
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  mailpit:
    logging: *default-logging
    profiles: !override
      - development-only
    ports: !override []
    networks: !override
      - data-plane

  # Optional private search service; only it joins the outbound search network.
  searxng:
    logging: *default-logging
    profiles: !override
      - web-search
    environment:
      SEARXNG_SECRET: !reset "null"
    entrypoint:
      - /bin/sh
      - -euc
      - |
        export SEARXNG_SECRET="$$(cat /run/secrets/searxng_secret)"
        if [ "$${#SEARXNG_SECRET}" -lt 32 ]; then
          echo "searxng_secret must contain at least 32 random characters." >&2
          exit 1
        fi
        exec /usr/local/searxng/entrypoint.sh
    secrets:
      - searxng_secret
    ports: !override []
    networks: !override
      - data-plane
      - web-search-egress
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 256

  # Optional password manager (Vaultwarden). Not started unless the operator
  # passes --profile passwords; reachable only through Caddy at
  # HELIX_PASSWORDS_DOMAIN. Its accounts are separate from Helix accounts:
  # people sign up with an address in the workspace's mail domain and confirm
  # it by email. The server administration page stays off (no ADMIN_TOKEN).
  vaultwarden:
    logging: *default-logging
    profiles: !override
      - passwords
    environment:
      DOMAIN: https://${HELIX_PASSWORDS_DOMAIN:-passwords.invalid}
      SIGNUPS_DOMAINS_WHITELIST: ${HELIX_PASSWORDS_SIGNUP_DOMAINS:-${MAIL_FROM_DOMAIN:-}}
      # Caddy is the only client, so its forwarded address is the real one.
      IP_HEADER: X-Forwarded-For
      SMTP_HOST: ${MAIL_SMTP_HOST:-}
      SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      SMTP_SECURITY: ${HELIX_PASSWORDS_SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${MAIL_SMTP_USER:-}
      SMTP_PASSWORD_FILE: /run/secrets/mail_smtp_password
      SMTP_FROM: ${HELIX_PASSWORDS_MAIL_FROM:-passwords@${MAIL_FROM_DOMAIN:-invalid}}
      SMTP_FROM_NAME: ${HELIX_DEFAULT_ORG_NAME:-Helix} Passwords
    secrets:
      - mail_smtp_password
    ports: !override []
    networks: !override
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 256

  spamd:
    logging: *default-logging
    image: ${HELIX_SPAMD_IMAGE:?immutable HELIX_SPAMD_IMAGE registry reference with
      digest is required}
    build: !reset "null"
    pull_policy: always
    profiles: !override []
    command: !reset []
    environment:
      DNS_CHECKS: "1"
    ports: !override []
    networks: !override
      - data-plane
      - scanner-updates-egress
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  clamav:
    logging: *default-logging
    image: ${HELIX_CLAMAV_IMAGE:?immutable HELIX_CLAMAV_IMAGE registry reference with
      digest is required}
    build: !reset "null"
    pull_policy: always
    profiles: !override []
    environment:
      # Pick up signature updates within a minute. The image's bundled
      # signatures are older than Helix accepts, so first boot depends on it.
      CLAMD_CONF_SelfCheck: "60"
    ports: !override []
    networks: !override
      - data-plane
      - scanner-updates-egress
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  caddy:
    logging: *default-logging
    image: ${HELIX_WEB_IMAGE:?immutable HELIX_WEB_IMAGE registry reference with
      digest is required}
    build: !reset "null"
    pull_policy: always
    environment:
      HELIX_DOMAIN: ${HELIX_DOMAIN:?HELIX_DOMAIN is required}
      HELIX_UPSTREAM: helix:3000
      # Serves the optional password manager's site only when its domain is set.
      HELIX_PASSWORDS_DOMAIN: ${HELIX_PASSWORDS_DOMAIN:-}
      HELIX_PASSWORDS_SITE: ${HELIX_PASSWORDS_DOMAIN:+-on}
      # Certificate source: empty for automatic HTTPS (Let's Encrypt). Add
      # docker-compose.tls-files.yml to serve operator-provided PEM files.
      HELIX_CADDY_TLS: ${HELIX_CADDY_TLS:-}
      # Reachable only through a volume shared with Helix; mode 0200, so only
      # the shared service user can use it.
      HELIX_CADDY_ADMIN: unix//run/caddy-admin/admin.sock
      HELIX_EDGE_CERT_DIR: /run/helix-edge-certs
      # Certificates persist in the caddy-data volume.
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
      HELIX_STORAGE_BUCKET: ${RUSTFS_BUCKET:-helix-objects}
    secrets:
      - rustfs_ca
    ports: !override
      - target: 80
        published: ${CADDY_HTTP_PORT:-80}
        host_ip: ${CADDY_BIND_IP:-0.0.0.0}
        protocol: tcp
        mode: host
      - target: 443
        published: ${CADDY_HTTPS_PORT:-443}
        host_ip: ${CADDY_BIND_IP:-0.0.0.0}
        protocol: tcp
        mode: host
      - target: 443
        published: ${CADDY_HTTPS_PORT:-443}
        host_ip: ${CADDY_BIND_IP:-0.0.0.0}
        protocol: udp
        mode: host
    volumes: !override
      - caddy-data:/data
      - caddy-config:/config
      - edge-certs:/run/helix-edge-certs:ro
      - caddy-admin:/run/caddy-admin
    depends_on: !override
      helix:
        condition: service_healthy
      edge-volumes-init:
        condition: service_completed_successfully
    networks: !override
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    user: "10001:10001"
    ulimits:
      nofile:
        soft: 1024
        hard: 4096
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m
          pids: 128

  # Optional profiles remain private even when an operator explicitly enables
  # them. Use a VPN, SSH tunnel, or separately authenticated admin ingress.
  livekit:
    logging: *default-logging
    environment:
      LIVEKIT_KEYS: !reset "null"
    ports: !override []
    networks: !override
      - data-plane
  egress:
    logging: *default-logging
    environment:
      EGRESS_CONFIG_BODY: !reset "null"
  otel-collector:
    logging: *default-logging
    ports: !override []
    networks: !override
      - data-plane
  prometheus:
    logging: *default-logging
    ports: !override []
    networks: !override
      - data-plane
  alertmanager:
    logging: *default-logging
    ports: !override []
    networks: !override
      - data-plane
  tempo:
    logging: *default-logging
    ports: !override []
    networks: !override
      - data-plane
  loki:
    logging: *default-logging
    ports: !override []
    networks: !override
      - data-plane
  grafana:
    logging: *default-logging
    ports: !override []
    networks: !override
      - data-plane

networks:
  edge:
    name: ${HELIX_COMPOSE_PROJECT_NAME:-helix-production}-edge
  data-plane:
    name: ${HELIX_COMPOSE_PROJECT_NAME:-helix-production}-data-plane
    internal: true
  web-search-egress:
    name: ${HELIX_COMPOSE_PROJECT_NAME:-helix-production}-web-search-egress
  # ClamAV and SpamAssassin download signature and rule updates. Without
  # egress the signatures go stale and Helix reports not ready.
  scanner-updates-egress:
    name: ${HELIX_COMPOSE_PROJECT_NAME:-helix-production}-scanner-updates-egress

secrets:
  searxng_secret:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/searxng_secret
  database_url:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/database_url
  migration_database_url:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/migration_database_url
  postgres_password:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/postgres_password
  postgres_app_password:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/postgres_app_password
  postgres_migration_password:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/postgres_migration_password
  postgres_ca:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/postgres_ca
  postgres_server_cert:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/postgres_server_cert
  postgres_server_key:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/postgres_server_key
  redis_url:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/redis_url
  redis_acl:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/redis_acl
  redis_password:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/redis_password
  redis_ca:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/redis_ca
  redis_server_cert:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/redis_server_cert
  redis_server_key:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/redis_server_key
  nats_password:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/nats_password
  nats_ca:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/nats_ca
  nats_server_cert:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/nats_server_cert
  nats_server_key:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/nats_server_key
  nats_client_cert:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/nats_client_cert
  nats_client_key:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/nats_client_key
  better_auth_secret:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/better_auth_secret
  mfa_assertion_secret:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/mfa_assertion_secret
  rustfs_access_key:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/rustfs_access_key
  rustfs_secret_key:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/rustfs_secret_key
  meili_master_key:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/meili_master_key
  mail_smtp_password:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/mail_smtp_password
  mail_provider_webhook_secret:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/mail_provider_webhook_secret
  rustfs_kms_master_key:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/rustfs_kms_master_key
  rustfs_ca:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/rustfs_ca
  rustfs_server_cert:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/rustfs_server_cert
  rustfs_server_key:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/rustfs_server_key
  smtp_tls_cert:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/smtp_tls_cert
  smtp_tls_key:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/smtp_tls_key
  audit_anchor_secret:
    file: ${HELIX_PRODUCTION_SECRETS_DIR:-./secrets}/audit_anchor_secret

volumes:
  # An HTTPS certificate uploaded in Admin → Domains, as the edge loads it. It
  # is rewritten from the database, so it needs no backup of its own.
  edge-certs:
  # Holds only the edge's admin socket.
  caddy-admin:
  # Local KMS key material for the bundled RustFS. Back it up with rustfs-data:
  # objects cannot be decrypted without it and the rustfs_kms_master_key secret.
  rustfs-kms:

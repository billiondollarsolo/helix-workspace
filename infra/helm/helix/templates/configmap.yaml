apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helix.fullname" . }}-config
  labels:
    {{- include "helix.labels" . | nindent 4 }}
data:
  HELIX_CONFIG_JSON: {{ include "helix.configJson" . | quote }}
  HELIX_SECURITY_TIER: {{ .Values.security.tier | quote }}
  HELIX_PUBLIC_URL: {{ .Values.publicUrl | quote }}
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  {{- /*
    FIPS is opt-in. The Helix crypto adapter treats an explicit
    HELIX_CRYPTO_ADAPTER as an override that selects the FipsCryptoProvider
    regardless of mode, so these keys MUST NOT be emitted unless fips.enabled
    is true. A default install therefore sets no HELIX_FIPS_* / HELIX_CRYPTO_*
    env at all and runs the byte-identical NodeCryptoProvider.
  */}}
  {{- if .Values.fips.enabled }}
  HELIX_FIPS_MODE: {{ .Values.fips.crypto.mode | quote }}
  HELIX_CRYPTO_ADAPTER: {{ .Values.fips.crypto.adapter | quote }}
  HELIX_TLS_MIN_VERSION: {{ .Values.fips.crypto.minTlsVersion | quote }}
  HELIX_TLS_PREFERRED_VERSION: {{ .Values.fips.crypto.preferredTlsVersion | quote }}
  HELIX_TLS_ALLOWED_CIPHERS: {{ join "," .Values.fips.crypto.allowedCipherSuites | quote }}
  {{- end }}
  HELIX_STIG_PROFILE: {{ .Values.stig.profile | quote }}
  HELIX_AIRGAP_MODE: {{ ternary "required" "disabled" .Values.airgap.enabled | quote }}
  RUSTFS_ENDPOINT: {{ .Values.external.s3.endpoint | quote }}
  RUSTFS_BUCKET: {{ .Values.external.s3.bucket | quote }}
  AWS_REGION: {{ .Values.external.s3.region | quote }}
  KMS_ENDPOINT: {{ .Values.external.kms.endpoint | quote }}
  KMS_KEY_ID: {{ .Values.external.kms.keyId | quote }}
  VAULT_ADDR: {{ .Values.external.vault.address | quote }}
  VAULT_NAMESPACE: {{ .Values.external.vault.namespace | quote }}
  HELIX_VAULT_AUTH_PATH: {{ .Values.external.vault.authPath | quote }}
  HELIX_VAULT_ROLE: {{ .Values.external.vault.role | quote }}
  HELIX_BYO_STORAGE_VAULT_MOUNT: {{ default "secret" .Values.external.vault.byoStorageMount | quote }}
  HELIX_BYO_STORAGE_VAULT_KV_VERSION: {{ default "2" .Values.external.vault.byoStorageKvVersion | quote }}
  SIEM_ENDPOINT: {{ .Values.external.siem.endpoint | quote }}
  SIEM_FORMAT: {{ .Values.external.siem.format | quote }}

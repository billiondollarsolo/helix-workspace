{{- /*
  Optional password manager (Vaultwarden). Nothing here is rendered unless
  passwords.enabled is true. It is a separate workload on its own hostname, so
  the vault never shares a browser origin with the workspace, and it keeps its
  own accounts. People see it once an admin turns it on in Admin → Apps →
  Passwords.
*/ -}}
{{- if .Values.passwords.enabled }}
{{- $name := printf "%s-passwords" (include "helix.fullname" .) | trunc 63 | trimSuffix "-" }}
{{- $claim := default $name .Values.passwords.persistence.existingClaim }}
{{- if not .Values.passwords.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "helix.passwords.labels" . | nindent 4 }}
  annotations:
    # The vault outlives the release: uninstalling must not delete people's passwords.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.passwords.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.passwords.persistence.size | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "helix.passwords.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One writer on a ReadWriteOnce volume: stop the old pod before starting the new.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "helix.passwords.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "helix.passwords.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: vaultwarden
          image: {{ printf "%s:%s@%s" .Values.passwords.image.repository .Values.passwords.image.tag .Values.passwords.image.digest | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: DOMAIN
              value: {{ printf "https://%s" .Values.passwords.host | quote }}
            - name: ROCKET_PORT
              value: "8080"
            - name: SIGNUPS_ALLOWED
              value: "true"
            - name: SIGNUPS_VERIFY
              value: "true"
            - name: SIGNUPS_DOMAINS_WHITELIST
              value: {{ .Values.passwords.signupDomains | quote }}
            - name: SHOW_PASSWORD_HINT
              value: "false"
            # No outbound requests to addresses that vault entries name.
            - name: DISABLE_ICON_DOWNLOAD
              value: "true"
            - name: IP_HEADER
              value: X-Forwarded-For
            - name: SMTP_HOST
              value: {{ .Values.passwords.smtp.host | quote }}
            - name: SMTP_PORT
              value: {{ .Values.passwords.smtp.port | quote }}
            - name: SMTP_SECURITY
              value: {{ .Values.passwords.smtp.security | quote }}
            - name: SMTP_FROM
              value: {{ .Values.passwords.smtp.from | quote }}
            {{- with .Values.passwords.smtp.username }}
            - name: SMTP_USERNAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.passwords.smtp.passwordSecretName }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.passwords.smtp.passwordSecretKey | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 30
          resources:
            {{- toYaml .Values.passwords.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $claim }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "helix.passwords.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "helix.passwords.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "helix.passwords.labels" . | nindent 4 }}
  {{- with .Values.passwords.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.passwords.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.passwords.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ $.Values.passwords.host | quote }}
      secretName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.passwords.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "helix.passwords.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "helix.passwords.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- if .Values.passwords.networkPolicy.ingress }}
  ingress:
    - from:
        {{- range $source := .Values.passwords.networkPolicy.ingress }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $source.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml $source.podLabels | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    {{- if .Values.networkPolicy.dns.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dns.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.podLabels | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- with .Values.passwords.networkPolicy.smtpCidr }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.passwords.smtp.port }}
    {{- end }}
{{- end }}

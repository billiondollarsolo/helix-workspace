---
nameOverride: ""
fullnameOverride: ""

replicaCount: 2

# P0-2: graceful shutdown tuning. terminationGracePeriodSeconds must comfortably
# exceed preStopSleepSeconds plus the in-process drain (SHUTDOWN_TIMEOUT_MS).
gracefulShutdown:
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 5

availability:
  # Reference a pre-created PriorityClass in production tiers. Empty keeps the
  # chart usable in clusters where operators cannot create cluster resources.
  priorityClassName: ""
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  startupProbe:
    periodSeconds: 2
    failureThreshold: 60

image:
  repository: ghcr.io/helix/helix
  # Required at install time. Tags are deliberately unsupported.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

imageVerification:
  publicKeySecret:
    name: helix-image-signing-key
    key: cosign.pub

security:
  # personal, business, enterprise, sovereign
  tier: personal
  overrides: {}

publicUrl: https://helix.example.com
# Exact parent hosts allowed to resolve `{tenant}.host`. Empty derives one host
# from publicUrl. Use `env` below to source HELIX_TENANT_PROXY_SECRET from a
# Secret when a trusted edge proxy must assert a tenant independently of Host.
tenantRootHosts: []
logLevel: info
trustedProxies: []

# Production workspace packaging (AGENTS.md + docs/architecture/v1-packaging-matrix.md).
# Defaults are MVP fail-closed. Do NOT set profile=full or enable Meet/Calendar
# modules until PKG.* domain evidence, O-D/O-K deps, and dual-target RPO/RTO drills pass.
# PKG flip procedure: docs/architecture/ha-rpo-rto.md
workspace:
  # mvp | full — full only after evidenced packaging flip (never a silent default).
  profile: mvp
  # Exact production MVP allowlist. Full Workspace allowlist is documented only until PKG.
  apps: "mail,drive,chat,assistant"
  modules:
    calendar:
      enabled: false
    meet:
      enabled: false
  # O-K.10 — Meet/Jitsi deps for Full Workspace (empty = fail-closed if meet in apps).
  # Operators inject secrets via sealed-secrets/CSI; do not commit JWT secrets.
  meet:
    jitsiDomain: ""
    # secretKeyRef name for MEET_JITSI_JWT_SECRET (chart does not invent a secret).
    jitsiJwtSecretName: ""
    jitsiJwtSecretKey: "jwt-secret"

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: helix.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  # PRD 16.1: scale on active WebSocket (Yjs sync + chat realtime) connections in
  # addition to CPU. The app exposes a Prometheus gauge on /metrics; a custom
  # metrics adapter (prometheus-adapter or KEDA) must surface it to the HPA API.
  # See infra/helm/helix/README.md "WebSocket autoscaling" for adapter setup.
  websocketConnections:
    enabled: true
    # metricType: Pods   -> per-pod average (needs a Pods custom-metrics adapter)
    # metricType: External -> cluster-wide value (needs an External-metrics adapter)
    metricType: Pods
    # Prometheus gauge name exposed by the app on /metrics. Scope note: adding
    # this gauge to the app metric set is an apps/** change; this chart only
    # references it by name.
    metricName: helix_websocket_connections_active
    # Target average active WS connections per pod before scaling out.
    targetAverageValue: "150"
    # For metricType=External only: total cluster-wide connections target and an
    # optional selector matched by the external-metrics adapter.
    targetValue: "1200"
    selector: {}
  # Scaling behaviour: WebSocket traffic is spiky, so scale out fast and in slow
  # to avoid disconnecting long-lived sync/chat sessions.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

podDisruptionBudget:
  enabled: true
  minAvailable: 1

monitoring:
  prometheusRule:
    enabled: false
    # Requires Prometheus Operator CRDs (monitoring.coreos.com/v1).
    namespace: ""
    labels: {}
    annotations: {}
    searchRunbookUrl: docs/runbooks/search-projection-lag.md

# Confirmed Helix architecture: core apps are toggleable platform modules that
# ship in ONE image. The primary Deployment above runs the default role (all
# enabled apps). `roleDeployments` optionally adds extra Deployments of the
# SAME image, each booted as a role (HELIX_ROLE) or an explicit app subset
# (HELIX_APPS), so WS-heavy apps (chat, meet) can scale independently. This is
# purely additive — leaving the list empty keeps the single all-in-one
# Deployment. docker-compose stays one all-in-one service.
roleDeployments: []
  # - name: realtime           # suffix appended to the release fullname
  #   role: realtime           # named role: runs chat + meet
  #   replicaCount: 2
  #   # apps: "chat,meet"      # alternatively, an explicit app subset (overrides role)
  #   resources: {}            # optional; falls back to .Values.resources
  #   autoscaling:
  #     enabled: false
  #     minReplicas: 2
  #     maxReplicas: 6
  #     targetCPUUtilizationPercentage: 70
  #   nodeSelector: {}
  #   tolerations: []
  #   affinity: {}
  #   networkPolicy: {}       # optional; defaults to networkPolicy.roleDefault

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Better Auth is always enabled in production. The chart deliberately has no
# inline secret value; installations must provide this Secret out of band.
auth:
  secretRef:
    name: helix-auth
    key: BETTER_AUTH_SECRET

external:
  postgres:
    # Database credentials are accepted only through a Secret reference.
    url: ""
    urlSecret:
      name: helix-postgres
      key: DATABASE_URL
    # Owner-capable credential (helix_migrator) given only to the migration
    # Job as HELIX_MIGRATION_DATABASE_URL. Empty falls back to the
    # CloudNativePG `<clusterName>-app` Secret (key `uri`) when CloudNativePG is
    # enabled, otherwise to DATABASE_URL.
    migrationUrlSecret:
      name: ""
      key: DATABASE_URL
  redis:
    url: redis://redis.example.internal:6379
    urlSecret:
      name: ""
      key: REDIS_URL
  nats:
    url: nats://nats.example.internal:4222
    urlSecret:
      name: ""
      key: NATS_URL
  meilisearch:
    host: http://meilisearch.example.internal:7700
    masterKeySecret:
      name: helix-meilisearch
      key: MEILI_MASTER_KEY
  clamav:
    enabled: true
    host: clamav.example.internal
    port: 3310
    timeoutMs: 30000
    maxSignatureAgeMs: 172800000
  s3:
    endpoint: https://s3.example.internal
    accessKeySecret:
      name: helix-s3
      key: RUSTFS_ACCESS_KEY
    secretKeySecret:
      name: helix-s3
      key: RUSTFS_SECRET_KEY
    bucket: helix-audit
    region: us-east-1
    kmsKeyId: helix-storage
    objectLockMode: compliance
    objectLockRetentionDays: 30
  kms:
    enabled: false
    endpoint: https://kms.example.internal
    keyId: alias/helix
    existingSecret:
      name: helix-kms
      tokenKey: KMS_TOKEN
  vault:
    enabled: false
    address: https://vault.example.internal:8200
    namespace: ""
    authPath: kubernetes
    role: helix
    byoStorageMount: secret
    byoStorageKvVersion: "2"
  siem:
    enabled: false
    endpoint: https://siem.example.internal/ingest
    format: cef
    existingSecret:
      name: helix-siem
      tokenKey: SIEM_TOKEN

helixConfig:
  plugins: {}
  platform:
    storage:
      provider: s3-compatible
      bucket: helix-audit
    audit:
      immutableStore: s3
      kmsKeyRef: alias/helix

env: []

extraVolumes: []
extraVolumeMounts: []

networkPolicy:
  # Every Helix role gets a separate ingress/egress policy. A source or
  # in-cluster destination must match all three identities: namespace, the
  # service-account identity label, and the supplied workload labels.
  dns:
    enabled: true
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns
  application:
    ingress: []
    egress:
      # Public HTTPS excludes private, link-local, metadata, multicast, and
      # documentation ranges. Keep disabled unless this deployment needs it.
      publicHttps: false
      # Private/internal destinations are single hosts only (/32 or /128),
      # each with explicit TCP destination ports.
      endpoints: []
      # In-cluster destinations use exact namespace + service account + pod
      # labels and explicit TCP ports.
      inCluster: []
  # Extra roleDeployments inherit this deny-by-default policy unless that role
  # supplies its own networkPolicy block.
  roleDefault:
    ingress: []
    egress:
      publicHttps: false
      endpoints: []
      inCluster: []
  # The schema migration Job (hook) may reach DNS and PostgreSQL only. With
  # CloudNativePG enabled its cluster pods are allowed automatically; for an
  # external PostgreSQL list the exact host (/32 or /128) and port under
  # endpoints. With vault.agentInject, also list the exact Vault endpoint or
  # in-cluster workload the injected agent needs. Public HTTPS is rejected.
  migrate:
    ingress: []
    egress:
      publicHttps: false
      endpoints: []
      inCluster: []
  # Cosign needs registry access before install/upgrade. It has no ingress and
  # may only use DNS and public HTTPS; sovereign installs disable public HTTPS.
  imageVerifier:
    ingress: []
    egress:
      publicHttps: true
      endpoints: []
      inCluster: []

spire:
  enabled: false
  socketPath: /run/spire/sockets/agent.sock
  trustDomain: helix.local
  workloadSelector: k8s:sa:helix

vault:
  agentInject: false
  secretPath: kv/data/helix
  csi:
    enabled: false
    providerClassName: helix-vault

# In-chart PostgreSQL via the CloudNativePG operator: the Kubernetes database
# path, enabled by the enterprise overlay. Requires CloudNativePG >= 1.26 and
# the Barman Cloud Plugin when backups are enabled. The default stays off: the
# 1.0 business release runs production Compose, and Kubernetes installs without
# CloudNativePG must point external.postgres at PostgreSQL 18 with pgvector
# >= 0.8 (see docs/deployment-production.md#database).
cloudnativepg:
  enabled: false
  clusterName: helix-postgres
  annotations: {}
  inheritedAnnotations: {}
  # Helix CNPG operand: the CloudNativePG `minimal` PostgreSQL 18.6 image plus
  # pgvector 0.8.5 compiled from the same pinned commit as the Compose image
  # (infra/postgres/Dockerfile.cnpg). Tags are unsupported; set the digest
  # published by the Production Image Security workflow.
  image:
    repository: ghcr.io/billiondollarsolo/helix-workspace-postgres-cnpg
    digest: ""
  instances: 3
  postgresql:
    parameters: {}
  storage:
    size: 100Gi
    storageClass: ""
    annotations: {}
    pvcTemplate:
      enabled: false
      accessModes:
        - ReadWriteOnce
      volumeMode: Filesystem
  walStorage:
    enabled: false
    size: 50Gi
    storageClass: ""
    annotations: {}
    pvcTemplate:
      enabled: false
      accessModes:
        - ReadWriteOnce
      volumeMode: Filesystem
  bootstrap:
    database: helix
    # The initdb owner is the migration-only login. It is never a superuser;
    # bootstrap SQL grants it membership in helix_migration_owner.
    owner: helix_migrator
    secret:
      name: ""
    # Appended after the Helix bootstrap SQL (extensions and role model) in
    # bootstrap.initdb.postInitApplicationSQL. Runs once, as the superuser.
    extraPostInitApplicationSQL: []
    recovery:
      enabled: false
      source: helix-postgres-backup
      database: helix
      owner: helix_migrator
      secret:
        name: ""
      recoveryTarget: {}
  # Runtime LOGIN roles reconciled by CloudNativePG managed roles. Each Secret
  # must be type kubernetes.io/basic-auth, labelled cnpg.io/reload=true, and
  # its password must match the credential in the matching DATABASE_URL.
  roles:
    app:
      passwordSecret: helix-postgres-role-app
    worker:
      passwordSecret: helix-postgres-role-worker
    readonly:
      passwordSecret: helix-postgres-role-readonly
  # Mount the operator-generated server CA (`<clusterName>-ca`) and pin it via
  # POSTGRES_TLS_CA_FILE for application and migration pods.
  clientTls:
    enabled: true
  backup:
    enabled: false
    # Barman Cloud Plugin (barman-cloud.cloudnative-pg.io). The in-core
    # `spec.backup.barmanObjectStore` integration is deprecated since
    # CloudNativePG 1.26, and the minimal-based operand ships no barman-cloud.
    pluginName: barman-cloud.cloudnative-pg.io
    target: prefer-standby
    retentionPolicy: 30d
    # Rendered as the ObjectStore `spec.configuration` (same structure as the
    # former in-core barmanObjectStore). RustFS or any S3 endpoint works.
    barmanObjectStore:
      destinationPath: ""
      endpointURL: ""
      serverName: ""
      s3Credentials:
        accessKeyId:
          name: ""
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: ""
          key: ACCESS_SECRET_KEY
        sessionToken:
          name: ""
          key: AWS_SESSION_TOKEN
        inheritFromIAMRole: false
      wal:
        compression: gzip
        encryption: AES256
        maxParallel: 4
        archiveAdditionalCommandArgs: []
        restoreAdditionalCommandArgs: []
      data:
        compression: gzip
        encryption: AES256
        jobs: 2
        additionalCommandArgs: []
      tags: {}
      historyTags: {}
  scheduledBackup:
    enabled: false
    name: ""
    schedule: "0 0 0 * * *"
    backupOwnerReference: cluster
    immediate: false
    suspend: false
    target: ""
  recovery:
    # Each entry: {name, barmanObjectName, serverName}. The ObjectStore named
    # by barmanObjectName must exist in the release namespace.
    externalClusters: []
  tde:
    enabled: false
    provider: ""
    kmsKeyId: ""
    annotations: {}
    inheritedAnnotations: {}
    storageAnnotations: {}
    postgresqlParameters: {}

siem:
  enabled: false
  configMapName: ""
  schemaVersion: "1.0"

fips:
  enabled: false
  imageRepository: registry.example.internal/helix/helix-fips
  imageDigest: ""
  nodeSelector:
    node-restriction.kubernetes.io/fips: "true"
  crypto:
    adapter: node-openssl-fips
    mode: standard
    moduleSource: host-validated
    keyProvider: kms
    randomSource: getrandom
    minTlsVersion: "1.2"
    preferredTlsVersion: "1.3"
    allowedCipherSuites:
      - TLS_AES_256_GCM_SHA384
      - TLS_AES_128_GCM_SHA256
      - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    disallowedAlgorithms:
      - md5
      - sha1-signature
      - rsa-1024
      - tls10
      - tls11
    requireRuntimeAttestation: false

stig:
  enabled: false
  profile: baseline
  imagePolicy:
    requireDigest: false
    forbidLatestTag: false
    requireSignedImages: false
    requireSbom: false
    requireVulnerabilityReport: false
    allowedRegistries: []
    expectedRunAsUser: 10001
    expectedRunAsGroup: 10001
    expectedReadOnlyRootFilesystem: true
    expectedDropCapabilities:
      - ALL

# Schema migrations run as a Helm pre-install/pre-upgrade hook Job, so new code
# never starts against an old schema. Disable only if migrations are applied by
# a pipeline step outside the chart -- a release with neither will serve
# requests against a schema the code does not expect.
migrations:
  enabled: true
  # One retry: the runner takes an advisory lock, so the usual cause of a
  # failure is a database that is not reachable yet rather than contention.
  backoffLimit: 1
  activeDeadlineSeconds: 900
  # Seconds the runner waits for PostgreSQL and its bootstrap prerequisites
  # (extensions, roles) before failing. Covers a CloudNativePG cluster that is
  # still initialising during a first install.
  databaseWaitSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

airgap:
  enabled: false
  imageRegistry: registry.example.internal
  pullPolicy: IfNotPresent

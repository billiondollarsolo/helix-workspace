---
nameOverride: ""
fullnameOverride: ""

replicaCount: 2

# P0-2: graceful shutdown tuning. terminationGracePeriodSeconds must comfortably
# exceed preStopSleepSeconds plus the in-process drain (SHUTDOWN_TIMEOUT_MS).
gracefulShutdown:
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 5

image:
  repository: ghcr.io/helix/helix
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

security:
  # personal, business, enterprise, sovereign
  tier: personal
  overrides: {}

publicUrl: http://helix.local
logLevel: info

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: helix.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  # PRD 16.1: scale on active WebSocket (Yjs sync + chat realtime) connections in
  # addition to CPU. The app exposes a Prometheus gauge on /metrics; a custom
  # metrics adapter (prometheus-adapter or KEDA) must surface it to the HPA API.
  # See infra/helm/helix/README.md "WebSocket autoscaling" for adapter setup.
  websocketConnections:
    enabled: true
    # metricType: Pods   -> per-pod average (needs a Pods custom-metrics adapter)
    # metricType: External -> cluster-wide value (needs an External-metrics adapter)
    metricType: Pods
    # Prometheus gauge name exposed by the app on /metrics. Scope note: adding
    # this gauge to the app metric set is an apps/** change; this chart only
    # references it by name.
    metricName: helix_websocket_connections_active
    # Target average active WS connections per pod before scaling out.
    targetAverageValue: "150"
    # For metricType=External only: total cluster-wide connections target and an
    # optional selector matched by the external-metrics adapter.
    targetValue: "1200"
    selector: {}
  # Scaling behaviour: WebSocket traffic is spiky, so scale out fast and in slow
  # to avoid disconnecting long-lived sync/chat sessions.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Confirmed Helix architecture: core apps are toggleable platform modules that
# ship in ONE image. The primary Deployment above runs the default role (all
# enabled apps). `roleDeployments` optionally adds extra Deployments of the
# SAME image, each booted as a role (HELIX_ROLE) or an explicit app subset
# (HELIX_APPS), so WS-heavy apps (chat, meet) can scale independently. This is
# purely additive — leaving the list empty keeps the single all-in-one
# Deployment. docker-compose stays one all-in-one service.
roleDeployments: []
  # - name: realtime           # suffix appended to the release fullname
  #   role: realtime           # named role: runs chat + meet
  #   replicaCount: 2
  #   # apps: "chat,meet"      # alternatively, an explicit app subset (overrides role)
  #   resources: {}            # optional; falls back to .Values.resources
  #   autoscaling:
  #     enabled: false
  #     minReplicas: 2
  #     maxReplicas: 6
  #     targetCPUUtilizationPercentage: 70
  #   nodeSelector: {}
  #   tolerations: []
  #   affinity: {}

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

external:
  postgres:
    # For production, prefer urlSecret and leave url empty.
    url: >-
      postgres://helix:change-me@postgres.example.internal:5432/helix?sslmode=require
    urlSecret:
      name: ""
      key: DATABASE_URL
  redis:
    url: redis://redis.example.internal:6379
    urlSecret:
      name: ""
      key: REDIS_URL
  nats:
    url: nats://nats.example.internal:4222
    urlSecret:
      name: ""
      key: NATS_URL
  meilisearch:
    host: http://meilisearch.example.internal:7700
    masterKeySecret:
      name: helix-meilisearch
      key: MEILI_MASTER_KEY
  s3:
    endpoint: https://s3.example.internal
    accessKeySecret:
      name: helix-s3
      key: RUSTFS_ACCESS_KEY
    secretKeySecret:
      name: helix-s3
      key: RUSTFS_SECRET_KEY
    bucket: helix-audit
    region: us-east-1
  kms:
    enabled: false
    endpoint: https://kms.example.internal
    keyId: alias/helix
    existingSecret:
      name: helix-kms
      tokenKey: KMS_TOKEN
  vault:
    enabled: false
    address: https://vault.example.internal:8200
    namespace: ""
    authPath: kubernetes
    role: helix
  siem:
    enabled: false
    endpoint: https://siem.example.internal/ingest
    format: cef
    existingSecret:
      name: helix-siem
      tokenKey: SIEM_TOKEN

helixConfig:
  plugins: {}
  platform:
    storage:
      provider: s3-compatible
      bucket: helix-audit
    audit:
      immutableStore: s3
      kmsKeyRef: alias/helix

env: []

extraVolumes: []
extraVolumeMounts: []

monitoring:
  tenantStorageMigrationPrometheusRule:
    enabled: false
    namespace: ""
    labels: {}
    annotations: {}
    runbookUrl: docs/specs/05-operations/runbooks/tenant-storage-migration.md
    stalledFor: 10m
    failedWindow: 15m

networkPolicy:
  enabled: true
  ingress:
    namespaceSelector: {}
    podSelector: {}
  egress:
    allowAll: true
    allowDns: true
    cidrs: []
    ports:
      - protocol: TCP
        port: 443
      - protocol: TCP
        port: 5432
      - protocol: TCP
        port: 4222
      - protocol: TCP
        port: 6379
      - protocol: TCP
        port: 7700
      - protocol: TCP
        port: 8200

spire:
  enabled: false
  socketPath: /run/spire/sockets/agent.sock
  trustDomain: helix.local
  workloadSelector: k8s:sa:helix

vault:
  agentInject: false
  secretPath: kv/data/helix
  csi:
    enabled: false
    providerClassName: helix-vault

cloudnativepg:
  enabled: false
  clusterName: helix-postgres
  annotations: {}
  inheritedAnnotations: {}
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  instances: 3
  postgresql:
    parameters: {}
  storage:
    size: 100Gi
    storageClass: ""
    annotations: {}
    pvcTemplate:
      enabled: false
      accessModes:
        - ReadWriteOnce
      volumeMode: Filesystem
  walStorage:
    enabled: false
    size: 50Gi
    storageClass: ""
    annotations: {}
    pvcTemplate:
      enabled: false
      accessModes:
        - ReadWriteOnce
      volumeMode: Filesystem
  bootstrap:
    database: helix
    owner: helix
    secret:
      name: ""
    recovery:
      enabled: false
      source: helix-postgres-backup
      database: helix
      owner: helix
      secret:
        name: ""
      recoveryTarget: {}
  backup:
    enabled: false
    target: prefer-standby
    retentionPolicy: 30d
    barmanObjectStore:
      destinationPath: ""
      endpointURL: ""
      serverName: ""
      s3Credentials:
        accessKeyId:
          name: ""
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: ""
          key: ACCESS_SECRET_KEY
        sessionToken:
          name: ""
          key: AWS_SESSION_TOKEN
        inheritFromIAMRole: false
      wal:
        compression: gzip
        encryption: AES256
        maxParallel: 4
        additionalCommandArgs: []
      data:
        compression: gzip
        encryption: AES256
        jobs: 2
        additionalCommandArgs: []
      tags: {}
      historyTags: {}
  scheduledBackup:
    enabled: false
    name: ""
    schedule: "0 0 0 * * *"
    backupOwnerReference: cluster
    immediate: false
    suspend: false
    target: ""
  recovery:
    externalClusters: []
  tde:
    enabled: false
    provider: ""
    kmsKeyId: ""
    annotations: {}
    inheritedAnnotations: {}
    storageAnnotations: {}
    postgresqlParameters: {}

siem:
  enabled: false
  configMapName: ""
  schemaVersion: "1.0"

fips:
  enabled: false
  imageRepository: registry.example.internal/helix/helix-fips
  imageDigest: ""
  nodeSelector:
    node-restriction.kubernetes.io/fips: "true"
  crypto:
    adapter: node-openssl-fips
    mode: standard
    moduleSource: host-validated
    keyProvider: kms
    randomSource: getrandom
    minTlsVersion: "1.2"
    preferredTlsVersion: "1.3"
    allowedCipherSuites:
      - TLS_AES_256_GCM_SHA384
      - TLS_AES_128_GCM_SHA256
      - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    disallowedAlgorithms:
      - md5
      - sha1-signature
      - rsa-1024
      - tls10
      - tls11
    requireRuntimeAttestation: false

stig:
  enabled: false
  profile: baseline
  imagePolicy:
    requireDigest: false
    forbidLatestTag: false
    requireSignedImages: false
    requireSbom: false
    requireVulnerabilityReport: false
    allowedRegistries: []
    expectedRunAsUser: 10001
    expectedRunAsGroup: 10001
    expectedReadOnlyRootFilesystem: true
    expectedDropCapabilities:
      - ALL

airgap:
  enabled: false
  imageRegistry: registry.example.internal
  pullPolicy: IfNotPresent

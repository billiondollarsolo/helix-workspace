groups:
  - name: helix.meet.quality
    rules:
      - alert: HelixMeetQualityDegraded
        expr: sum(increase(helix_meet_degraded_samples_total[5m])) by (signal) > 0
        for: 2m
        labels:
          severity: warning
          priority: p2
          service: meet
        annotations:
          summary: "Meet quality degradation detected"
          description: "Meet {{ $labels.signal }} crossed its bounded operational threshold."
      - alert: HelixMeetParticipantInstability
        expr: sum(increase(helix_meet_participant_events_total{event=~"reconnected|device_failure"}[5m])) by (event, device) > 2
        for: 2m
        labels:
          severity: warning
          priority: p2
          service: meet
        annotations:
          summary: "Meet participant instability detected"
          description: "Meet recorded repeated {{ $labels.event }} events for device={{ $labels.device }}."

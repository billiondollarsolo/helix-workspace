name: Restore Drill

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  RUSTFS_ENDPOINT: http://127.0.0.1:28437
  RUSTFS_ACCESS_KEY: helixrustfs
  RUSTFS_SECRET_KEY: helix_rustfs_dev_secret
  AWS_ACCESS_KEY_ID: helixrustfs
  AWS_SECRET_ACCESS_KEY: helix_rustfs_dev_secret
  AWS_DEFAULT_REGION: us-east-1

jobs:
  restore-previous:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch previous independent backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/restore-drill.yml/runs?per_page=30")
          previous=$(jq -c --arg current "$GITHUB_RUN_ID" \
            '[.workflow_runs[] | select((.id | tostring) != $current and .status == "completed")] | first' <<<"$runs")
          [[ "$previous" != "null" ]] || { echo "No previous independent restore-drill run" >&2; exit 1; }
          run_id=$(jq -r .id <<<"$previous")
          created=$(jq -r .created_at <<<"$previous")
          age=$(( ($(date -u +%s) - $(date -u -d "$created" +%s)) / 3600 ))
          (( age <= 36 )) || { echo "Previous backup run is stale (${age}h)" >&2; exit 1; }
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")
          artifact_id=$(jq -r '[.artifacts[] | select(.name == "helix-nightly-backup" and .expired == false)] | first | .id // empty' <<<"$artifacts")
          [[ -n "$artifact_id" ]] || { echo "Previous backup artifact is missing or expired" >&2; exit 1; }
          mkdir -p /tmp/helix-prior
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/helix-prior.zip
          unzip -q /tmp/helix-prior.zip -d /tmp/helix-prior
          mapfile -t archives < <(find /tmp/helix-prior -maxdepth 1 -name '*.tar.gz' -type f -print)
          [[ ${#archives[@]} -eq 1 && -f /tmp/helix-prior/manifest-public.pem ]] \
            || { echo "Previous backup artifact is incomplete" >&2; exit 1; }
          touch -d "$created" "${archives[0]}"
          echo "PRIOR_BACKUP=${archives[0]}" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate restore contracts
        run: infra/scripts/validate-restore-drill.sh

      - name: Start isolated restore dependencies
        run: docker compose up -d postgres rustfs

      - name: Restore prior database and every referenced object
        env:
          HELIX_BACKUP_SIGNING_PUBLIC_KEY: /tmp/helix-prior/manifest-public.pem
        run: |
          infra/scripts/restore-drill.sh \
            --backup "$PRIOR_BACKUP" \
            --max-age-hours 36 \
            --target-db helix_restore_drill \
            --restore-objects \
            --object-target-bucket "helix-drill-$GITHUB_RUN_ID" \
            --execute

      - name: Stop restore dependencies
        if: ${{ always() }}
        run: docker compose down -v

  publish-next-backup:
    if: ${{ always() }}
    needs: restore-previous
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start backup dependencies
        run: docker compose up -d postgres rustfs

      - name: Migrate and seed a referenced proof object
        run: |
          set -Eeuo pipefail
          pnpm --filter @helix/app db:migrate
          pnpm --filter @helix/app db:seed:oauth
          for attempt in $(seq 1 30); do
            aws --no-cli-pager --endpoint-url "$RUSTFS_ENDPOINT" s3api list-buckets >/dev/null 2>&1 && break
            sleep 1
          done
          bucket="helix-nightly-$GITHUB_RUN_ID"
          key="restore-proof/$GITHUB_RUN_ID.bin"
          printf 'independent restore proof %s\n' "$GITHUB_RUN_ID" >/tmp/helix-proof.bin
          size=$(wc -c </tmp/helix-proof.bin | tr -d ' ')
          sha=$(sha256sum /tmp/helix-proof.bin | awk '{print $1}')
          aws --no-cli-pager --endpoint-url "$RUSTFS_ENDPOINT" s3api create-bucket --bucket "$bucket" >/dev/null
          aws --no-cli-pager --endpoint-url "$RUSTFS_ENDPOINT" s3api put-bucket-versioning \
            --bucket "$bucket" --versioning-configuration Status=Enabled
          aws --no-cli-pager --endpoint-url "$RUSTFS_ENDPOINT" s3api put-object \
            --bucket "$bucket" --key "$key" --body /tmp/helix-proof.bin >/dev/null
          docker compose exec -T postgres psql -X -U helix -d helix -v ON_ERROR_STOP=1 \
            -v key="$key" -v size="$size" -v sha="$sha" \
            -c "insert into objects(org_id,kind,storage_key,mime_type,byte_size,sha256,metadata) values(gen_random_uuid(),'file',:'key','application/octet-stream',:'size',:'sha','{\"status\":\"ready\"}');"
          echo "HELIX_BACKUP_RUSTFS_BUCKET=$bucket" >> "$GITHUB_ENV"

      - name: Create signed independent backup
        run: |
          mkdir -p /tmp/helix-next
          openssl genpkey -algorithm Ed25519 -out /tmp/helix-backup-private.pem
          openssl pkey -in /tmp/helix-backup-private.pem -pubout -out /tmp/helix-next/manifest-public.pem
          HELIX_BACKUP_SIGNING_PRIVATE_KEY=/tmp/helix-backup-private.pem \
            infra/scripts/backup.sh \
              --tier personal \
              --output-dir /tmp/helix-next \
              --backup-id "nightly-$GITHUB_RUN_ID" \
              --object-backup \
              --execute
          rm -rf "/tmp/helix-next/nightly-$GITHUB_RUN_ID"

      - name: Upload immutable backup for the next run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helix-nightly-backup
          path: /tmp/helix-next
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Stop backup dependencies
        if: ${{ always() }}
        run: docker compose down -v

  page-restore-failure:
    if: ${{ failure() }}
    needs: restore-previous
    runs-on: ubuntu-latest
    steps:
      - name: Page backup/restore on-call
        env:
          PAGERDUTY_ROUTING_KEY: ${{ secrets.HELIX_BACKUP_PAGERDUTY_ROUTING_KEY }}
        run: |
          set -Eeuo pipefail
          [[ -n "$PAGERDUTY_ROUTING_KEY" ]] || { echo "HELIX_BACKUP_PAGERDUTY_ROUTING_KEY is required" >&2; exit 1; }
          curl -fsS https://events.pagerduty.com/v2/enqueue \
            -H 'content-type: application/json' \
            --data "$(jq -cn \
              --arg key "$PAGERDUTY_ROUTING_KEY" \
              --arg dedup "helix-restore-drill-$GITHUB_RUN_ID" \
              --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              '{routing_key:$key,event_action:"trigger",dedup_key:$dedup,payload:{summary:"Helix independent backup restore drill failed",severity:"critical",source:"github-actions",custom_details:{run:$url}}}')"

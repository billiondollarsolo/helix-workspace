apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: thread
  version: default
  importDerivedRoles:
    - helix_platform_roles
  schemas:
    principalSchema:
      ref: cerbos:///platform/principal.json
    resourceSchema:
      ref: cerbos:///platform/resource.json
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      roles: ["admin"]

    - actions: ["create", "list", "search"]
      effect: EFFECT_ALLOW
      derivedRoles: ["org_member"]

    - actions: ["read", "reply", "post", "react", "search"]
      effect: EFFECT_ALLOW
      derivedRoles: ["participant"]

    - actions: ["read", "search"]
      effect: EFFECT_ALLOW
      derivedRoles: ["shared"]

    - actions: ["read", "search"]
      effect: EFFECT_ALLOW
      derivedRoles: ["org_member"]
      condition:
        match:
          expr: R.attr.visibility == "org"

    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: ["owner"]

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      workspace-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directories:
      - /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /infra/docker
      - /infra/postgres
    schedule:
      interval: weekly
    groups:
      build-images:
        patterns: ["*"]

{{- /*
Role-based Deployments — the scaling hook for the confirmed Helix architecture.

Core apps ship in ONE image. The primary Deployment runs the default role (all
enabled apps). Each entry in .Values.roleDeployments adds an extra Deployment of
the SAME image, booted as a named role (HELIX_ROLE) or an explicit app subset
(HELIX_APPS). This lets WS-heavy apps (chat, meet) scale on their own
Deployment + HPA without a separate image build. Purely additive: an empty
roleDeployments list keeps the single all-in-one Deployment.
*/ -}}
{{- range $role := .Values.roleDeployments }}
{{- $fullname := printf "%s-%s" (include "helix.fullname" $) $role.name | trunc 63 | trimSuffix "-" }}
{{- $autoscaling := $role.autoscaling | default dict }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "helix.labels" $ | nindent 4 }}
    helix.io/role: {{ $role.name | quote }}
spec:
  {{- if not $autoscaling.enabled }}
  replicas: {{ $role.replicaCount | default 1 }}
  {{- end }}
  revisionHistoryLimit: 3
  minReadySeconds: {{ $.Values.availability.minReadySeconds }}
  progressDeadlineSeconds: {{ $.Values.availability.progressDeadlineSeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "helix.selectorLabels" $ | nindent 6 }}
      helix.io/role: {{ $role.name | quote }}
  template:
    metadata:
      labels:
        {{- include "helix.selectorLabels" $ | nindent 8 }}
        helix.io/role: {{ $role.name | quote }}
        helix.io/service-account: {{ include "helix.serviceAccountName" $ | quote }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include "helix.configJson" $ | sha256sum }}
        {{- if $.Values.vault.agentInject }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ $.Values.external.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-helix: {{ $.Values.vault.secretPath | quote }}
        {{- end }}
        {{- if $.Values.spire.enabled }}
        spire.io/trust-domain: {{ $.Values.spire.trustDomain | quote }}
        spire.io/workload-selector: {{ $.Values.spire.workloadSelector | quote }}
        {{- end }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "helix.serviceAccountName" $ }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- $nodeSelector := mergeOverwrite (deepCopy ($role.nodeSelector | default $.Values.nodeSelector)) (dict "topology.kubernetes.io/region" $.Values.external.s3.region) }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "helix.podScheduling" (dict "root" $ "role" $role.name "affinity" ($role.affinity | default $.Values.affinity) "topologySpreadConstraints" ($role.topologySpreadConstraints | default $.Values.topologySpreadConstraints)) | nindent 6 }}
      {{- with ($role.tolerations | default $.Values.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: helix
          image: "{{ include "helix.image" $ }}"
          imagePullPolicy: {{ ternary $.Values.airgap.pullPolicy $.Values.image.pullPolicy $.Values.airgap.enabled }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            {{- include "helix.containerEnv" $ | nindent 12 }}
            {{- /* Role selection: only this Deployment's role's apps boot. */}}
            {{- include "helix.roleEnv" $role | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $.Values.spire.enabled }}
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            {{- end }}
            {{- if $.Values.vault.csi.enabled }}
            - name: vault-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
            {{- end }}
            {{- with $.Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ $.Values.availability.startupProbe.periodSeconds }}
            failureThreshold: {{ $.Values.availability.startupProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml ($role.resources | default $.Values.resources) | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ $.Values.gracefulShutdown.preStopSleepSeconds }}"]
      terminationGracePeriodSeconds: {{ $.Values.gracefulShutdown.terminationGracePeriodSeconds }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $.Values.spire.enabled }}
        - name: spire-agent-socket
          hostPath:
            path: {{ dir $.Values.spire.socketPath | quote }}
            type: Directory
        {{- end }}
        {{- if $.Values.vault.csi.enabled }}
        - name: vault-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ $.Values.vault.csi.providerClassName | quote }}
        {{- end }}
        {{- with $.Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "helix.labels" $ | nindent 4 }}
    helix.io/role: {{ $role.name | quote }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "helix.selectorLabels" $ | nindent 4 }}
    helix.io/role: {{ $role.name | quote }}
{{- if $autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "helix.labels" $ | nindent 4 }}
    helix.io/role: {{ $role.name | quote }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullname }}
  minReplicas: {{ $autoscaling.minReplicas | default 2 }}
  maxReplicas: {{ $autoscaling.maxReplicas | default 6 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $autoscaling.targetCPUUtilizationPercentage | default 70 }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "helix.labels" $ | nindent 4 }}
    helix.io/role: {{ $role.name | quote }}
spec:
  minAvailable: {{ $role.minAvailable | default 1 }}
  selector:
    matchLabels:
      {{- include "helix.selectorLabels" $ | nindent 6 }}
      helix.io/role: {{ $role.name | quote }}
{{- end }}

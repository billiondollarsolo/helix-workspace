name: Editors Contract

on:
  schedule:
    - cron: "17 8 * * 1"
  pull_request:
    paths:
      - "apps/helix/src/platform/editors/**"
      - "packages/sdk-types/**"
      - "infra/scripts/verify-workspace-editor-boundaries.mjs"
      - "infra/scripts/verify-workspace-editor-boundaries.test.mjs"
      - "infra/scripts/verify-editors-contract.sh"
      - ".github/actions/checkout-editors/action.yml"
      - ".github/workflows/editors-contract.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      helix_editors_ref:
        description: "helix-editors ref to test against"
        required: false
        type: string
        default: main

jobs:
  editors-package-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: helix-all/helix-workspace
    steps:
      - name: Checkout helix-workspace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: helix-all/helix-workspace

      - name: Checkout paired helix-editors
        uses: ./helix-all/helix-workspace/.github/actions/checkout-editors
        with:
          requested-ref: ${{ inputs.helix_editors_ref }}
          candidate-ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            helix-all/helix-workspace/pnpm-lock.yaml
            helix-all/helix-editors/pnpm-lock.yaml

      - name: Install helix-workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace SDK contract
        run: pnpm --filter @helix/sdk-types... build

      - name: Install helix-editors dependencies
        working-directory: helix-all/helix-editors
        run: pnpm install --frozen-lockfile

      - name: Verify editors package boundary
        run: pnpm quality:editors-contract

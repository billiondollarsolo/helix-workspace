<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf9" />
    <!-- The Helix mark: Lucide's `dna` glyph. Generated from
         src/components/shell/helix-mark.ts and checked against it by
         helix-mark.test.ts — do not hand-edit the path data here. Inline
         because there is no public/ directory to serve a file from, and the
         stroke colour is fixed per scheme rather than `currentColor`, which
         a favicon resolves to black. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236d28d9' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cstyle%3E@media(prefers-color-scheme:dark)%7Bsvg%7Bstroke:%23a491ff%7D%7D%3C/style%3E%3Cpath d='m10 16 1.5 1.5'/%3E%3Cpath d='m14 8-1.5-1.5'/%3E%3Cpath d='M15 2c-1.798 1.998-2.518 3.995-2.807 5.993'/%3E%3Cpath d='m16.5 10.5 1 1'/%3E%3Cpath d='m17 6-2.891-2.891'/%3E%3Cpath d='M2 15c6.667-6 13.333 0 20-6'/%3E%3Cpath d='m20 9 .891.891'/%3E%3Cpath d='M3.109 14.109 4 15'/%3E%3Cpath d='m6.5 12.5 1 1'/%3E%3Cpath d='m7 18 2.891 2.891'/%3E%3Cpath d='M9 22c1.798-1.998 2.518-3.995 2.807-5.993'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the Helix appearance settings (theme / density / accent) before
      // first paint to avoid a flash of the wrong theme. Mirrors
      // src/components/settings-store.ts; that store re-applies on hydration.
      (() => {
        const ACCENT_HUE = {
          "#7c3aed": 290,
          "#2563eb": 250,
          "#0891b2": 220,
          "#059669": 150,
          "#dc2626": 25,
          "#ea580c": 50,
          "#db2777": 350,
          "#475569": 260,
        };
        let theme = "light";
        let density = "compact";
        let accent = "#7c3aed";
        let fontScale = "default";
        try {
          const raw = localStorage.getItem("helix-appearance");
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.theme === "dark") theme = "dark";
            if (parsed.density === "comfortable") density = "comfortable";
            if (["small", "default", "large", "xl"].includes(parsed.fontScale)) {
              fontScale = parsed.fontScale;
            }
            if (typeof parsed.accent === "string" && parsed.accent in ACCENT_HUE) {
              accent = parsed.accent;
            }
          }
        } catch (_) {
          /* localStorage unavailable — fall back to defaults */
        }
        const root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.setAttribute("data-density", density);
        root.setAttribute("data-font-scale", fontScale);
        root.style.colorScheme = theme;
        root.style.setProperty("--accent-h", String(ACCENT_HUE[accent]));
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#0a0a0b" : "#fafaf9");
      })();
    </script>
    <title>Helix Workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
